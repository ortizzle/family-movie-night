function shuffledOrder(n){
  var arr = [];
  for (var i=0;i<n;i++) arr.push(i);
  for (var j=arr.length-1;j>0;j--){
    var k = Math.floor(Math.random()*(j+1));
    var tmp = arr[j]; arr[j] = arr[k]; arr[k] = tmp;
  }
  return arr;
}

/* ===== fmn/home.js ===== */
/* Family Movie Night — fmn/home.js
   The header, the projector screen, Coming Attractions, the night cards.

   These files load in a fixed order from index.html and share one global
   scope, exactly as the single inline script did. Order matters: boot.js
   runs the startup calls and must stay last. */

/* ---------- RENDER: shared ---------- */
var view = 'home';
var quoteIndex = 0;
/* Memory-book browsing state. Module-level so a background sync repaint
   doesn't drop what someone was searching for. The filter itself never calls
   render() — render() rebuilds the whole page, which would tear the search
   box out from under the keyboard mid-word. It shows and hides cards that
   are already on the page instead. */
var bookQuery = '';
var bookPicker = null;
var bookExpanded = false;
var BOOK_PAGE = 8;      // recent nights shown before "show all"
var BOOK_FILTER_AT = 12; // book size that earns a filter row

/* Jumping from a Recent Fridays row down to that night's card. The card may
   be filtered out, or sitting past the "show all" cap, so clear the browsing
   state on the way — landing on a card the book is currently hiding would
   scroll to nothing. render() rebuilds everything, so the scroll waits for
   the new card and happens in renderHome once it exists. */
var pendingJump = null;
function jumpToNight(nightId){
  bookQuery = '';
  bookPicker = null;
  bookExpanded = true;
  pendingJump = nightId;
  render();
}
function runPendingJump(){
  if (!pendingJump) return;
  var card = document.getElementById('night-' + pendingJump);
  pendingJump = null;
  if (!card) return;
  var smooth = document.documentElement.classList.contains('motion-on');
  requestAnimationFrame(function(){
    card.scrollIntoView({ block:'center', behavior: smooth ? 'smooth' : 'auto' });
    /* a beat of highlight, so it's obvious which card you were sent to */
    card.classList.add('landed');
    setTimeout(function(){ card.classList.remove('landed'); }, 1800);
  });
}

function renderHeader(app){
  var header = el('header');
  var h1 = el('h1');
  h1.appendChild(document.createTextNode('Family Movie Night'));
  h1.appendChild(el('span','pop','!'));
  header.appendChild(h1);
  header.appendChild(el('div','now','The Ortiz Family · Fridays on the Couch'));
  var doo = el('div','doodles','🎞️ 🍿 ⭐');
  doo.setAttribute('aria-hidden','true');
  header.appendChild(doo);
  app.appendChild(header);
}
function renderTabbar(){
  var bar = document.getElementById('tabbar');
  while (bar.firstChild) bar.removeChild(bar.firstChild);
  [
    { id:'home',     ico:'🍿', label:'Nights' },
    { id:'ideas',    ico:'💡', label:'Ideas' },
    { id:'stats',    ico:'🏆', label:'Stats' },
    { id:'trivia',   ico:'🎯', label:'Trivia' },
    { id:'settings', ico:'⚙️', label:'Settings' }
  ].forEach(function(t){
    var b = el('button', view === t.id ? 'active' : '');
    b.appendChild(el('span','ico', t.ico));
    b.appendChild(document.createTextNode(t.label));
    b.addEventListener('click', function(){
      view = t.id;
      render();
      window.scrollTo(0, 0);
    });
    bar.appendChild(b);
  });
}

/* ---------- RENDER: home ---------- */
function renderHome(app){
  var np = nextPicker();
  var sb = el('div','screenbox');
  var screen = el('div','screen');
  var dust = el('div','dust'); dust.setAttribute('aria-hidden','true');
  screen.appendChild(dust);
  var b1 = el('span','burn b1'); b1.setAttribute('aria-hidden','true');
  var b2 = el('span','burn b2'); b2.setAttribute('aria-hidden','true');
  screen.appendChild(b1); screen.appendChild(b2);
  var inner = el('div','screen-inner');
  /* the very next slot on the calendar, booked or not — but never a Friday
     the family has taken off, or the marquee would announce a night that
     isn't happening */
  var upNext = openSlots(lineupSlots(1))[0];
  // a bonus night sooner than the next turn is the next thing happening, and
  // worth announcing — but it never changes whose turn it is
  var soonestBonus = bonusNights()[0];
  var showBonus = soonestBonus && soonestBonus.date < upNext.date;
  if (showBonus){
    upNext = { date: soonestBonus.date, member: memberById(soonestBonus.pickedBy),
               title: soonestBonus.title, night: soonestBonus };
  }
  var booked = upNext.night;
  var who = showBonus ? upNext.member : np;
  /* movie night itself deserves a different announcement than "coming up",
     and a slightly hotter bulb — see .screen.tonight */
  var isTonight = upNext.date === AZ.today();
  if (isTonight) screen.classList.add('tonight');
  inner.appendChild(el('div','label' + (isTonight ? ' tonight' : ''), isTonight
    ? (showBonus
        ? (soonestBonus.venue === 'theater' ? 'Tonight — at the theatre' : 'Tonight’s bonus')
        : booked ? 'Tonight’s feature' : 'Tonight')
    : (showBonus
        ? (soonestBonus.venue === 'theater' ? 'Bonus — at the theatre…' : 'Bonus movie…')
        : booked ? 'Coming up…' : 'Up next…')));
  var pn = el('div','pickname', showBonus
    ? 'Family bonus 🎟️'
    : booked ? np.name + '’s pick 🍿'
    : 'It’s ' + np.name + '’s turn to pick! 🍿');
  // a bonus belongs to everybody, so it doesn't wear anyone's colour
  pn.style.color = showBonus ? '' : who.onWhite;
  inner.appendChild(pn);
  /* the one-sheet, projected right onto the screen. Painted lazily so a
     poster that arrives with the facts fetch (a hand-typed booking) still
     shows up without a re-render; a broken image just disappears. */
  var paintPoster = function(){};
  if (booked){
    var pWrap = el('div','screen-poster');
    paintPoster = function(){
      if (!booked.posterPath || pWrap.firstChild) return;
      var pimg = document.createElement('img');
      pimg.alt = '';
      pimg.src = TMDB_IMG + booked.posterPath;
      pimg.addEventListener('error', function(){
        pimg.remove();
        pWrap.removeAttribute('role');
        pWrap.removeAttribute('tabindex');
      });
      pWrap.appendChild(pimg);
      /* tapping the one-sheet opens the pre-show sheet for that movie */
      pWrap.classList.add('poster-tap');
      pWrap.setAttribute('role','button');
      pWrap.setAttribute('tabindex','0');
      pWrap.setAttribute('aria-label','Coming attractions for ' + booked.title);
    };
    var openCA = function(){ if (pWrap.firstChild) openComingAttractions(booked); };
    pWrap.addEventListener('click', openCA);
    pWrap.addEventListener('keydown', function(e){
      if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); openCA(); }
    });
    paintPoster();
    inner.appendChild(pWrap);
    inner.appendChild(el('div','booked-title', booked.title));
  }
  /* a booked night at home starts at the family showtime; a trip to the
     theatre keeps whatever time the cinema gave them */
  var startsAt = (booked && booked.venue !== 'theater') ? ' · ' + showtimeLabel() : '';
  inner.appendChild(el('div','showdate', isTonight
    ? 'Tonight' + startsAt
    : booked ? AZ.prettyLong(upNext.date) + startsAt
    : 'Next movie night · ' + AZ.prettyLong(upNext.date)));
  if (showBonus){
    // don't name the same person twice when the finder is also up next
    var finder = upNext.member;
    inner.appendChild(el('div','screen-bonus', finder.id === np.id
      ? finder.name + ' found this one · nobody loses a turn'
      : finder.name + ' found this one · nobody loses a turn, ' + np.name + ' still picks next'));
  }
  /* The screen stays a marquee: poster, title, date, showtime. The trailer,
     where it's streaming and the rest of the detail all live one tap away on
     the pre-show sheet — printing them here made the projector tall enough to
     push the lineup off the phone, and said the same thing twice. The facts
     still get fetched, because the poster comes with them. */
  if (booked) ensureNightFacts(booked, function(){ paintPoster(); });
  var rot = el('div','rotation');
  /* initials only, so the whole order fits on one line under the poster;
     the full names live in the label for screen readers */
  rot.setAttribute('aria-label', 'Pick order: '
    + MEMBERS.map(function(m){ return m.name; }).join(', then ')
    + '. ' + np.name + ' is up.');
  MEMBERS.forEach(function(m, i){
    var chip = el('div','rot-chip' + (m.id === np.id ? ' current' : ''));
    chip.setAttribute('aria-hidden','true');
    if (m.id === np.id) chip.style.background = m.onWhite;
    var dot = el('span','dot', m.name.charAt(0));
    dot.style.background = m.color;
    chip.appendChild(dot);
    rot.appendChild(chip);
    if (i < MEMBERS.length - 1) rot.appendChild(el('span','rot-arrow','→'));
  });
  inner.appendChild(rot);
  screen.appendChild(inner);
  sb.appendChild(screen);
  sb.appendChild(el('div','screen-stand'));
  app.appendChild(sb);

  /* friday lineup */
  var lineup = el('div','lineup');
  lineup.appendChild(el('div','lu-head','📅 Coming Attractions'));
  var today = AZ.today();
  // the next four Fridays, plus anything booked further out than that so a
  // movie already on the calendar never drops off the bottom
  var projected = lineupSlots(4);
  var slots = projected.slice(0, 4);
  var later = projected.slice(4).filter(function(s){ return s.night; });
  /* bonus nights sit in the calendar chronologically without taking a slot */
  var withBonus = slots.slice();
  bonusNights().forEach(function(n){
    withBonus.push({ date:n.date, member:memberById(n.pickedBy), title:n.title, night:n, bonus:true });
  });
  withBonus.sort(function(a,b){ return a.date < b.date ? -1 : 1; });
  var rows = withBonus.concat(later);
  rows.forEach(function(slot, u){
    if (u === withBonus.length && later.length) lineup.appendChild(el('div','lu-later','· later on ·'));
    var row = el('div','lu-row' + (u === rows.length - 1 ? ' last' : '') + (slot.bonus ? ' bonus' : ''));
    var dt = el('div','lu-date');
    dt.appendChild(el('div','d1', AZ.monthDay(slot.date)));
    var away = AZ.daysBetween(today, slot.date);
    dt.appendChild(el('div','d2', away === 0 ? 'Tonight!' : away === 1 ? 'Tomorrow'
      : away < 0 ? 'overdue' : 'in ' + away + ' days'));
    row.appendChild(dt);
    if (slot.skipped){
      /* a Friday off. It keeps its row so the gap is something the family
         chose rather than something that looks broken, and so it can be put
         back with one tap. */
      row.classList.add('skipped');
      var sp = el('div','lu-pick');
      sp.appendChild(el('span','dot skip','—'));
      sp.appendChild(el('span', null, 'No movie night'));
      row.appendChild(sp);
      row.appendChild(el('div','lu-fill'));
    } else {
      var lp = el('div','lu-pick');
      var ld = el('span','dot', slot.member.name.charAt(0));
      ld.style.background = slot.member.color;
      lp.appendChild(ld);
      var lname = el('span', null, slot.bonus
        ? 'Family bonus' + (slot.night && slot.night.venue === 'theater' ? ' 🍿' : '')
        : slot.member.name + '’s pick');
      lname.style.color = slot.bonus ? 'var(--dim)' : memberInk(slot.member);
      lp.appendChild(lname);
      row.appendChild(lp);
      if (slot.title){
        var bt = el('div','lu-title', slot.title);
        row.appendChild(bt);
      } else {
        row.appendChild(el('div','lu-fill'));
      }
    }
    /* An unbooked Friday can be taken off the calendar, and a skipped one put
       back. A Friday with a movie on it isn't offered — move or delete the
       movie first, which is a decision about the film, not the date. */
    if (!slot.night && !slot.bonus && slot.date >= today){
      row.classList.add('lu-tap');
      row.setAttribute('role','button');
      row.setAttribute('tabindex','0');
      row.setAttribute('aria-label', (slot.skipped ? 'Put movie night back on ' : 'Skip movie night on ')
        + AZ.pretty(slot.date));
      (function(d, off){
        function toggle(){ openSkipFriday(d, off); }
        row.addEventListener('click', toggle);
        row.addEventListener('keydown', function(e){
          if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); toggle(); }
        });
      })(slot.date, !!slot.skipped);
    }
    lineup.appendChild(row);
  });
  lineup.appendChild(el('div','lu-head second','🍿 Recent Fridays'));
  var lastFri = AZ.nextFriday();   // look back from the calendar, not from a break
  /* Tonight's Friday joins the list the moment its movie counts as watched —
     the same first-rating rule the projector and the memory book use. Waiting
     for midnight left the film nowhere in this card for the rest of the
     evening, and starting here lets the reaction dots fill in live as people
     rate. An unwatched Friday stays out, so this never reads "no movie night"
     at six in the evening. */
  var firstBack = 1;
  var tonightNight = (lastFri <= AZ.today()) ? happenedNightNear(lastFri) : null;
  if (tonightNight) firstBack = 0;
  for (var p=firstBack; p<firstBack+4; p++){
    var pf = AZ.addDays(lastFri, -7*p);
    var night = happenedNightNear(pf);
    var prow = el('div','lu-row' + (p === firstBack+3 ? ' last' : ''));
    var pdt = el('div','lu-date');
    pdt.appendChild(el('div','d1', AZ.monthDay(pf)));
    pdt.appendChild(el('div','d2', pf === AZ.today() ? 'Tonight' : 'Friday'));
    prow.appendChild(pdt);
    if (night){
      prow.appendChild(el('div','lu-title', night.title));
      /* What the family made of it, rather than who turned up — everybody is
         at movie night, so the initials only ever said the same thing. A
         night is only listed here once somebody has rated it, so there is
         always a score to show. When not everyone has rated yet the count
         goes alongside, because an average of two isn't the family's. */
      var rated = MEMBERS.filter(function(m){
        var r = reactionFor(night.id, m.id);
        return r && r.stars > 0;
      });
      var avg = familyAvg(night.id);
      var pd = el('div','lu-score');
      if (avg !== null){
        var st = starsNode(avg, 'stars lu-stars');
        st.setAttribute('aria-hidden','true');
        pd.appendChild(st);
        pd.appendChild(el('span','num', avg.toFixed(1)));
        if (rated.length < MEMBERS.length){
          pd.appendChild(el('span','part', rated.length + '/' + MEMBERS.length));
        }
        pd.setAttribute('aria-label', 'Family score ' + avg.toFixed(1) + ' out of 5'
          + (rated.length < MEMBERS.length
              ? ', from ' + rated.length + ' of ' + MEMBERS.length : ''));
      }
      prow.appendChild(pd);
      /* This row is the shortcut to the night itself. Reading the dots and
         wanting the detail behind them is the whole reason to look here, and
         the card can be a long way down a full memory book. */
      prow.classList.add('lu-jump');
      prow.setAttribute('role','button');
      prow.setAttribute('tabindex','0');
      prow.setAttribute('aria-label','Open ' + night.title + ' from ' + AZ.pretty(pf));
      (function(target){
        prow.addEventListener('click', function(){ jumpToNight(target.id); });
        prow.addEventListener('keydown', function(e){
          if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); jumpToNight(target.id); }
        });
      })(night);
    } else {
      prow.appendChild(el('div','lu-title skip','no movie night 😴'));
    }
    lineup.appendChild(prow);
  }
  app.appendChild(lineup);

  /* quote sticky note */
  var quotes = allQuotes();
  if (quotes.length){
    var qw = el('div','quotewall');
    qw.setAttribute('role','button');
    qw.setAttribute('tabindex','0');
    var q = quotes[quoteIndex % quotes.length];
    var cqw = el('div','cq-wrap');
    var bubble = el('div','cq', q.quote);
    cqw.appendChild(bubble);
    var attr = el('div','attr');
    q.members.forEach(function(m, i){
      if (i) attr.appendChild(document.createTextNode(i === q.members.length - 1 ? ' & ' : ', '));
      var an = el('span', null, m.name);
      an.style.color = memberInk(m);
      attr.appendChild(an);
    });
    attr.appendChild(document.createTextNode(' · ' + q.movie));
    cqw.appendChild(attr);
    cqw.appendChild(el('div','hint','From the quote wall · tap for another'));
    qw.appendChild(cqw);
    function nextQuote(){ quoteIndex++; render(); }
    qw.addEventListener('click', nextQuote);
    qw.addEventListener('keydown', function(e){ if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); nextQuote(); } });
    app.appendChild(qw);
  }

  /* awards season, once it's close enough to matter */
  renderOrtizzleCountdown(app);

  var logBtn = el('button','log-btn','🍿 Log a Movie Night');
  logBtn.addEventListener('click', openAddNight);
  app.appendChild(logBtn);

  /* an open vote sits right under the button — you can't miss it, and it
     needs no notification permission to reach anybody */
  if (openVote()) renderVoteBanner(app);
  else {
    var voteBtn = el('button','vote-start','🗳 Can’t decide? Put it to a vote');
    voteBtn.addEventListener('click', openStartVote);
    app.appendChild(voteBtn);
  }

  /* memory book.
     nights() is newest-first, which is right for memories but backwards for
     things that haven't happened: it puts the furthest-off booking above the
     one coming this week. So upcoming nights run soonest-first at the top,
     then the memories run most-recent-first below. Both chronological, each
     in the direction that reads correctly. */
  var all = nights();
  var upcoming = all.filter(function(n){ return !nightHappened(n); })
    .sort(function(a,b){ return a.date < b.date ? -1 : 1; });
  var past = all.filter(nightHappened);
  var list = upcoming.concat(past);
  var divider = el('div','film-divider');
  divider.setAttribute('aria-hidden','true');
  app.appendChild(divider);
  app.appendChild(el('div','section-label','Our Movie Night Memory Book'));
  var bookSub = el('div','section-sub', list.length ? list.length + ' night' + (list.length===1?'':'s') + ' together 🍿' : '');
  app.appendChild(bookSub);
  if (!list.length){
    var es = el('div','empty-state');
    es.appendChild(el('div','big','🛋️🍿'));
    es.appendChild(el('div', null, 'The memory book is empty!'));
    es.appendChild(el('div', null, 'Log your first Friday movie and start filling it up.'));
    app.appendChild(es);
  }

  /* the book's own controls, once it's big enough to be worth searching */
  var bookCards = [];        // { night, el, upcoming } in render order
  var splitEl = null;
  var moreBtn = null;
  var noHits = null;
  if (list.length > BOOK_FILTER_AT){
    var bf = el('div','book-filter');
    var q = el('input','f-input bf-search');
    q.type = 'search';
    q.placeholder = 'Search the memory book…';
    q.autocomplete = 'off';
    q.value = bookQuery;
    q.setAttribute('aria-label','Search movie nights by title');
    q.addEventListener('input', function(){
      bookQuery = q.value;
      applyBookFilter();
    });
    bf.appendChild(q);
    var chips = el('div','bf-chips');
    MEMBERS.forEach(function(m){
      var c = el('button','bf-chip' + (bookPicker === m.id ? ' on' : ''), m.name);
      c.type = 'button';
      c.setAttribute('aria-pressed', bookPicker === m.id ? 'true' : 'false');
      if (bookPicker === m.id) c.style.background = m.onWhite;
      c.addEventListener('click', function(){
        bookPicker = (bookPicker === m.id) ? null : m.id;
        // repaint the chips in place — a render() here would eat the search box
        for (var i=0;i<chips.children.length;i++){
          var kid = chips.children[i];
          var on = kid._member === bookPicker;
          kid.classList.toggle('on', on);
          kid.setAttribute('aria-pressed', on ? 'true' : 'false');
          kid.style.background = on ? memberById(kid._member).onWhite : '';
        }
        applyBookFilter();
      });
      c._member = m.id;
      chips.appendChild(c);
    });
    bf.appendChild(chips);
    app.appendChild(bf);
    noHits = el('div','book-none','Nothing matches — try a different title or person.');
    noHits.style.display = 'none';
    app.appendChild(noHits);
  }

  list.forEach(function(n, ni){
    // a quiet line where the calendar turns into the scrapbook
    if (upcoming.length && past.length && ni === upcoming.length){
      splitEl = el('div','book-split','· already watched ·');
      app.appendChild(splitEl);
    }
    var picker = memberById(n.pickedBy);
    var card = el('article','night');
    card.id = 'night-' + n.id;   // the anchor a Recent Fridays row jumps to

    var head = el('div','head');
    var poster = el('div','poster');
    if (n.posterPath){
      var img = document.createElement('img');
      img.alt = ''; img.loading = 'lazy'; img.src = TMDB_IMG + n.posterPath;
      img.addEventListener('error', function(){
        img.remove();
        poster.style.background = n.grad || 'var(--card-2)';
        poster.appendChild(document.createTextNode(n.title));
      });
      poster.appendChild(img);
    } else {
      poster.style.background = n.grad || 'linear-gradient(160deg,#4E3E51,#2E2430)';
      poster.appendChild(document.createTextNode(n.title));
    }
    // tapping the poster opens that night's scrapbook
    poster.classList.add('poster-tap');
    poster.setAttribute('role','button');
    poster.setAttribute('tabindex','0');
    poster.setAttribute('aria-label','Open the scrapbook for ' + n.title);
    (function(night){
      function go(){ openScrapbook(night); }
      poster.addEventListener('click', go);
      poster.addEventListener('keydown', function(e){
        if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); go(); }
      });
    })(n);
    head.appendChild(poster);

    var ht = el('div','head-txt');
    ht.appendChild(el('h3', null, n.title));
    var meta = el('div','meta', (n.year ? n.year + ' · ' : '') + AZ.pretty(n.date));
    var avg = familyAvg(n.id);
    if (avg !== null) meta.appendChild(el('span','avgbadge', avg.toFixed(1) + ' ★'));
    ht.appendChild(meta);
    var ticket = el('span','ticket');
    var adm = el('span','admit','🎟');
    adm.style.background = picker.color;
    var tnm = el('span','tname', isBonus(n) ? picker.name + '’s find' : picker.name + '’s pick');
    tnm.style.background = picker.color;
    ticket.appendChild(adm);
    ticket.appendChild(tnm);
    ht.appendChild(ticket);
    if (n.sample) ht.appendChild(el('span','sampletag','sample'));
    if (isBonus(n)) ht.appendChild(el('span','bonustag',
      n.venue === 'theater' ? '🍿 family bonus · at the theatre' : '🎟️ family bonus'));
    if (n.question) ht.appendChild(el('div','night-q', '❓ ' + memberById(n.pickedBy).name + ' asks: ' + n.question));
    head.appendChild(ht);
    card.appendChild(head);

    var rows = el('div','rx-rows');
    var reactedCount = 0;
    MEMBERS.forEach(function(m){
      var r = reactionFor(n.id, m.id);
      if (rxHasContent(r)) reactedCount++;
      var row = el('button','rx-row');
      row.type = 'button';
      var me = whoAmI();
      var who = el('span','who', m.name);
      who.style.color = memberInk(m);
      row.appendChild(who);
      if (me && me.id === m.id) row.appendChild(el('span','you-tag','you'));
      if (r && r.stars) row.appendChild(starsNode(r.stars));
      var snippetText = r ? (r.thought || rxQuotes(r)[0] || rxMemories(r)[0] || rxScenes(r)[0] || r.character || '') : '';
      if (snippetText){
        row.appendChild(el('span','snippet', snippetText));
      } else if (!r || !r.stars){
        row.appendChild(el('span','snippet empty','Tap to add your reaction'));
      } else {
        row.appendChild(el('span','snippet',''));
      }
      row.appendChild(el('span','chev','›'));
      row.addEventListener('click', function(){ openReaction(n, m); });
      rows.appendChild(row);
    });
    card.appendChild(rows);

    var actions = el('div','card-actions');
    if (reactedCount > 0){
      var sb2 = el('button','scrapbtn');
      sb2.appendChild(document.createTextNode('📖 Scrapbook'));
      if (reactedCount === MEMBERS.length){
        sb2.appendChild(el('span','done',' ✓'));
      } else {
        sb2.appendChild(el('span','', ' ' + reactedCount + '/4'));
      }
      sb2.addEventListener('click', function(){ openScrapbook(n); });
      actions.appendChild(sb2);
    }
    var ab = el('button','scrapbtn ai', aiPackFor(n.id) ? '✨ After-credits' : '✨ After-credits…');
    ab.addEventListener('click', function(){ openAfterCredits(n); });
    actions.appendChild(ab);
    card.appendChild(actions);

    var del = el('button','del','⋯');
    del.setAttribute('aria-label','More options for this night');
    del.addEventListener('click', function(){ openNightMenu(n); });
    card.appendChild(del);

    app.appendChild(card);
    bookCards.push({ night:n, el:card, upcoming: ni < upcoming.length });
  });

  /* "show all" only exists when something is actually being held back */
  if (past.length > BOOK_PAGE){
    moreBtn = el('button','book-more');
    moreBtn.type = 'button';
    moreBtn.addEventListener('click', function(){
      bookExpanded = !bookExpanded;
      applyBookFilter();
      if (!bookExpanded) moreBtn.scrollIntoView({ block:'center' });
    });
    app.appendChild(moreBtn);
  }

  /* Show/hide already-built cards. Never re-renders, so the search box keeps
     focus and the caret stays put while someone types. */
  function applyBookFilter(){
    var needle = bookQuery.trim().toLowerCase();
    var filtering = !!needle || !!bookPicker;
    var shownPast = 0, shownUpcoming = 0, matchedPast = 0;
    bookCards.forEach(function(c){
      var n = c.night;
      var hit = (!needle || (n.title || '').toLowerCase().indexOf(needle) !== -1)
        && (!bookPicker || n.pickedBy === bookPicker);
      var show = hit;
      if (hit && !c.upcoming){
        matchedPast++;
        /* the cap is a browsing convenience, not a filter — once someone is
           searching they want every match, however far back it sits */
        if (!filtering && !bookExpanded && matchedPast > BOOK_PAGE) show = false;
      }
      c.el.style.display = show ? '' : 'none';
      if (show){ if (c.upcoming) shownUpcoming++; else shownPast++; }
    });
    if (splitEl) splitEl.style.display = (shownUpcoming && shownPast) ? '' : 'none';
    if (noHits) noHits.style.display = (shownUpcoming + shownPast) ? 'none' : '';
    if (moreBtn){
      var hidden = matchedPast - shownPast;
      var showBtn = !filtering && (hidden > 0 || bookExpanded);
      moreBtn.style.display = showBtn ? '' : 'none';
      moreBtn.textContent = bookExpanded
        ? '▴ Show fewer'
        : '▾ Show all ' + list.length + ' nights';
    }
    if (list.length){
      bookSub.textContent = filtering
        ? (shownUpcoming + shownPast) + ' of ' + list.length + ' nights'
        : list.length + ' night' + (list.length===1?'':'s') + ' together 🍿';
    }
  }
  applyBookFilter();

  var footer = el('footer');
  footer.appendChild(el('div', null, 'Family Movie Night · Ortiz Family · v3.6'));
  app.appendChild(footer);

  runPendingJump();   // cards exist now — safe to scroll to one
}

    var t = a[i]; a[i] = a[j]; a[j] = t;

  if (cat.since) url += '&primary_release_date.gte=' + cat.since;

function enrichFromTmdb(items){
  var cred = loadTmdbCred();
  if (!cred) return Promise.resolve(items);
  return Promise.all(items.map(function(it){
    return tmdbSearch(it.title).then(function(d){
      var hit = (d.results || [])[0];
      if (!hit) return it;
      it.posterPath = it.posterPath || hit.poster_path || null;
      it.score = it.score || hit.vote_average || null;
      it.tmdbId = it.tmdbId || hit.id;
      if (!it.overview) it.overview = hit.overview || '';
      if (!it.year) it.year = Number((hit.release_date || '').slice(0,4)) || null;
      return it;
    }).catch(function(){ return it; });
  }));
}
function loadIdeas(force){

  ideas.loading = true;
  ideas.note = null;
  render();

  var job;
  if (cat.ai){
    var recId = 'airecs_' + (cat.member ? cat.member.id : 'family');
    var stored = data.records[recId];
    var cached = (stored && !stored.deleted && stored.picks) ? stored.picks : null;
    if (cached && cached.length && !force){
      job = enrichFromTmdb(cached);
    } else if (!Store.get('anthropic_key') && cached){
      job = enrichFromTmdb(cached);
    } else {
      job = (cat.member ? aiIdeasFor(cat.member) : aiIdeas()).then(function(picks){
        // stored as a synced record so the rest of the family sees these
        // without needing an Anthropic key of their own
        data.records[recId] = {
          id:recId, type:'airecs', member: cat.member ? cat.member.id : null,
          picks:picks, updatedAt: Date.now()
        };
        saveData();
        return enrichFromTmdb(picks);

    }

    var saved = shortlisted().map(function(r){
      return { title:r.title, year:r.year, tmdbId:r.tmdbId, posterPath:r.posterPath,
               overview:r.overview, cert:r.cert, score:r.score };
    });
    job = saved.length ? enrichFromTmdb(saved) : Promise.resolve([]);
  } else if (cat.id === 'curated'){
    job = enrichFromTmdb(shuffleWithSeed(CURATED.filter(function(c){ return c.kid; }), ideas.seed).slice(0, 12));
  } else if (cat.id === 'talk'){
    job = enrichFromTmdb(shuffleWithSeed(CURATED.filter(function(c){ return c.talk; }), ideas.seed).slice(0, 12));
  } else if (cat.id === 'classics'){
    job = enrichFromTmdb(shuffleWithSeed(CURATED.filter(function(c){ return c.classic; }), ideas.seed).slice(0, 12));
  } else {
    job = tmdbDiscover(cat, 1 + (ideas.seed % 3));

    ideas.loading = false;
    if (cat.ai && e && e.message === 'NO_KEY'){
      var relay = data.records['airecs_' + (cat.member ? cat.member.id : 'family')];

        : 'Add an Anthropic key in Settings and this shelf recommends movies based on what your family has actually loved.';
    } else if (e && e.message === 'NO_KEY'){

/* ===== fmn/vote.js ===== */
/* Family Movie Night — fmn/vote.js
   "Can't decide? Put it to a vote" — the picker shortlists a few, everyone
   votes, the picker books the winner.

   These files load in a fixed order from index.html and share one global
   scope, exactly as the single inline script did. Order matters: boot.js
   runs the startup calls and must stay last. */

/* ---------- the open vote ----------
   Only one vote runs at a time — a family of four doesn't need a queue, and
   one open question is easier to answer than three. The vote record holds
   the options; each ballot is its own record so two phones voting at once
   merge cleanly instead of overwriting each other's choices. */
function openVote(){
  var r = data.records['vote_open'];
  return (r && !r.deleted && r.options && r.options.length) ? r : null;
}
function ballotId(member){ return 'ballot_' + member + '_' + (openVote() ? openVote().round : 0); }
function ballotFor(memberId){
  var v = openVote();
  if (!v) return null;
  var r = data.records['ballot_' + memberId + '_' + v.round];
  return (r && !r.deleted) ? r : null;
}
function castBallot(memberId, choice){
  var v = openVote();
  if (!v) return;
  var id = 'ballot_' + memberId + '_' + v.round;
  data.records[id] = {
    id:id, type:'ballot', round:v.round, member:memberId,
    choice:choice, updatedAt: Date.now()
  };
  saveData();
}
function voteTally(){
  var v = openVote();
  if (!v) return [];
  var counts = v.options.map(function(o){ return { option:o, voters:[] }; });
  MEMBERS.forEach(function(m){
    var b = ballotFor(m.id);
    if (b && typeof b.choice === 'number' && counts[b.choice]) counts[b.choice].voters.push(m);
  });
  return counts;
}
function votesIn(){
  return MEMBERS.filter(function(m){ return !!ballotFor(m.id); }).length;
}
/* the leaders — plural, because a four-person family ties constantly */
function voteLeaders(){
  var t = voteTally();
  var top = 0;
  t.forEach(function(c){ if (c.voters.length > top) top = c.voters.length; });
  if (!top) return [];
  return t.filter(function(c){ return c.voters.length === top; });
}
function startVote(options, openedBy){
  var prev = data.records['vote_open'];
  var round = (prev && prev.round ? prev.round : 0) + 1;
  data.records['vote_open'] = {
    id:'vote_open', type:'vote', round:round, options:options,
    openedBy: openedBy, openedAt: Date.now(), updatedAt: Date.now()
  };
  saveData();
}
function closeVote(){
  var v = openVote();
  if (!v) return;
  data.records['vote_open'] = {
    id:'vote_open', type:'vote', round:v.round, deleted:true, updatedAt: Date.now()
  };
  saveData();
}

/* ---------- the banner on the Nights tab ----------
   This is the "nudge" that actually works: no notification permission, no
   service worker, no silent failure. If a vote is open and you haven't
   voted, you see it the moment you open the app. */
function renderVoteBanner(app){
  var v = openVote();
  if (!v) return;
  var me = whoAmI();
  var mine = me ? ballotFor(me.id) : null;
  var card = el('div','vote-card');

  var head = el('div','vote-head');
  head.appendChild(el('span','vc-ico','🗳'));
  var opener = memberById(v.openedBy);
  head.appendChild(el('span','vc-title', opener
    ? opener.name + ' can’t decide — help pick!'
    : 'Help pick the movie!'));
  card.appendChild(head);

  card.appendChild(el('div','vote-sub', votesIn() + ' of ' + MEMBERS.length + ' voted'
    + (me ? (mine ? ' · you voted' : ' · not you yet') : ' · set who’s on this phone in Settings to vote')));

  var tally = voteTally();
  tally.forEach(function(c, i){
    var row = el('button','vote-opt' + (mine && mine.choice === i ? ' mine' : ''));
    row.type = 'button';
    var main = el('div','vo-main');
    main.appendChild(el('div','vo-title', c.option.title + (c.option.year ? ' (' + c.option.year + ')' : '')));
    var who = el('div','vo-voters');
    c.voters.forEach(function(m){
      var d = el('span','vo-dot', m.name.charAt(0));
      d.style.background = m.color;
      who.appendChild(d);
    });
    if (!c.voters.length) who.appendChild(el('span','vo-none','no votes yet'));
    main.appendChild(who);
    row.appendChild(main);
    row.appendChild(el('span','vo-count', String(c.voters.length)));
    row.addEventListener('click', function(){
      var voter = whoAmI();
      if (!voter){ openWhoAmIPrompt(); return; }
      castBallot(voter.id, i);
      render();
      toast(voter.name + ' voted for ' + c.option.title + ' 🗳');
    });
    card.appendChild(row);
  });

  // only the person who called the vote closes it
  if (me && me.id === v.openedBy){
    var lead = voteLeaders();
    var done = el('button','vote-close', lead.length === 1
      ? '🍿 Book ' + lead[0].option.title
      : (lead.length ? '🤝 It’s a tie — you decide' : '✕ Cancel the vote'));
    done.addEventListener('click', function(){
      if (!lead.length){ closeVote(); render(); toast('Vote cancelled'); return; }
      if (lead.length === 1){ bookVoteWinner(lead[0].option); return; }
      openTieBreak(lead);
    });
    card.appendChild(done);
  } else if (me) {
    card.appendChild(el('div','vote-foot', memberById(v.openedBy).name + ' books the winner once everyone’s in.'));
  }
  app.appendChild(card);
}

/* ---------- starting one ----------
   Candidates come from the shortlist first, since that's where the family
   already parked the maybes, plus anything on the current Ideas shelf. */
function voteCandidates(){
  var out = [], seen = {};
  function add(it){
    var k = normQuote(it.title);
    if (!k || seen[k]) return;
    seen[k] = true;
    out.push({ title:it.title, year:it.year || null, tmdbId:it.tmdbId || null,
               posterPath:it.posterPath || null });
  }
  shortlisted().forEach(add);
  notWatched(ideas.items || []).forEach(add);

/* ===== fmn/awards.js ===== */
/* Family Movie Night — fmn/awards.js
   The Ortizzle — the family's year-end awards, plus the countdown to
   ceremony night.

   These files load in a fixed order from index.html and share one global
   scope, exactly as the single inline script did. Order matters: boot.js
   runs the startup calls and must stay last. */

/* ---------- when the ceremony is ----------
   A Friday the family picks, in the new year. Default: the second Friday
   of January, far enough in that the holidays are over. */
function secondFridayOfJan(year){
  var d = new Date(year, 0, 1);
  var add = (5 - d.getDay() + 7) % 7;      // first Friday
  d.setDate(d.getDate() + add + 7);        // ...then the next one
  var mm = String(d.getMonth()+1).padStart(2,'0');
  var dd = String(d.getDate()).padStart(2,'0');
  return d.getFullYear() + '-' + mm + '-' + dd;
}
function ortizzleDate(){
  var r = data.records['settings_ortizzle'];
  if (r && !r.deleted && r.date) return r.date;
  return secondFridayOfJan(Number(AZ.today().slice(0,4)) + 1);
}
function ortizzleYear(){
  // the awards honour the year that just ended
  return Number(ortizzleDate().slice(0,4)) - 1;
}
function setOrtizzleDate(date){
  data.records['settings_ortizzle'] = {
    id:'settings_ortizzle', type:'setting', key:'ortizzle', date:date, updatedAt: Date.now()
  };
  saveData();
}
function daysToOrtizzle(){
  return AZ.daysBetween(AZ.today(), ortizzleDate());
}

/* ---------- the awards themselves ----------
   Most are settled by the year's own record — the family already voted,
   one star at a time. A few are genuinely a matter of taste, and those go
   to a ballot on the night. */
function nightHasReactions(n){
  return reactionsFor(n.id).some(rxHasContent);
}
/* only nights the family actually wrote something about can win anything */
function nightsInYear(year){
  return nights().filter(function(n){
    return n.date.slice(0,4) === String(year) && nightHasReactions(n);
  });
}
function pollCount(nightId, key){
  return reactionsFor(nightId).filter(function(r){
    return r && r.poll && r.poll[key];
  }).length;
}
function ratingSpread(nightId){
  var vals = reactionsFor(nightId)
    .filter(function(r){ return r && r.stars; })
    .map(function(r){ return r.stars; });
  if (vals.length < 2) return null;
  return Math.max.apply(null, vals) - Math.min.apply(null, vals);
}
function quoteCount(nightId){
  return reactionsFor(nightId).reduce(function(t, r){ return t + rxQuotes(r).length; }, 0);
}
/* pick the night that maximises `score`; null when nothing qualifies */
function topNight(list, score){
  var best = null, bestVal = null;
  list.forEach(function(n){
    var v = score(n);
    if (v === null || v === undefined) return;
    if (bestVal === null || v > bestVal){ bestVal = v; best = n; }
  });
  return best ? { night:best, value:bestVal } : null;
}
function computedAwards(year){
  var list = nightsInYear(year);
  var out = [];
  function add(icon, name, blurb, hit, fmt){
    if (!hit) return;
    out.push({
      icon:icon, name:name, blurb:blurb, night:hit.night,
      detail: fmt ? fmt(hit.value, hit.night) : null
    });
  }
  add('🏆', 'Best Picture', 'Highest family average, all four votes counted',
      topNight(list, function(n){ return familyAvg(n.id); }),
      function(v){ return starText(Math.round(v*2)/2) + ' average'; });
  add('😂', 'Achievement in Making Us Laugh', 'The one that got the most of us',
      topNight(list, function(n){ var c = pollCount(n.id,'laughed'); return c ? c : null; }),
      function(v){ return v + ' of us laughed'; });
  add('😢', 'The Tissue Award', 'Nobody was cutting onions',
      topNight(list, function(n){ var c = pollCount(n.id,'cried'); return c ? c : null; }),
      function(v){ return v + (v === 1 ? ' of us cried' : ' of us cried'); });
  add('🔁', 'Most Rewatchable', 'The one we’d all happily start again',
      topNight(list, function(n){ var c = pollCount(n.id,'rewatch'); return c ? c : null; }),
      function(v){ return v + ' would see it again'; });
  add('💬', 'Most Quotable', 'Lines we kept',
      topNight(list, function(n){ var c = quoteCount(n.id); return c ? c : null; }),
      function(v){ return v + ' quote' + (v === 1 ? '' : 's') + ' saved'; });
  add('🥊', 'Biggest Disagreement', 'The widest gap between the highest and lowest star',
      topNight(list, function(n){ return ratingSpread(n.id); }),
      function(v){ return v + ' star' + (v === 1 ? '' : 's') + ' apart'; });
  add('🎁', 'Best Surprise', 'Highest rated among the ones none of us had seen',
      topNight(list, function(n){
        if (pollCount(n.id, 'seenBefore')) return null;
        return familyAvg(n.id);
      }),
      function(v){ return starText(Math.round(v*2)/2) + ', sight unseen'; });
  return out;
}
/* each person's own best night of the year, from the films they chose */
function pickerAwards(year){
  var list = nightsInYear(year);
  var out = [];
  MEMBERS.forEach(function(m){
    var mine = list.filter(function(n){ return n.pickedBy === m.id; });
    var hit = topNight(mine, function(n){ return familyAvg(n.id); });
    if (!hit) return;
    out.push({
      icon:'🎬', name: m.name + '’s Pick of the Year', member:m,
      blurb: mine.length + ' pick' + (mine.length === 1 ? '' : 's') + ' this year',
      night: hit.night,
      detail: starText(Math.round(hit.value*2)/2) + ' from the family'
    });
  });
  return out;
}

/* ---------- the categories worth arguing about ----------
   Nominees come from the year's data; the winner is whatever the family
   says on the night. Ballots reuse the same one-record-per-person shape as
   the movie vote, so two phones can't clobber each other. */
var ORTIZZLE_VOTED = [
  { key:'character', icon:'🌟', name:'Character of the Year',
    blurb:'Everyone’s favourite characters, head to head' },
  { key:'memory',    icon:'📌', name:'Movie Night Moment of the Year',
    blurb:'Not the film — the night' },
  { key:'quote',     icon:'💬', name:'The Line We’ll Still Be Saying in Ten Years',
    blurb:'One quote to rule them all' }
];
function ortizzleNominees(year, key){
  var list = nightsInYear(year);
  var out = [], seen = {};
  list.forEach(function(n){
    MEMBERS.forEach(function(m){
      var r = reactionFor(n.id, m.id);
      if (!r) return;
      var vals = key === 'character' ? (r.character ? [r.character] : [])
               : key === 'memory'    ? rxMemories(r)
               :                       rxQuotes(r);
      vals.forEach(function(v){
        var k = normQuote(v);
        if (!k || seen[k]) return;
        seen[k] = true;
        out.push({ text:v, by:m, night:n });
      });
    });
  });
  return out;
}
function ortizzleBallot(year, key, memberId){
  var r = data.records['oballot_' + year + '_' + key + '_' + memberId];
  return (r && !r.deleted) ? r : null;
}
function castOrtizzleBallot(year, key, memberId, text){
  var id = 'oballot_' + year + '_' + key + '_' + memberId;
  data.records[id] = {
    id:id, type:'oballot', year:year, category:key, member:memberId,
    text:text, updatedAt: Date.now()
  };
  saveData();
}
function ortizzleWinner(year, key){
  var counts = {}, best = null;
  MEMBERS.forEach(function(m){
    var b = ortizzleBallot(year, key, m.id);
    if (!b || !b.text) return;
    var k = normQuote(b.text);
    counts[k] = counts[k] || { text:b.text, voters:[] };
    counts[k].voters.push(m);
  });
  for (var k in counts){
    if (!best || counts[k].voters.length > best.voters.length) best = counts[k];
  }
  return best;
}

/* ---------- the countdown on the Nights tab ---------- */
function renderOrtizzleCountdown(app){
  var away = daysToOrtizzle();
  if (away < 0 || away > 120) return;      // only once it's in sight
  var card = el('button','ortiz-card');
  card.type = 'button';
  var left = el('div','oc-left');

  card.appendChild(left);
  var body = el('div','oc-body');
  body.appendChild(el('div','oc-name','The Ortizzle'));
  body.appendChild(el('div','oc-sub', away === 0 ? 'Tonight! 🎉'
    : away === 1 ? 'Tomorrow night'
    : away + ' days away · ' + AZ.prettyLong(ortizzleDate())));
  card.appendChild(body);
  card.appendChild(el('span','oc-go','›'));
  card.addEventListener('click', function(){ openOrtizzle(ortizzleYear()); });
  app.appendChild(card);
}

/* ---------- ceremony night ----------
   Built on the same keepsake page as the scrapbook, so it prints to the
   same US Letter book page and slots into the family's shelf. */
function openOrtizzle(year){
  var overlay = keepsakeOverlay();
  var page = el('div','scrap-page ortizzle');

  function paint(){
    while (page.firstChild) page.removeChild(page.firstChild);

    page.appendChild(el('div','sp-kicker','Family Movie Night presents'));
    page.appendChild(el('div','oz-title','The Ortizzle'));
    page.appendChild(el('div','oz-sub',
      'For achievement in entertaining the Ortiz family in the motion picture sciences'));
    page.appendChild(el('div','sp-date', year + ' · awarded ' + AZ.prettyLong(ortizzleDate())));

    var list = nightsInYear(year);
    if (!list.length){
      page.appendChild(el('div','oz-empty',
        'No movie nights logged for ' + year + ' yet. Watch a few, write down what you thought, and the awards write themselves.'));
      return;
    }

    page.appendChild(el('div','oz-count', list.length + ' movie night' + (list.length === 1 ? '' : 's') + ' considered'));

    /* the ones the year already decided */
    computedAwards(year).forEach(function(a){ page.appendChild(awardCard(a)); });

    /* everyone's own pick of the year */
    var pa = pickerAwards(year);
    if (pa.length){
      page.appendChild(el('div','oz-divider','· Picks of the Year ·'));
      pa.forEach(function(a){ page.appendChild(awardCard(a)); });
    }

    /* and the ones worth arguing about */
    page.appendChild(el('div','oz-divider','· Put to the family ·'));
    ORTIZZLE_VOTED.forEach(function(cat){
      page.appendChild(votedCard(year, cat, paint));
    });

    printButton(page);
  }

  function awardCard(a){
    var card = el('div','oz-award');
    var top = el('div','oz-top');
    top.appendChild(el('span','oz-ico', a.icon));
    var nm = el('span','oz-name', a.name);
    if (a.member) nm.style.color = a.member.color;
    top.appendChild(nm);
    card.appendChild(top);
    card.appendChild(el('div','oz-blurb', a.blurb));
    var win = el('div','oz-winner', a.night.title + (a.night.year ? ' (' + a.night.year + ')' : ''));
    card.appendChild(win);
    if (a.detail) card.appendChild(el('div','oz-detail', a.detail));
    return card;
  }

  function votedCard(year, cat, repaint){
    var card = el('div','oz-award voted');
    var top = el('div','oz-top');
    top.appendChild(el('span','oz-ico', cat.icon));
    top.appendChild(el('span','oz-name', cat.name));
    card.appendChild(top);
    card.appendChild(el('div','oz-blurb', cat.blurb));

    var noms = ortizzleNominees(year, cat.key);
    if (!noms.length){
      card.appendChild(el('div','oz-detail','Nothing nominated yet — this one fills in as the family writes.'));
      return card;
    }
    var win = ortizzleWinner(year, cat.key);
    var me = whoAmI();
    var mine = me ? ortizzleBallot(year, cat.key, me.id) : null;

    if (win){
      card.appendChild(el('div','oz-winner','“' + win.text + '”'));
      card.appendChild(el('div','oz-detail',
        win.voters.map(function(m){ return m.name; }).join(' & ') + '’s vote'
        + (win.voters.length > 1 ? 's' : '')));
    }

    var noml = el('div','oz-noms');
    noms.slice(0, 8).forEach(function(nom){
      var b = el('button','oz-nom' + (mine && normQuote(mine.text) === normQuote(nom.text) ? ' on' : ''));
      b.type = 'button';
      b.appendChild(el('span','on-text','“' + nom.text + '”'));
      var by = el('span','on-by', nom.by.name + ' · ' + nom.night.title);
      by.style.color = nom.by.color;
      b.appendChild(by);
      b.addEventListener('click', function(){
        var voter = whoAmI();
        if (!voter){ openWhoAmIPrompt(); return; }
        castOrtizzleBallot(year, cat.key, voter.id, nom.text);
        repaint();
        toast(voter.name + ' voted 🏆');
      });
      noml.appendChild(b);
    });
    card.appendChild(noml);
    if (!me) card.appendChild(el('div','oz-detail','Set who’s on this phone in Settings to cast a vote.'));
    return card;
  }

  paint();
  overlay.appendChild(page);
  document.body.appendChild(overlay);
}

/* Family Movie Night — fmn/stats.js
   The Stats tab and the game hub.

   These files load in a fixed order from index.html and share one global

/* ---------- RENDER: stats ---------- */
function memberStats(){
  var list = nights();
  var out = {};
  MEMBERS.forEach(function(m){
    out[m.id] = { member:m, picks:[], given:[], received:[], fives:0 };
  });
  list.forEach(function(n){
    if (out[n.pickedBy]) out[n.pickedBy].picks.push(n);
    var avg = familyAvg(n.id);
    if (avg !== null && out[n.pickedBy]) out[n.pickedBy].received.push(avg);
    MEMBERS.forEach(function(m){
      var r = reactionFor(n.id, m.id);
      if (r && r.stars){
        out[m.id].given.push(r.stars);
        if (r.stars === 5) out[m.id].fives++;
      }
    });
  });
  return out;
}
function mean(arr){
  if (!arr.length) return null;
  var s = 0;
  for (var i=0;i<arr.length;i++) s += arr[i];
  return s / arr.length;
}
/* A Friday the family deliberately took off doesn't break the run — they
   didn't miss movie night, they moved it. It doesn't add to the count
   either; it just isn't held against them. */
function fridayStreak(){
  var streak = 0, guard = 0;
  var f = AZ.addDays(AZ.nextFriday(), -7);
  while (guard++ < 400){
    if (nightNearDate(f)) streak++;
    else if (!isSkipped(f)) break;
    f = AZ.addDays(f, -7);
  }
  return streak;
}
function renderStats(app){
  var list = nights();
  app.appendChild(el('div','section-label','Movie Night Stats'));
  app.appendChild(el('div','section-sub','The family record book 🏆'));

  if (!list.length){
    var es = el('div','empty-state');
    es.appendChild(el('div','big','📊'));
    es.appendChild(el('div', null, 'No stats yet — log a few movie nights first!'));
    app.appendChild(es);
    return;
  }

  var tiles = el('div','stat-tiles');
  var t1 = el('div','stat-tile');
  t1.appendChild(el('div','num', String(list.length)));
  t1.appendChild(el('div','lbl','Nights together'));
  tiles.appendChild(t1);
  var t2 = el('div','stat-tile');
  t2.appendChild(el('div','num', String(fridayStreak())));
  t2.appendChild(el('div','lbl','Friday streak 🔥'));
  tiles.appendChild(t2);
  app.appendChild(tiles);

  var stats = memberStats();
  var critic = null, pleaser = null;
  MEMBERS.forEach(function(m){
    var s = stats[m.id];
    var g = mean(s.given);
    if (g !== null && (critic === null || g < critic.v)) critic = { m:m, v:g };
    var rcv = mean(s.received);
    if (rcv !== null && (pleaser === null || rcv > pleaser.v)) pleaser = { m:m, v:rcv };
  });

  MEMBERS.forEach(function(m){
    var s = stats[m.id];
    var card = el('div','stat-member');
    card.style.borderLeftColor = m.color;
    var head = el('div','sm-head');
    var dot = el('span','sm-dot', m.name.charAt(0));
    dot.style.background = m.color;
    head.appendChild(dot);
    var nm = el('span','sm-name', m.name);
    nm.style.color = memberInk(m);
    head.appendChild(nm);
    if (critic && critic.m.id === m.id) head.appendChild(el('span','sm-badge','🍅 toughest critic'));
    else if (pleaser && pleaser.m.id === m.id) head.appendChild(el('span','sm-badge','🎉 crowd pleaser'));
    card.appendChild(head);

    var grid = el('div','sm-grid');
    function cell(label, value){
      var c = el('div','sm-cell');
      c.appendChild(el('b', null, value));
      c.appendChild(document.createTextNode(' ' + label));
      grid.appendChild(c);
    }
    var g = mean(s.given);
    var rcv = mean(s.received);
    cell('picks made', String(s.picks.length));
    cell('★ given on avg', g === null ? '—' : g.toFixed(1));
    cell('their picks score', rcv === null ? '—' : rcv.toFixed(1) + ' ★');
    cell('five-star raves', String(s.fives));
    card.appendChild(grid);

    if (s.picks.length){
      var ph = el('div','sm-picks');
      ph.appendChild(document.createTextNode('🎬 Picked: '));
      s.picks.forEach(function(n, i){
        var avg = familyAvg(n.id);
        ph.appendChild(el('b', null, n.title));
        ph.appendChild(document.createTextNode(avg !== null ? ' (' + avg.toFixed(1) + '★)' : ''));
        if (i < s.picks.length - 1) ph.appendChild(document.createTextNode(' · '));
      });
      card.appendChild(ph);
    }
    app.appendChild(card);
  });

  var split = null;
  list.forEach(function(n){
    var rs = reactionsFor(n.id).filter(function(r){ return r.stars > 0; });
    if (rs.length < 2) return;
    var mn = 6, mx = 0, mnWho = null, mxWho = null;
    rs.forEach(function(r){
      if (r.stars < mn){ mn = r.stars; mnWho = memberById(r.member).name; }
      if (r.stars > mx){ mx = r.stars; mxWho = memberById(r.member).name; }
    });
    var spread = mx - mn;
    if (spread > 0 && (split === null || spread > split.spread)){
      split = { n:n, spread:spread, mn:mn, mx:mx, mnWho:mnWho, mxWho:mxWho };
    }
  });
  if (split){
    var sc = el('div','split-card');
    sc.appendChild(el('div','sc-title','💥 Biggest Split Decision'));
    sc.appendChild(el('div','sc-movie', split.n.title));
    sc.appendChild(el('div','sc-detail',
      split.mxWho + ' gave it ' + split.mx + '★ … ' + split.mnWho + ' gave it ' + split.mn + '★. The couch was divided.'));
    app.appendChild(sc);
  }

  var foot = el('footer');
  foot.appendChild(el('div', null, 'More coming: badges · one year ago tonight · the Ortiz Oscars'));
  app.appendChild(foot);
}

/* ---------- RENDER: trivia (game hub) ---------- */
var GAMES = [
  { id:'trivia',  ico:'🎯', name:'Movie Trivia',   desc:'Questions by category — Pixar, Disney, classics and more.' },
  { id:'whosaid', ico:'💬', name:'Who Said It?',   desc:'A famous line appears. Name the movie it came from.' },
  { id:'ourwall', ico:'🍿', name:'Our Quote Wall', desc:'Quotes your family saved — guess who picked each one.', needsData:true },
  { id:'iq',      ico:'🧠', name:'Movie IQ Test',  desc:'Ten mixed questions. Find out the family’s movie rank.' }
];
var trivia = { game:null, cat:null, deck:null, idx:0, score:0, dunno:0, answered:false, lastPick:-1 };

function shuffledOrder(n){
  var arr = [];
  for (var i=0;i<n;i++) arr.push(i);
  for (var j=arr.length-1;j>0;j--){
    var k = Math.floor(Math.random()*(j+1));
    var t = arr[j]; arr[j] = arr[k]; arr[k] = t;
  }
  return arr;
}
function shuffleArr(a){
  var r = a.slice();
  for (var i=r.length-1;i>0;i--){
    var j = Math.floor(Math.random()*(i+1));
    var t = r[i]; r[i] = r[j]; r[j] = t;
  }
  return r;
}
/* questions built from the family's own saved quotes: who picked this line? */
function ourWallDeck(){
  var out = [];
  nights().forEach(function(n){
    nightQuoteGroups(n.id).forEach(function(g){
      if (g.members.length !== 1) return;           // ambiguous if several picked it
      var who = g.members[0];
      var others = shuffleArr(MEMBERS.filter(function(m){ return m.id !== who.id; })).slice(0, 3);
      var opts = shuffleArr([who].concat(others));
      out.push({
        q: '“' + g.text + '”',
        sub: 'from ' + n.title,
        opts: opts.map(function(m){ return m.name; }),
        a: opts.indexOf(who),
        note: who.name + ' saved this one from ' + n.title + '.'
      });
    });
  });
  return shuffleArr(out);
}
function buildDeck(){
  if (trivia.game === 'trivia'){
    var pool = TRIVIA.filter(function(q){ return !trivia.cat || q.cat === trivia.cat; });
    return shuffleArr(pool).slice(0, 12);
  }
  if (trivia.game === 'whosaid') return shuffleArr(WHO_SAID).slice(0, 12);
  if (trivia.game === 'ourwall') return ourWallDeck().slice(0, 12);
  if (trivia.game === 'iq'){
    var mixed = shuffleArr(TRIVIA).slice(0, 6)
      .concat(shuffleArr(WHO_SAID).slice(0, 3))
      .concat(ourWallDeck().slice(0, 1));
    return shuffleArr(mixed).slice(0, 10);
  }
  return [];
}
function startGame(gameId, catId){
  trivia.game = gameId;
  trivia.cat = catId || null;
  trivia.deck = buildDeck();
  trivia.idx = 0; trivia.score = 0; trivia.dunno = 0;
  trivia.answered = false; trivia.lastPick = -1;
  render();
  window.scrollTo(0, 0);
}
function iqRank(pct){
  if (pct >= 0.9) return { medal:'🏆', title:'Certified Film Buffs', line:'Roll credits and take a bow — this family knows its movies.' };
  if (pct >= 0.7) return { medal:'🎬', title:'Serious Movie Family', line:'Strong showing. A couple more Fridays and you’ll sweep it.' };
  if (pct >= 0.5) return { medal:'🍿', title:'Solid Watchers', line:'Respectable! The popcorn was clearly the main event.' };
  return { medal:'🎟', title:'Rookie Reviewers', line:'The fix is obvious and delicious: more movie nights.' };
}
function renderTrivia(app){
  app.appendChild(el('div','section-label','Movie Games'));
  app.appendChild(el('div','section-sub','One phone, four brains 🎯'));

  /* ---- game picker ---- */
  if (!trivia.game){
    var wallCount = ourWallDeck().length;
    GAMES.forEach(function(g){
      var locked = g.needsData && wallCount < 4;
      var card = el('button','game-card' + (locked ? ' locked' : ''));
      card.type = 'button';
      var ico = el('span','g-ico', g.ico);
      card.appendChild(ico);
      var body = el('span','g-body');
      body.appendChild(el('span','g-name', g.name));
      body.appendChild(el('span','g-desc', locked
        ? 'Save a few more favorite quotes and this game unlocks.'
        : g.desc));
      card.appendChild(body);
      if (!locked){
        card.appendChild(el('span','g-go','›'));
        card.addEventListener('click', function(){
          if (g.id === 'trivia'){ trivia.game = 'trivia'; trivia.deck = null; render(); window.scrollTo(0,0); }
          else startGame(g.id);
        });
      }
      app.appendChild(card);
    });
    var foot = el('footer');
    foot.appendChild(el('div', null, TRIVIA.length + ' trivia questions · ' + WHO_SAID.length + ' famous lines · your own quote wall'));
    app.appendChild(foot);
    return;
  }

  /* ---- category picker for Movie Trivia ---- */
  if (trivia.game === 'trivia' && !trivia.deck){
    app.appendChild(el('div','idea-note','Pick a category — or play them all mixed together.'));
    var all = el('button','game-card');
    all.type = 'button';
    all.appendChild(el('span','g-ico','🎲'));
    var ab = el('span','g-body');
    ab.appendChild(el('span','g-name','Everything'));
    ab.appendChild(el('span','g-desc','All ' + TRIVIA.length + ' questions, shuffled.'));
    all.appendChild(ab);
    all.appendChild(el('span','g-go','›'));
    all.addEventListener('click', function(){ startGame('trivia', null); });
    app.appendChild(all);
    TRIVIA_CATS.forEach(function(c){
      var n = TRIVIA.filter(function(q){ return q.cat === c.id; }).length;
      var b = el('button','game-card');
      b.type = 'button';
      b.appendChild(el('span','g-ico', c.label.split(' ')[0]));
      var bb = el('span','g-body');
      bb.appendChild(el('span','g-name', c.label.replace(/^\S+\s/,'')));
      bb.appendChild(el('span','g-desc', n + ' questions'));
      b.appendChild(bb);
      b.appendChild(el('span','g-go','›'));
      b.addEventListener('click', function(){ startGame('trivia', c.id); });
      app.appendChild(b);
    });
    var back0 = el('button','idea-refresh','‹ Back to games');
    back0.addEventListener('click', function(){ trivia.game = null; render(); });
    app.appendChild(back0);
    return;
  }

  var deck = trivia.deck || [];

  /* ---- finale ---- */
  if (trivia.idx >= deck.length){
    var total = deck.length || 1;
    var pct = trivia.score / total;
    var rank = iqRank(pct);
    var done = el('div','tq-done');
    done.appendChild(el('div','big', rank.medal));
    done.appendChild(el('div','score-line', trivia.score + ' / ' + total));
    done.appendChild(el('div','rank-title', rank.title));
    done.appendChild(el('p', null, rank.line));
    if (trivia.dunno) done.appendChild(el('p', null, trivia.dunno + ' passed on — no shame, that’s how you learn a new favorite.'));
    var again = el('button','tq-next','Play again');
    again.addEventListener('click', function(){ startGame(trivia.game, trivia.cat); });
    done.appendChild(again);
    var back = el('button','idea-refresh','‹ Back to games');
    back.addEventListener('click', function(){ trivia.game = null; trivia.deck = null; render(); });
    done.appendChild(back);
    app.appendChild(done);
    return;
  }

  /* ---- question ---- */
  var Q = deck[trivia.idx];
  var card = el('div','tq-card');
  var prog = el('div','tq-progress');
  prog.appendChild(el('span', null, 'Question ' + (trivia.idx+1) + ' of ' + deck.length));
  prog.appendChild(el('span','score','Score: ' + trivia.score));
  card.appendChild(prog);
  card.appendChild(el('div','tq-q', Q.q));
  if (Q.sub) card.appendChild(el('div','tq-sub', Q.sub));

  var opts = el('div','tq-opts');
  Q.opts.forEach(function(opt, i){
    var b = el('button','tq-opt', opt);
    b.type = 'button';
    if (trivia.answered){
      b.disabled = true;
      if (i === Q.a) b.classList.add('correct');
      else if (i === trivia.lastPick) b.classList.add('wrong');
    } else {
      b.addEventListener('click', function(){
        trivia.answered = true;
        trivia.lastPick = i;
        if (i === Q.a){ trivia.score++; confettiBurst(14); }
        render();
      });
    }
    opts.appendChild(b);
  });
  card.appendChild(opts);

  if (!trivia.answered){
    var dk = el('button','tq-dunno','🤷 Don’t know — show me');
    dk.addEventListener('click', function(){
      trivia.answered = true;
      trivia.lastPick = -1;
      trivia.dunno++;
      render();
    });
    card.appendChild(dk);
  }

  if (trivia.answered){
    var verdict = trivia.lastPick === -1 ? 'Here’s the answer. '
      : (trivia.lastPick === Q.a ? '✓ Correct! ' : '✗ Not this time. ');
    card.appendChild(el('div','tq-note', verdict + (Q.note || '')));
    var next = el('button','tq-next', trivia.idx + 1 >= deck.length ? 'See the final score' : 'Next question');
    next.addEventListener('click', function(){
      trivia.idx++;
      trivia.answered = false;
      trivia.lastPick = -1;
      render();
      window.scrollTo(0, 0);
    });
    card.appendChild(next);
  }
  app.appendChild(card);

  var quit = el('button','idea-refresh','‹ Back to games');
  quit.addEventListener('click', function(){ trivia.game = null; trivia.deck = null; render(); });
  app.appendChild(quit);
}

/* ===== fmn/settings.js ===== */
/* Family Movie Night — fmn/settings.js
   Taste profiles, the Settings tab, and the master render switch.

   These files load in a fixed order from index.html and share one global
   scope, exactly as the single inline script did. Order matters: boot.js
   runs the startup calls and must stay last. */

/* ---------- taste profiles (drive per-person recommendations) ---------- */
var GENRES = ['Animated','Adventure','Comedy','Fantasy','Sci-fi','Musical','Mystery','Action',
  'Drama','True stories','Historical','Sports','Spooky (a little)','Heartwarming'];
function whoAmI(){
  var id = Store.get('me');
  if (!id) return null;
  for (var i=0;i<MEMBERS.length;i++) if (MEMBERS[i].id === id) return MEMBERS[i];
  return null;
}
function profileFor(memberId){
  var r = data.records['profile_' + memberId];
  return (r && !r.deleted) ? r : null;
}
function profileFilled(p){
  return !!(p && ((p.genres && p.genres.length) || p.loves || p.avoids || p.night));
}
function profileSummary(p){
  if (!profileFilled(p)) return 'Not set up yet — tap to answer a few questions';
  var bits = [];
  if (p.genres && p.genres.length) bits.push(p.genres.slice(0,3).join(', '));
  if (p.loves) bits.push('loves ' + p.loves.split(/[,.]/)[0].trim());
  return bits.join(' · ') || 'Profile saved';
}
/* Starter profiles, from what the family already said they love. These are a
   first draft, not a verdict — anyone can open theirs and rewrite it, and the
   moment they do, the starter flag is gone. Only ever written when a person
   has no profile of their own yet. */
var STARTER_PROFILES = {
  chris: { genres:['Adventure','Comedy','Sci-fi','Mystery','True stories'],
    era:'Love the old classics',
    loves:'The Princess Bride, Back to the Future, Indiana Jones, Knives Out, Spider-Verse',
    avoids:'',
    night:'Something we can all quote at breakfast for the next week.' },
  kat: { genres:['Comedy','Mystery','Heartwarming','Drama','Musical'],
    era:'Happy to mix in classics',
    loves:'Only Murders in the Building, Elsbeth, Knives Out, Ferris Bueller’s Day Off',
    avoids:'',
    night:'Funny and warm, with a mystery I can try to solve out loud.' },
  sedona: { genres:['Mystery','Comedy','Musical','Animated','Fantasy'],
    era:'Happy to mix in classics',
    loves:'Only Murders in the Building, High Potential, Elsbeth, Knives Out, KPop Demon Hunters, Disney movies',
    avoids:'Anything genuinely scary',
    night:'A whodunnit with a soundtrack worth adding to my playlist.' },
  river: { genres:['Animated','Adventure','Comedy','Fantasy','Musical'],
    era:'Mostly newer films',
    loves:'KPop Demon Hunters, Disney and Pixar movies, Spider-Verse, Knives Out',
    avoids:'Sad animal movies, anything too scary',
    night:'Big, funny, and loud — with popcorn.' }
};
/* Where the order restarts. Chris took the weekend of July 26, 2026, so the
   next Friday belongs to Kat, and it runs Kat → Sedona → River → Chris from
   there. Written once, with a fixed timestamp so every phone agrees; change
   it any time from Settings and that edit wins everywhere. */
var ANCHOR_SEED = { date:'2026-07-31', member:'kat', at: 1753500000000 };
function seedRotation(){
  if (data.records['rotation_anchor']) return;   // includes tombstones
  data.records['rotation_anchor'] = {
    id:'rotation_anchor', type:'rotation',
    date: ANCHOR_SEED.date, member: ANCHOR_SEED.member,
    updatedAt: ANCHOR_SEED.at
  };
  saveData();
}
function seedProfiles(){
  var wrote = false;
  MEMBERS.forEach(function(m){
    if (data.records['profile_' + m.id]) return;   // includes tombstones — never resurrect
    var s = STARTER_PROFILES[m.id];
    if (!s) return;
    data.records['profile_' + m.id] = {
      id:'profile_' + m.id, type:'profile', member:m.id, starter:true,
      genres:s.genres.slice(), era:s.era, loves:s.loves, avoids:s.avoids, night:s.night,
      updatedAt: Date.now()
    };
    wrote = true;
  });
  if (wrote) saveData();
}
function saveProfile(memberId, prof){
  prof.id = 'profile_' + memberId;
  prof.type = 'profile';
  prof.member = memberId;
  prof.updatedAt = Date.now();
  data.records[prof.id] = prof;
  saveData();
}
function openProfileEditor(member){

/* collapsible settings section */
/* Which Settings sections are open, remembered across renders — otherwise a
   background sync landing (or any re-render) slams every section shut while
   somebody is halfway through typing in one. */
var collState = {};
function collapsible(app, title, opts){
  opts = opts || {};
  var card = el('div','set-card');
  var head = el('button','set-head');
  head.type = 'button';
  head.appendChild(el('div','set-title', title));
  if (opts.badge) head.appendChild(el('span','set-badge' + (opts.badgeOn ? ' on' : ''), opts.badge));
  head.appendChild(el('span','chev','›'));
  var body = el('div','set-body');
  if (!(title in collState)) collState[title] = !!opts.open;
  function paint(){
    body.style.display = collState[title] ? 'block' : 'none';
    head.setAttribute('aria-expanded', collState[title] ? 'true' : 'false');
  }
  paint();
  head.addEventListener('click', function(){ collState[title] = !collState[title]; paint(); });
  card.appendChild(head);
  card.appendChild(body);
  app.appendChild(card);
  return body;
}

  rowo.appendChild(oSave);
  ok.appendChild(rowo);

  /* claude key */
  var ck = collapsible(app, '🤖 Claude — packs & picks', {
    badge: Store.get('anthropic_key') ? 'Saved' : 'Not set', badgeOn: !!Store.get('anthropic_key')
  });
  var hasAnthro = !!Store.get('anthropic_key');
  ck.appendChild(el('div','set-note', hasAnthro
    ? 'Key saved — every night card’s ✨ After-credits button can make fun facts, movie trivia, and talk-about-it questions for that night’s film. Packs sync to the whole family.'
    : 'Optional: add an Anthropic API key and every night card gets an ✨ After-credits pack — fun facts, trivia about that exact movie, and discussion questions for the post-movie couch talk. Everything else works without it.'));
  var rowc = el('div','set-row');
  var cInput = el('input','f-input');
  cInput.type = 'password';
  cInput.autocomplete = 'off';
  cInput.placeholder = hasAnthro ? 'Key saved — paste to replace' : 'Paste Anthropic API key';
  rowc.appendChild(cInput);
  var cSave = el('button','set-save','Save');
  cSave.addEventListener('click', function(){
    var v = cInput.value.trim();
    if (!v) return;
    Store.set('anthropic_key', v);
    render();
    toast('Claude key saved 🤖');
  });
  rowc.appendChild(cSave);
  ck.appendChild(rowc);
  if (hasAnthro){
    var cClear = el('button','set-btn warn','Remove Claude key');
    cClear.addEventListener('click', function(){
      Store.remove('anthropic_key');
      render();
      toast('Claude key removed');
    });
    ck.appendChild(cClear);
  }
  /* sample data */
  if (hasSample()){
    var sd = collapsible(app, '🧪 Sample data');
    sd.appendChild(el('div','set-note','The three demo nights are still in the memory book so you can explore.'));
    var cs = el('button','set-btn warn','🧹 Clear sample data');
    cs.addEventListener('click', function(){
      confirmModal({
        title:'Clear the sample nights?',
        message:'The three demo nights and their reactions will be removed so you can start fresh.',
        confirmText:'Clear them',
        onConfirm: clearSample
      });
    });
    sd.appendChild(cs);
  }

  var foot = el('footer');
  foot.appendChild(el('div', null, 'Family Movie Night · Ortiz Family · v3.2'));
  app.appendChild(foot);
}

/* ---------- master render ---------- */
function render(){
  var app = document.getElementById('app');
  while (app.firstChild) app.removeChild(app.firstChild);
  renderHeader(app);
  if (view === 'home') renderHome(app);
  else if (view === 'ideas') renderIdeas(app);
  else if (view === 'stats') renderStats(app);
  else if (view === 'trivia') renderTrivia(app);
  else renderSettings(app);
  renderTabbar();
}

/* ===== fmn/boot.js ===== */
/* Family Movie Night — fmn/boot.js
   Startup: theme, seed data, first render, first sync. Must load last.

   These files load in a fixed order from index.html and share one global
   scope, exactly as the single inline script did. Order matters: boot.js
   runs the startup calls and must stay last. */

applyTheme();
applyMotion();
seedSample();
seedProfiles();
seedRotation();
render();
pullSync(true); // pick up the family's latest entries on launch (no-op until sync is set up)
</script></body>
</html>
