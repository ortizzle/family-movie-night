/* the "where can we watch it" row.
   Callers that would rather show nothing than a shrug — the projector screen,
   idea cards — pass no title and get null back when TMDB knows of no US
   service. Pass a title and the row always renders, saying so plainly and
   handing over a search instead. Pass the night's venue too and a trip to the
   cinema answers its own question. */
function watchRow(f, opts){
  opts = opts || {};
  var w = f && f.watch;
  /* Never tell the family a film they're buying tickets for might be
     "waiting on the shelf" — the venue already settled where they're going. */
  if (opts.venue === 'theater' && opts.title){
    var tw = el('div','watch-row');
    tw.appendChild(el('div','wr-lead','🎟 At the theatre'));
    tw.appendChild(el('div','wr-none','This one’s a night out — you’re seeing it on the big screen.'));
    tw.appendChild(showtimesLink(opts.title));
    return tw;
  }
  if (!w && !opts.title) return null;
  var wrap = el('div','watch-row');
  if (!w){
    /* "no provider" isn't one answer. A film four days out of the gate is in
       cinemas, not missing — TMDB simply has nothing to list yet. */
    var since = (f && f.released) ? AZ.daysBetween(f.released, AZ.today()) : null;
    if (since !== null && since < 0){
      wrap.appendChild(el('div','wr-lead','🎬 Not out yet'));
      wrap.appendChild(el('div','wr-none','It hasn’t opened yet, so there’s nowhere to stream it.'));
      wrap.appendChild(showtimesLink(opts.title));
    } else if (since !== null && since <= 120){
      wrap.appendChild(el('div','wr-lead','🎬 Still in theatres'));
      wrap.appendChild(el('div','wr-none','Only just released, so it hasn’t reached a streaming service yet.'));
      wrap.appendChild(showtimesLink(opts.title));
    } else {
      wrap.appendChild(el('div','wr-lead', '🍿 Where to watch'));
      wrap.appendChild(el('div','wr-none',
        'TMDB doesn’t list a US service for this one. It may be rent-only, on a service TMDB doesn’t track, or waiting on the shelf.'));
      var s = el('a','wr-link','Search JustWatch ↗');
      s.href = 'https://www.justwatch.com/us/search?q=' + encodeURIComponent(opts.title);
      s.target = '_blank';
      s.rel = 'noopener noreferrer';
      s.setAttribute('aria-label', 'Search JustWatch for where to watch ' + opts.title);
      wrap.appendChild(s);
    }
    return wrap;
  }
  var lead = el('div','wr-lead', w.stream.length ? '📺 Streaming on' : '💵 Rent or buy');
  wrap.appendChild(lead);
  var pills = el('div','wr-pills');
  var list = w.stream.length ? w.stream : w.rent;
  list.forEach(function(name){ pills.appendChild(el('span','wr-pill', name)); });
  if (w.stream.length && w.rent.length){
    pills.appendChild(el('span','wr-pill muted', 'or rent: ' + w.rent[0]));
  }
  wrap.appendChild(pills);
  if (w.link){
    var a = el('a','wr-link','Where to watch ↗');
    a.href = w.link;
    a.target = '_blank';
    a.rel = 'noopener noreferrer';
    wrap.appendChild(a);
  }
  return wrap;
}
function factChips(f, cls, title){
  var wrap = el('div', cls || 'idea-facts');
  if (!f) return wrap;
  if (f.cert) wrap.appendChild(el('span','idea-fact cert', f.cert));
  if (f.released) wrap.appendChild(el('span','idea-fact', AZ.pretty(f.released).replace(/^\w+, /,'') + ', ' + f.released.slice(0,4)));
  if (f.runtime) wrap.appendChild(el('span','idea-fact', Math.floor(f.runtime/60) + 'h ' + (f.runtime%60) + 'm'));
  if (f.imdb) wrap.appendChild(imdbGuideChip(f, 'idea-fact'));
  if (f.rt) wrap.appendChild(rtChip(f, title, 'idea-fact'));
  if (f.meta) wrap.appendChild(el('span','idea-fact','Metacritic ' + f.meta));
  if (!f.imdb && f.tmdbScore) wrap.appendChild(el('span','idea-fact star','★ ' + Number(f.tmdbScore).toFixed(1) + ' TMDB'));
  return wrap;
}
/* ensure a night has cached facts; re-renders once they arrive.
   Facts cached before an OMDb key was added have no IMDb/RT scores, so
   top them up once a key appears rather than leaving them blank forever. */
function ensureNightFacts(night, onDone){
  var f = night.facts;
  var haveCore = !!(f && f.fetchedAt);
  var wantsOmdb = haveCore && !f.imdb && !f.omdbTried && !!omdbKey() && !!f.imdbId;
  /* facts cached before trailers existed have no video, so top those up the
     same way rather than leaving old bookings without a trailer forever */
  var wantsVideos = haveCore && !f.trailer && !f.videosTried && !!loadTmdbCred() && !!f.tmdbId;
  /* Where a film streams changes month to month, and the rest of the facts
     never expire — so providers get their own clock. Only for a night still
     coming up: that's when the answer matters, and it keeps watched nights
     from re-fetching forever. */
  var providerAge = Date.now() - (f && (f.watchAt || f.fetchedAt) || 0);
  var wantsProviders = haveCore && !!loadTmdbCred() && !!f.tmdbId
    && !nightHappened(night) && providerAge > 7 * 24 * 3600 * 1000;

  if (haveCore && !wantsOmdb && !wantsVideos && !wantsProviders){ if (onDone) onDone(f); return; }

  if (haveCore){
    if (onDone) onDone(f);            // paint what we already have
    Promise.all([
      wantsOmdb ? omdbScores(f.imdbId) : Promise.resolve(null),
      wantsVideos ? tmdbVideos(f.tmdbId) : Promise.resolve(null),
      wantsProviders ? tmdbProviders(f.tmdbId) : Promise.resolve(null)
    ]).then(function(res){
      var sc = res[0], tr = res[1], pr = res[2];
      var rec = data.records[night.id];
      if (!rec || rec.deleted) return;
      var merged = {};
      for (var k in f) merged[k] = f[k];
      if (sc){ merged.imdb = sc.imdb; merged.rt = sc.rt; merged.meta = sc.meta; }
      if (wantsOmdb) merged.omdbTried = true;
      if (tr) merged.trailer = tr;
      if (wantsVideos) merged.videosTried = true;
      if (pr) merged.watch = pr.watch;
      /* stamped even when the call failed, so a flaky network doesn't mean a
         fetch on every single render */
      if (wantsProviders) merged.watchAt = Date.now();
      rec.facts = merged;
      rec.updatedAt = Date.now();
      saveData();
      if (onDone) onDone(merged);
    }).catch(function(){});
    return;
  }

  if (!loadTmdbCred()) return;
  buildFacts(night.tmdbId, night.title + (night.year ? ' ' + night.year : '')).then(function(f2){
    var rec = data.records[night.id];
    if (!rec || rec.deleted) return;
    rec.facts = f2;
    /* a night typed in by hand has no poster; the facts fetch knows it */
    if (!rec.posterPath && f2.poster) rec.posterPath = f2.poster;
    rec.updatedAt = Date.now();
    saveData();
    if (onDone) onDone(f2);
  }).catch(function(){});
}

/* ===== fmn/data.js ===== */
/* Family Movie Night — fmn/data.js
   Records, family Gist sync, whose-turn-it-is, quote matching, sample data.

   These files load in a fixed order from index.html and share one global
   scope, exactly as the single inline script did. Order matters: boot.js
   runs the startup calls and must stay last. */

/* ---------- data ---------- */
var data = Store.get('data', { records:{} });
if (!data.records) data.records = {};

function saveData(){
  data.updatedAt = Date.now();
  if (!Store.set('data', data)) toast('Storage full — could not save');
  scheduleSync();
}

/* ---------- family Gist sync (safe merge + tombstones — canonical) ----------
   Rules that prevent the data-loss bugs other family apps hit:
   - every record has id + updatedAt; per-record newest-wins on merge
   - deletes are tombstones ({deleted:true}), purged after 60 days
   - on save: fetch remote FIRST, merge, then write — never blind-overwrite */
var Sync = {
  filename: 'family-movie-night-data.json',
  gistId: function(){ return Store.get('gist_id') || ''; },
  token: function(){ return Store.get('gist_token') || ''; },
  configured: function(){ return !!(this.gistId() && this.token()); },
  headers: function(){
    return {
      'Authorization': 'Bearer ' + this.token(),
      'Accept': 'application/vnd.github+json'
    };
  },
  pullRemote: function(){
    var self = this;
    return fetch('https://api.github.com/gists/' + self.gistId(), { headers: self.headers() })
      .then(function(res){
        if (!res.ok) throw new Error('Gist fetch failed: ' + res.status);
        return res.json();
      })
      .then(function(gist){
        var file = gist.files[self.filename];
        if (!file) return { records:{} };
        if (file.truncated){
          return fetch(file.raw_url).then(function(r){ return r.text(); })
            .then(function(t){ return JSON.parse(t || '{"records":{}}'); });
        }
        return JSON.parse(file.content || '{"records":{}}');
      });
  },
  merge: function(local, remote){
    var out = { records: {} };
    var id;
    for (id in (remote.records || {})) out.records[id] = remote.records[id];
    for (id in (local.records || {})){
      var rec = local.records[id];
      var r = out.records[id];
      if (!r || (rec.updatedAt || 0) > (r.updatedAt || 0)) out.records[id] = rec;
    }
    var cutoff = Date.now() - 60 * 86400000;
    for (id in out.records){
      var t = out.records[id];
      if (t && t.deleted && (t.updatedAt || 0) < cutoff) delete out.records[id];
    }
    return out;
  },
  save: function(localData){
    var self = this;
    var mergedHolder = localData;
    return self.pullRemote()
      .catch(function(){ return null; }) // offline or first save — proceed with local
      .then(function(remote){
        var merged = remote ? self.merge(localData, remote) : localData;
        mergedHolder = merged;
        // demo nights stay local — never seed the family gist with sample data
        var upload = { records:{} };
        for (var id in merged.records){
          if (!merged.records[id].sample) upload.records[id] = merged.records[id];
        }
        return fetch('https://api.github.com/gists/' + self.gistId(), {
          method: 'PATCH',
          headers: Object.assign({ 'Content-Type':'application/json' }, self.headers()),
          body: JSON.stringify({ files: (function(){
            var f = {};
            f[self.filename] = { content: JSON.stringify(upload, null, 2) };
            return f;
          })() })
        });
      })
      .then(function(res){
        if (!res.ok) throw new Error('Gist save failed: ' + res.status);
        Store.set('data', mergedHolder);
        Store.set('last_sync', Date.now());
        return mergedHolder;
      });
  },
  load: function(){
    var self = this;
    var local = Store.get('data', { records:{} });
    return self.pullRemote().then(function(remote){
      var merged = self.merge(local, remote);
      Store.set('data', merged);
      Store.set('last_sync', Date.now());
      return merged;
    });
  },
  createGist: function(){
    var self = this;
    return fetch('https://api.github.com/gists', {
      method: 'POST',
      headers: Object.assign({ 'Content-Type':'application/json' }, self.headers()),
      body: JSON.stringify({
        description: 'family-movie-night-data',
        public: false,
        files: (function(){
          var f = {};
          f[self.filename] = { content: '{"records":{}}' };
          return f;
        })()
      })
    }).then(function(res){
      if (!res.ok) throw new Error('Gist create failed: ' + res.status);
      return res.json();
    }).then(function(gist){
      Store.set('gist_id', gist.id);
      return gist.id;
    });
  }
};
var syncTimer = null;
var syncBusy = false;
function overlaysOpen(){
  return !!document.querySelector('.modal-overlay') || !!document.querySelector('.scrap-overlay');
}
/* don't repaint out from under someone mid-keystroke — a background sync
   landing while a token is half-typed would wipe the field */
function userIsTyping(){
  var a = document.activeElement;
  return !!(a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA'));
}
function adoptMerged(merged){
  var changed = JSON.stringify(merged) !== JSON.stringify(data);
  data = merged;
  // a phone that just received the family's real nights (or their dismissal
  // of the demo) shouldn't keep showing sample movies alongside them
  if (hasSample() && (samplesDismissed() || hasRealNights())){
    clearSample(true);
    return true;
  }
  if (changed && !overlaysOpen() && !userIsTyping()) render();
  return changed;
}
function scheduleSync(){
  if (!Sync.configured()) return;
  clearTimeout(syncTimer);
  syncTimer = setTimeout(runSync, 1500);
}
function runSync(){
  if (!Sync.configured() || syncBusy) return;
  syncBusy = true;
  Sync.save(data).then(function(merged){
    syncBusy = false;
    adoptMerged(merged);
  }).catch(function(){
    syncBusy = false;
    toast('Saved on this phone — family sync will retry');
  });
}
function pullSync(quiet){
  if (!Sync.configured() || syncBusy) return;
  syncBusy = true;
  Sync.load().then(function(merged){
    syncBusy = false;
    var changed = adoptMerged(merged);
    if (!quiet) toast(changed ? 'Synced — new family entries in! 🍿' : 'Synced — all caught up ✓');
  }).catch(function(){
    syncBusy = false;
    if (!quiet) toast('Couldn’t reach the family gist — check token & connection');
  });
}
document.addEventListener('visibilitychange', function(){
  if (document.visibilityState === 'visible' && !overlaysOpen()) pullSync(true);
});
function liveRecords(type){
  var out = [];
  for (var id in data.records){
    var r = data.records[id];
    if (r && !r.deleted && r.type === type) out.push(r);
  }
  return out;
}
function nights(){
  return liveRecords('night').sort(function(a,b){
    return a.date === b.date ? (b.updatedAt||0)-(a.updatedAt||0) : (a.date < b.date ? 1 : -1);
  });
}
function reactionFor(nightId, memberId){
  var r = data.records['rx_' + nightId + '_' + memberId];
  return (r && !r.deleted) ? r : null;
}
function rxQuotes(r){

function nightHappened(n){

     family are both written before the movie, so counting any reaction content
     meant Kat filling hers in at breakfast dropped the card into the memory

}

    nf = AZ.addDays(nf, 7);

  var since = nightsSinceAnchor();

  var a = rotationAnchor();
  if (a) return memberById(a.member);
  var past = turnNights(happenedNights());
  if (past.length) return rotationNext(past[0].pickedBy);
  return MEMBERS[0];
}
/* The upcoming calendar, one row per Friday. Every Friday gets a slot, so a
   movie booked a month out no longer swallows the open Fridays in front of

}

function lineupSlots(count){

      slots.push({ date: cursor, title: null, night: null, member: null, skipped: true });

/* ---------- quote matching ----------

function normQuote(s){
  return String(s || '')
    .toLowerCase()
    .replace(/[‘’“”"']/g, '')
    .replace(/[^a-z0-9\s]/g, ' ')

  // one is a longer telling of the other ("Weaknesses: cake" inside
  // "Strengths: none. Weaknesses: cake") — guarded so tiny lines like
  // "hey" don't swallow everything they appear in
  if (na.length >= 8 && nb.length >= 8 && (na.indexOf(nb) !== -1 || nb.indexOf(na) !== -1)) return true;

  var ta = na.split(' '), tb = nb.split(' ');
  if (ta.length < 3 || tb.length < 3) return false;

/* ===== fmn/ui.js ===== */
/* Family Movie Night — fmn/ui.js
   DOM helpers, stars, the modal shell, logging a night, reactions, deleting.

   These files load in a fixed order from index.html and share one global
   scope, exactly as the single inline script did. Order matters: boot.js
   runs the startup calls and must stay last. */

/* ---------- tiny DOM helpers ---------- */
function el(tag, cls, text){
  var n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined && text !== null) n.textContent = text;
  return n;
}
function toast(msg){
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(function(){ t.classList.remove('show'); }, 2600);
}
/* ---------- stars (supports halves) ----------
   Ratings are stored as numbers in 0.5 steps. Whole-number ratings saved
   by earlier versions stay valid. Each star is an outline glyph with a
   filled glyph layered on top, clipped to 0 / 50 / 100% width. */
function clampStars(n){
  n = Math.round((Number(n) || 0) * 2) / 2;
  return Math.max(0, Math.min(5, n));
}
function starFillPct(rating, position){
  if (rating >= position) return 100;
  if (rating >= position - 0.5) return 50;
  return 0;
}
/* "3½" — for toasts and hints */
function starText(n){
  n = clampStars(n);
  var whole = Math.floor(n);
  return (n - whole >= 0.5) ? (whole + '½') : String(whole);
}
function starUnit(pct){
  var st = el('span','st');
  st.appendChild(document.createTextNode('☆'));
  var fill = el('span','fill','★');
  fill.style.width = pct + '%';
  st.appendChild(fill);
  return st;
}
function starsNode(n, cls){
  n = clampStars(n);
  var span = el('span', cls || 'stars');
  for (var i=1;i<=5;i++) span.appendChild(starUnit(starFillPct(n, i)));
  return span;
}
function confettiBurst(count){
  var colors = ['#FFB454','#F2705F','#A8C686','#8FB8DE','#FFC94A','#FFEFD9'];
  var wrap = el('div','confetti');
  var n = count || 44;
  for (var i=0;i<n;i++){
    var p = document.createElement('i');
    p.style.left = (Math.random()*100) + 'vw';
    p.style.background = colors[i % colors.length];
    p.style.animationDuration = (1.6 + Math.random()*1.4) + 's';
    p.style.animationDelay = (Math.random()*0.4) + 's';
    p.style.transform = 'rotate(' + Math.floor(Math.random()*360) + 'deg)';
    wrap.appendChild(p);
  }
  document.body.appendChild(wrap);
  setTimeout(function(){ wrap.remove(); }, 3600);
}

/* ---------- generic modal shell ---------- */
function openModal(build){
  var overlay = el('div','modal-overlay');
  var box = el('div','modal-box');
  overlay.appendChild(box);
  overlay.addEventListener('click', function(e){ if (e.target === overlay) overlay.remove(); });
  build(box, function close(){ overlay.remove(); });
  document.body.appendChild(overlay);
  return overlay;
}
function confirmModal(opts){
  openModal(function(box, close){
    box.appendChild(el('h3', null, opts.title));
    box.appendChild(el('p', null, opts.message));
    var row = el('div','modal-buttons');
    var cancel = el('button','btn-secondary', opts.cancelText || 'Cancel');
    cancel.addEventListener('click', close);
    var ok = el('button','btn-primary', opts.confirmText || 'OK');
    ok.addEventListener('click', function(){ close(); if (opts.onConfirm) opts.onConfirm(); });
    row.appendChild(cancel); row.appendChild(ok);
    box.appendChild(row);
  });
}

/* ---------- log-a-night modal ---------- */
function openAddNight(){
  var sel = null;
  openModal(function(box, close){
    box.appendChild(el('h3', null, '🍿 Log a Movie Night'));
    box.appendChild(el('div','msub','What did the family watch?'));

    var cred = loadTmdbCred();
    var manualWrap = el('div');
    var searchWrap = el('div');
    var selWrap = el('div');
    function renderSel(){
      while (selWrap.firstChild) selWrap.removeChild(selWrap.firstChild);
      if (!sel) return;
      var lbl = el('div','f-label','Tonight’s feature');
      var card = el('div','m-results');
      var rowBtn = el('div','m-result');
      var mini = el('div','mini');
      if (sel.posterPath){
        var img = document.createElement('img');
        img.alt = ''; img.src = TMDB_IMG + sel.posterPath;
        mini.appendChild(img);
      }
      var tx = el('div');
      tx.appendChild(el('div','t', sel.title));
      tx.appendChild(el('div','y', sel.year ? String(sel.year) : ''));
      rowBtn.appendChild(mini); rowBtn.appendChild(tx);
      card.appendChild(rowBtn);
      selWrap.appendChild(lbl); selWrap.appendChild(card);
    }

    if (cred){
      var sLbl = el('div','f-label','Search');
      var sInput = el('input','f-input');
      sInput.type = 'search'; sInput.placeholder = 'Search movies (TMDB)…'; sInput.autocomplete = 'off';
      var resBox = el('div');
      var timer = null;
      sInput.addEventListener('input', function(){
        clearTimeout(timer);
        var q = sInput.value.trim();
        if (q.length < 2){ while (resBox.firstChild) resBox.removeChild(resBox.firstChild); return; }
        timer = setTimeout(function(){
          tmdbSearch(q).then(function(d){
            while (resBox.firstChild) resBox.removeChild(resBox.firstChild);
            var list = (d.results || []).slice(0, 5);
            if (!list.length) return;
            var wrap = el('div','m-results');
            list.forEach(function(r){
              var b = el('button','m-result');
              b.type = 'button';
              var mini = el('div','mini');
              if (r.poster_path){
                var img = document.createElement('img');
                img.alt = ''; img.loading = 'lazy';
                img.src = 'https://image.tmdb.org/t/p/w92' + r.poster_path;
                mini.appendChild(img);
              }
              var tx = el('div');
              tx.appendChild(el('div','t', r.title));
              tx.appendChild(el('div','y', (r.release_date || '').slice(0,4)));
              b.appendChild(mini); b.appendChild(tx);
              b.addEventListener('click', function(){
                sel = { title: r.title, year: Number((r.release_date||'').slice(0,4)) || null,
                        tmdbId: r.id, posterPath: r.poster_path || null };
                while (resBox.firstChild) resBox.removeChild(resBox.firstChild);
                sInput.value = '';
                renderSel();
              });
              wrap.appendChild(b);
            });
            resBox.appendChild(wrap);
          }).catch(function(){ toast('Search failed — try manual entry'); });
        }, 350);
      });
      searchWrap.appendChild(sLbl);
      searchWrap.appendChild(sInput);
      searchWrap.appendChild(resBox);
      var manualLink = el('button','linky','or type it in manually');
      manualLink.type = 'button';
      manualLink.addEventListener('click', function(){
        searchWrap.style.display = 'none';
        manualWrap.style.display = 'block';
      });
      searchWrap.appendChild(manualLink);
      manualWrap.style.display = 'none';
    } else {
      var note = el('div','m-note',
        'Tip: add a free TMDB key in Settings and you’ll get posters & movie search here. Manual entry works great too.');
      searchWrap.appendChild(note);
    }

    manualWrap.appendChild(el('div','f-label','Movie title'));
    var tInput = el('input','f-input');
    tInput.type = 'text'; tInput.placeholder = 'e.g. The Iron Giant';
    manualWrap.appendChild(tInput);
    manualWrap.appendChild(el('div','f-label','Year (optional)'));
    var yInput = el('input','f-input');
    yInput.type = 'number'; yInput.inputMode = 'numeric'; yInput.placeholder = 'e.g. 1999';
    manualWrap.appendChild(yInput);

    var dateWrap = el('div');
    dateWrap.appendChild(el('div','f-label','Movie night date'));
    var dInput = el('input','f-input');
    dInput.type = 'date'; dInput.value = AZ.today();
    dateWrap.appendChild(dInput);

    /* bonus nights — a trip to the theatre, a rainy Sunday, a sleepover */
    var isBonusNight = false;
    var venue = 'home';
    var bonusWrap = el('div');
    var bonusRow = el('div','pick-chips');
    var bonusBtn = el('button','pick-chip','🎟️ Bonus movie — doesn’t use a turn');
    bonusBtn.type = 'button';
    var venueWrap = el('div');
    venueWrap.style.display = 'none';
    bonusBtn.addEventListener('click', function(){
      isBonusNight = !isBonusNight;
      bonusBtn.classList.toggle('on', isBonusNight);
      bonusBtn.style.background = isBonusNight ? 'var(--amber)' : '';
      bonusBtn.style.color = isBonusNight ? 'var(--btn-ink)' : '';
      venueWrap.style.display = isBonusNight ? 'block' : 'none';
      pickHint.textContent = isBonusNight
        ? 'Whose idea was it? Their turn still stands.'
        : 'Whose pick was it?';
    });
    bonusRow.appendChild(bonusBtn);
    bonusWrap.appendChild(bonusRow);
    venueWrap.appendChild(el('div','f-label','Where did we watch it?'));
    var venueRow = el('div','pick-chips');
    [{ id:'home', label:'🛋 On the couch' }, { id:'theater', label:'🍿 At the theatre' }]
      .forEach(function(v){
        var c = el('button','pick-chip' + (venue === v.id ? ' on' : ''), v.label);
        c.type = 'button';
        if (venue === v.id) c.style.background = 'var(--amber)';
        c.addEventListener('click', function(){
          venue = v.id;
          for (var i=0;i<venueRow.children.length;i++){
            var on = venueRow.children[i] === c;
            venueRow.children[i].classList.toggle('on', on);
            venueRow.children[i].style.background = on ? 'var(--amber)' : '';
            venueRow.children[i].style.color = on ? 'var(--btn-ink)' : '';
          }
        });
        venueRow.appendChild(c);
      });
    venueWrap.appendChild(venueRow);
    bonusWrap.appendChild(venueWrap);

    var pickWrap = el('div');
    var pickHint = el('div','f-label','Whose pick was it?');
    pickWrap.appendChild(pickHint);
    var chips = el('div','pick-chips');
    var picked = (pickerForDate(AZ.today()) || pickerForNewNight()).id;
    MEMBERS.forEach(function(m){
      var c = el('button','pick-chip', m.name);
      c.type = 'button';
      function paint(){
        if (picked === m.id){ c.classList.add('on'); c.style.background = m.color; }
        else { c.classList.remove('on'); c.style.background = ''; }
      }
      c.addEventListener('click', function(){ picked = m.id; repaintAll(); });
      c._paint = paint;
      chips.appendChild(c);
    });
    function repaintAll(){
      var kids = chips.children;
      for (var i=0;i<kids.length;i++) if (kids[i]._paint) kids[i]._paint();
    }
    repaintAll();
    pickWrap.appendChild(chips);
    /* Booking a night that hasn't happened yet is almost always someone
       claiming a Friday, so follow the calendar: whoever's turn that date is
       gets preselected. Past the end of the projected lineup we fall back to
       whoever's holding the phone. Either way the chips are right there. */
    var touchedPicker = false;
    chips.addEventListener('click', function(){ touchedPicker = true; });
    dInput.addEventListener('change', function(){
      if (touchedPicker) return;
      // the calendar knows whose Friday this is; fall back to whoever's
      // holding the phone only for a date the lineup doesn't reach
      var owner = pickerForDate(dInput.value), me = whoAmI();
      picked = (owner || (me && dInput.value > AZ.today() ? me : pickerForNewNight())).id;
      repaintAll();
    });

    var row = el('div','modal-buttons');
    var cancel = el('button','btn-secondary','Cancel');
    cancel.addEventListener('click', close);
    var save = el('button','btn-primary','Save the Night');
    save.addEventListener('click', function(){
      var title = sel ? sel.title : tInput.value.trim();
      if (!title){ toast('Give the movie a title first'); return; }
      var year = sel ? sel.year : (Number(yInput.value) || null);
      var date = dInput.value || AZ.today();
      var id = 'night_' + Date.now() + '_' + Math.floor(Math.random()*1e6);
      data.records[id] = {
        id:id, type:'night', title:title, year:year, date:date, pickedBy:picked,
        bonus: isBonusNight || false,
        venue: isBonusNight ? venue : 'home',
        tmdbId: sel ? sel.tmdbId : null, posterPath: sel ? sel.posterPath : null,
        updatedAt: Date.now()
      };
      saveData();
      close();
      render();
      toast(isBonusNight
        ? 'Bonus movie added — nobody loses a turn 🎟️'
        : memberById(picked).name + '’s pick is saved — everyone add your reactions!');
    });
    row.appendChild(cancel); row.appendChild(save);

    box.appendChild(searchWrap);
    box.appendChild(manualWrap);
    box.appendChild(selWrap);
    box.appendChild(dateWrap);
    box.appendChild(bonusWrap);
    box.appendChild(pickWrap);
    box.appendChild(row);
  });
}

/* ---------- reaction modal ---------- */
function openReaction(night, member){
  var existing = reactionFor(night.id, member.id);
  var stars = existing ? existing.stars : 0;
  var isPicker = night.pickedBy === member.id;
  var poll = existing && existing.poll ? {
    laughed: !!existing.poll.laughed, cried: !!existing.poll.cried,
    rewatch: !!existing.poll.rewatch, seenBefore: !!existing.poll.seenBefore
  } : { laughed:false, cried:false, rewatch:false, seenBefore:false };

  openModal(function(box, close){
    var h = el('h3', null, member.name + '’s Reaction');
    h.style.color = memberInk(member);
    box.appendChild(h);
    box.appendChild(el('div','msub', night.title + ' · ' + AZ.pretty(night.date)
      + (isBonus(night) ? ' · family bonus' + (night.venue === 'theater' ? ' at the theatre' : '') : '')));

    box.appendChild(el('div','f-label','Star rating'));
    var sp = el('div','starpick');
    var starBtns = [];
    var hint = el('div','starpick-hint','');
    function paintStars(){
      starBtns.forEach(function(b, i){
        var pct = starFillPct(stars, i + 1);
        b.querySelector('.fill').style.width = pct + '%';
        b.classList.toggle('on', pct > 0);
      });
      hint.textContent = stars
        ? starText(stars) + ' out of 5 · tap again to clear'
        : 'Tap the stars — left half of a star for a ½';
    }
    for (var i=1;i<=5;i++){
      (function(n){
        var b = el('button');
        b.type = 'button';
        b.setAttribute('aria-label', n + ' stars (left half for ' + (n - 0.5) + ')');
        b.appendChild(starUnit(0));
        b.addEventListener('click', function(e){
          // left half of the glyph = half star; keyboard activation (no
          // pointer coords) always takes the whole star
          var rect = b.getBoundingClientRect();
          var viaPointer = e.clientX || e.clientY;
          var picked = (viaPointer && (e.clientX - rect.left) < rect.width / 2) ? n - 0.5 : n;
          stars = (picked === stars) ? 0 : picked; // tapping the same value clears it
          paintStars();
        });
        starBtns.push(b);
        sp.appendChild(b);
      })(i);
    }
    paintStars();
    box.appendChild(sp);
    box.appendChild(hint);

    /* director's intro — for whoever chose the film, bonus or not */
    var why = null;
    if (isPicker){
      box.appendChild(el('div','f-label', isBonus(night)
        ? '🎬 Director’s intro — why this one?'
        : '🎬 Director’s intro — why this movie?'));
      why = el('textarea','f-area');
      why.placeholder = isBonus(night)
        ? 'Tell the family why you brought this one home…'
        : 'Tell the family why you picked tonight’s film…';
      why.value = existing ? (existing.why || '') : '';
      box.appendChild(why);
    }

    /* the picker's own question — theirs to write, everyone else's to answer */
    var askBox = null;
    if (isPicker){
      box.appendChild(el('div','f-label','❓ Your question for the family'));
      askBox = el('input','f-input');
      askBox.type = 'text';
      askBox.placeholder = 'e.g. Who’s going to cry first?';
      askBox.value = night.question || '';
      box.appendChild(askBox);
      box.appendChild(el('div','set-note','Ask one thing and everybody answers it in their own reaction. It gets its own page in the scrapbook.'));
    }

    /* ...and everybody's answer to it */
    var answer = null;
    if (night.question){
      box.appendChild(el('div','f-label','❓ ' + night.question));
      answer = el('textarea','f-area');
      answer.placeholder = memberById(night.pickedBy).name + ' wants to know…';
      answer.value = existing ? (existing.answer || '') : '';
      box.appendChild(answer);
    }

    box.appendChild(el('div','f-label','What did you think?'));
    var thought = el('textarea','f-area');
    thought.placeholder = 'Your two-sentence review…';
    thought.value = existing ? (existing.thought || '') : '';
    box.appendChild(thought);

    box.appendChild(el('div','f-label','Favorite character'));
    var character = el('input','f-input');
    character.type = 'text';
    character.placeholder = 'Who stole the movie for you?';
    character.value = existing ? (existing.character || '') : '';
    box.appendChild(character);

    box.appendChild(el('div','f-label','🎞 Favorite scenes'));
    var sceneList = el('div','multi-list');
    function addSceneInput(val){
      var s = el('textarea','f-area');
      s.placeholder = sceneList.children.length
        ? 'Another moment worth replaying…'
        : 'Set the scene — which moment will you replay forever?';
      s.value = val || '';
      sceneList.appendChild(s);
      return s;
    }
    var exScenes = rxScenes(existing);
    if (exScenes.length) exScenes.forEach(function(s){ addSceneInput(s); });
    else addSceneInput('');
    box.appendChild(sceneList);
    var moreS = el('button','linky','+ add another scene');
    moreS.type = 'button';
    moreS.addEventListener('click', function(){ addSceneInput('').focus(); });
    box.appendChild(moreS);

    box.appendChild(el('div','f-label','Favorite quotes'));
    var quoteList = el('div','multi-list');
    function addQuoteInput(val){
      var q = el('input','f-input');
      q.type = 'text';
      q.placeholder = quoteList.children.length
        ? 'Another line worth keeping…'
        : 'The line you’ll be repeating all week';
      q.value = val || '';
      quoteList.appendChild(q);
      return q;
    }
    var exQuotes = rxQuotes(existing);
    if (exQuotes.length) exQuotes.forEach(function(q){ addQuoteInput(q); });
    else addQuoteInput('');
    box.appendChild(quoteList);
    var moreQ = el('button','linky','+ add another quote');
    moreQ.type = 'button';
    moreQ.addEventListener('click', function(){ addQuoteInput('').focus(); });
    box.appendChild(moreQ);

    box.appendChild(el('div','f-label','Favorite movie night memories'));
    var memList = el('div','multi-list');
    function addMemInput(val){
      var m = el('textarea','f-area');
      m.placeholder = memList.children.length
        ? 'Another moment from the night…'
        : 'Not the movie — the night. What happened on the couch?';
      m.value = val || '';
      memList.appendChild(m);
      return m;
    }
    var exMems = rxMemories(existing);
    if (exMems.length) exMems.forEach(function(m){ addMemInput(m); });
    else addMemInput('');
    box.appendChild(memList);
    var moreM = el('button','linky','+ add another memory');
    moreM.type = 'button';
    moreM.addEventListener('click', function(){ addMemInput('').focus(); });
    box.appendChild(moreM);

    /* the family poll */
    box.appendChild(el('div','f-label','🗳 The family poll'));
    var pollRow = el('div','poll-chips');
    [
      { key:'laughed',    label:'😂 I laughed' },
      { key:'cried',      label:'😢 I cried' },
      { key:'rewatch',    label:'🔁 I’d see it again' },
      { key:'seenBefore', label:'👀 Seen it before' }
    ].forEach(function(pq){
      var c = el('button','poll-chip' + (poll[pq.key] ? ' on' : ''), pq.label);
      c.type = 'button';
      c.addEventListener('click', function(){
        poll[pq.key] = !poll[pq.key];
        c.classList.toggle('on', poll[pq.key]);
      });
      pollRow.appendChild(c);
    });
    box.appendChild(pollRow);

    var row = el('div','modal-buttons');
    var cancel = el('button','btn-secondary','Cancel');
    cancel.addEventListener('click', close);
    var save = el('button','btn-gold', existing ? 'Update' : 'Save Reaction');
    save.addEventListener('click', function(){
      var quotes = [];
      for (var i=0;i<quoteList.children.length;i++){
        var v = quoteList.children[i].value.trim();
        if (v) quotes.push(v);
      }
      var memories = [];
      for (var j=0;j<memList.children.length;j++){
        var mv = memList.children[j].value.trim();
        if (mv) memories.push(mv);
      }
      var scenes = [];
      for (var s=0;s<sceneList.children.length;s++){
        var sv = sceneList.children[s].value.trim();
        if (sv) scenes.push(sv);
      }
      var id = 'rx_' + night.id + '_' + member.id;
      data.records[id] = {
        id:id, type:'reaction', nightId:night.id, member:member.id,
        stars:stars, why: (isPicker && why) ? why.value.trim() : (existing ? existing.why || '' : ''),
        thought:thought.value.trim(), character:character.value.trim(),
        /* `scene` mirrors the first one so a phone still running the old
           build shows something rather than a blank scene page */
        scenes:scenes, scene:scenes[0] || '',
        quotes:quotes, memories:memories, poll:poll,
        answer: answer ? answer.value.trim() : (existing ? existing.answer || '' : ''),
        updatedAt: Date.now()
      };
      // the picker's question lives on the night, not the reaction
      if (askBox){
        var q = askBox.value.trim();
        var nrec = data.records[night.id];
        if (nrec && !nrec.deleted && (nrec.question || '') !== q){
          nrec.question = q;
          nrec.updatedAt = Date.now();
        }
      }
      saveData();
      close();
      render();
      if (stars === 5) confettiBurst();
      toast(stars ? member.name + ' gave it ' + starText(stars) + ' stars' : 'Saved ' + member.name + '’s reaction');
    });
    row.appendChild(cancel); row.appendChild(save);
    box.appendChild(row);
  });
}

/* ---------- delete a night (tombstone) ---------- */
function reallyDeleteNight(night){
      var now = Date.now();
      data.records[night.id] = { id:night.id, type:'night', deleted:true, updatedAt:now };
      MEMBERS.forEach(function(m){
        var rid = 'rx_' + night.id + '_' + m.id;
        if (data.records[rid]) data.records[rid] = { id:rid, type:'reaction', deleted:true, updatedAt:now };
      });
  saveData();
  render();
  toast('Night removed');
}
/* Deleting a night throws away everyone's writing, so it takes a
   deliberate path: a menu, then a confirm that names what is lost, then
   a second confirm whenever anybody has already written something. */
function deleteNight(night){
  var filled = MEMBERS.filter(function(m){ return rxHasContent(reactionFor(night.id, m.id)); });
  if (!filled.length){
    confirmModal({
      title:'Remove this night?',
      message:'“' + night.title + '” (' + AZ.pretty(night.date) + ') has no reactions yet.',
      confirmText:'Delete night',
      onConfirm: function(){ reallyDeleteNight(night); }
    });
    return;
  }
  openModal(function(box, close){
    box.appendChild(el('h3', null, 'Delete this movie night?'));
    box.appendChild(el('div','msub', night.title + ' · ' + AZ.pretty(night.date)));
    var note = el('div','danger-note');
    note.appendChild(document.createTextNode(
      'This permanently deletes ' + filled.length + ' saved reaction' + (filled.length===1?'':'s') +
      ' from ' + memberNames(filled) + ' — every rating, quote, favorite scene and memory from that night. It cannot be undone.'));
    box.appendChild(note);
    var row = el('div','modal-buttons');
    var keep = el('button','btn-secondary','Keep it');
    keep.addEventListener('click', close);
    var go = el('button','btn-danger','Continue');
    go.addEventListener('click', function(){
      close();
      confirmModal({
        title:'Are you sure?',
        message:'Last chance — “' + night.title + '” and ' + memberNames(filled) + '’s writing will be gone for good.',
        confirmText:'Delete forever',
        onConfirm: function(){ reallyDeleteNight(night); }
      });
    });
    row.appendChild(keep); row.appendChild(go);
    box.appendChild(row);
  });
}
/* edit a night — mainly for moving a Friday that didn't happen, which
   pushes everyone behind it down the rotation automatically */
function openEditNight(night){
  openModal(function(box, close){
    box.appendChild(el('h3', null, 'Edit this movie night'));
    box.appendChild(el('div','msub', nightHappened(night) ? 'Already watched' : 'Not watched yet'));

    box.appendChild(el('div','f-label','Movie title'));
    var tInput = el('input','f-input');
    tInput.type = 'text';
    tInput.value = night.title || '';
    box.appendChild(tInput);

    box.appendChild(el('div','f-label','Movie night date'));
    var dInput = el('input','f-input');
    dInput.type = 'date';
    dInput.value = night.date;
    box.appendChild(dInput);
    var hint = el('div','set-note','Moving this to a later date keeps everyone’s turn in order — the rest of the lineup shifts with it.');
    box.appendChild(hint);

    box.appendChild(el('div','f-label','Kind of night'));
    var eBonus = !!night.bonus;
    var eVenue = night.venue || 'home';
    var eBonusRow = el('div','pick-chips');
    var eBonusBtn = el('button','pick-chip' + (eBonus ? ' on' : ''), '🎟️ Bonus — doesn’t use a turn');
    eBonusBtn.type = 'button';
    if (eBonus){ eBonusBtn.style.background = 'var(--amber)'; eBonusBtn.style.color = 'var(--btn-ink)'; }
    var eVenueRow = el('div','pick-chips');
    eVenueRow.style.display = eBonus ? 'flex' : 'none';
    eBonusBtn.addEventListener('click', function(){
      eBonus = !eBonus;
      eBonusBtn.classList.toggle('on', eBonus);
      eBonusBtn.style.background = eBonus ? 'var(--amber)' : '';
      eBonusBtn.style.color = eBonus ? 'var(--btn-ink)' : '';
      eVenueRow.style.display = eBonus ? 'flex' : 'none';
    });
    eBonusRow.appendChild(eBonusBtn);
    box.appendChild(eBonusRow);
    [{ id:'home', label:'🛋 On the couch' }, { id:'theater', label:'🍿 At the theatre' }]
      .forEach(function(v){
        var c = el('button','pick-chip' + (eVenue === v.id ? ' on' : ''), v.label);
        c.type = 'button';
        if (eVenue === v.id){ c.style.background = 'var(--amber)'; c.style.color = 'var(--btn-ink)'; }
        c.addEventListener('click', function(){
          eVenue = v.id;
          for (var i=0;i<eVenueRow.children.length;i++){
            var on = eVenueRow.children[i] === c;
            eVenueRow.children[i].classList.toggle('on', on);
            eVenueRow.children[i].style.background = on ? 'var(--amber)' : '';
            eVenueRow.children[i].style.color = on ? 'var(--btn-ink)' : '';
          }
        });
        eVenueRow.appendChild(c);
      });
    box.appendChild(eVenueRow);

    box.appendChild(el('div','f-label','❓ Question for the family'));
    var qInput = el('input','f-input');
    qInput.type = 'text';
    qInput.placeholder = 'e.g. Who’s going to cry first?';
    qInput.value = night.question || '';
    box.appendChild(qInput);
    box.appendChild(el('div','set-note','The picker’s own question — everyone answers it in their reaction.'));

    box.appendChild(el('div','f-label','Whose pick?'));
    var chips = el('div','pick-chips');
    var picked = night.pickedBy;
    MEMBERS.forEach(function(m){
      var c = el('button','pick-chip', m.name);
      c.type = 'button';
      function paint(){
        if (picked === m.id){ c.classList.add('on'); c.style.background = m.color; }
        else { c.classList.remove('on'); c.style.background = ''; }
      }
      c.addEventListener('click', function(){ picked = m.id; repaintAll(); });
      c._paint = paint;
      chips.appendChild(c);
    });
    function repaintAll(){
      var kids = chips.children;
      for (var i=0;i<kids.length;i++) if (kids[i]._paint) kids[i]._paint();
    }
    repaintAll();
    box.appendChild(chips);

    var row = el('div','modal-buttons');
    var cancel = el('button','btn-secondary','Cancel');
    cancel.addEventListener('click', close);
    var save = el('button','btn-gold','Save changes');
    save.addEventListener('click', function(){
      var title = tInput.value.trim();
      if (!title){ toast('The movie still needs a title'); return; }
      var rec = data.records[night.id];
      if (!rec || rec.deleted){ close(); return; }
      var year = Number(yInput.value) || null;
      /* Correcting the title means this row was the wrong film. Everything
         TMDB and Claude derived from the old one — poster, runtime, rating,
         certificate, trailer, where-to-watch, the pre-show pack — describes
         that other movie, and `ensureNightFacts` never refetches once
         `fetchedAt` is stamped, so leaving it behind pins the wrong poster to
         the right night forever. Drop it and let it fetch again. Reactions
         stay: those are the family's own words, and only they know whether
         the typo or the viewing was the mistake. */
      var swapped = (title !== rec.title) || (year !== (rec.year || null));
      if (swapped) forgetLookedUp(rec);
      /* Pushing a movie back leaves its old Friday empty, and an empty Friday
         reads as an open one — so the lineup hands it straight back to the
         same person and they turn up on two Fridays in a row. Ask, at the one
         moment the answer is obvious. Only for a move *later*, only when the
         old date is a Friday still ahead of us, and only if nothing else has
         claimed it. */
      var wasDate = rec.date;
      var newDate = dInput.value || rec.date;
      var vacated = (newDate > wasDate && wasDate >= AZ.today() && AZ.isFriday(wasDate)
        && !isSkipped(wasDate)) ? wasDate : null;
      rec.title = title;
      rec.year = year;
      rec.date = newDate;
      rec.pickedBy = picked;
      rec.question = qInput.value.trim();
      rec.bonus = eBonus;
      rec.venue = eBonus ? eVenue : 'home';
      rec.updatedAt = Date.now();
      saveData();
      close();
      render();
      toast(swapped ? 'Movie swapped — looking up the new one 🎬' : 'Movie night updated');
      if (vacated) askSkipVacated(vacated);
    });
    row.appendChild(cancel); row.appendChild(save);
    box.appendChild(row);
  });
}
/* Where the app lives, for pasting into a text. Query strings are
   cache-busters and hashes are modal state — neither belongs in a link
   somebody else is going to tap. */
function appUrl(){
  return location.origin + location.pathname;
}
function nudgeText(night, waiting){
  var lines = [];
  lines.push('🍿 ' + night.title + (night.year ? ' (' + night.year + ')' : ''));
  lines.push(memberNames(waiting) + ' — we still need your stars and your favorite bit!');
  lines.push('Open Family Movie Night, tap the night, and add what you thought.');
  var url = appUrl();
  if (/^https?:/.test(url)) lines.push(url);
  return lines.join('\n');
}
function copyNudge(text){
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text)
      .then(function(){ toast('Nudge copied — paste it into your texts 📋'); })
      .catch(function(){ toast('Couldn’t copy the nudge — try again'); });
    return;
  }
  toast('Couldn’t copy the nudge — try again');
}
function nudgeFamily(night){
  var waiting = membersWaitingOn(night.id);
  if (!waiting.length){ toast('Everyone’s already weighed in ✓'); return; }
  var text = nudgeText(night, waiting);
  if (!navigator.share){ copyNudge(text); return; }
  /* Same instant-rejection tell the backup share uses: a sheet the user
     actually saw and dismissed takes longer than this to come back. */
  var opened = Date.now();
  navigator.share({ title:'Family Movie Night', text: text })
    .catch(function(err){
      var name = (err && err.name) || 'Error';
      if (name === 'AbortError' && (Date.now() - opened) >= 700) return;
      copyNudge(text);
    });
}
/* The Friday a movie just moved off. Left alone it goes back in the rota and
   the same person comes up again the week before their own film. */
function askSkipVacated(date){
  var picker = pickerForDate(date);
  confirmModal({
    title: 'Skip ' + AZ.pretty(date) + '?',
    message: 'That Friday is empty now. Skip it and nobody loses a turn — '
      + (picker ? picker.name + ' still picks' : 'the order picks up')
      + ' the next Friday you’re on. Leave it and it stays open for a pick.',
    confirmText: 'Skip that Friday',
    cancelText: 'Leave it open',
    onConfirm: function(){
      setSkipped(date, true);
      render();
      toast('Friday off — nobody loses a turn 😴');
    }
  });
}
/* Taking a Friday off, and putting it back. Nobody's turn is spent either
   way — the point of a skip is that the order waits for you. */
function openSkipFriday(date, currentlySkipped){
  var picker = pickerForDate(date);
  openModal(function(box, close){
    box.appendChild(el('h3', null, currentlySkipped ? 'Movie night back on?' : 'Skip this Friday?'));

    });

}

/* ===== fmn/keepsakes.js ===== */
/* Family Movie Night — fmn/keepsakes.js
   Scrapbook, Year in Review, the Complete Collection, Claude packs, backups.

   These files load in a fixed order from index.html and share one global
   scope, exactly as the single inline script did. Order matters: boot.js
   runs the startup calls and must stay last. */

/* ---------- KEEPSAKE BUILDERS (shared by scrapbook + yearbook) ---------- */
function spTag(m){
  var t = el('span','sp-tag', m.name);
  t.style.background = m.onWhite;
  return t;
}
/* `key` names the section so the scrapbook can deal it onto the right sheet.
   Nothing else reads it — the yearbook keeps every section in one flow. */
function spSection(title, key){
  var s = el('div','sp-section');
  if (key) s.setAttribute('data-k', key);
  s.appendChild(el('div','sp-sec-title', title));
  return s;
}
/* renders the by-question groups for one night into container */
function buildNightKeepsake(container, night){
  var rots = [-1.4, 1.1, -0.7, 1.6];
  var picker = memberById(night.pickedBy);
  var pickerRx = reactionFor(night.id, picker.id);

  /* why the picker chose it */
  if (pickerRx && pickerRx.why){
    var whySec = spSection('🎬 Why ' + picker.name + ' picked it', 'why');
    var why = el('div','sp-why');
    why.appendChild(spTag(picker));
    why.appendChild(el('div','why-text','“' + pickerRx.why + '”'));
    whySec.appendChild(why);
    container.appendChild(whySec);
  }

  /* ratings */
  var rated = MEMBERS.filter(function(m){
    var r = reactionFor(night.id, m.id);
    return r && r.stars > 0;
  });
  if (rated.length){
    var rateSec = spSection('⭐ Our ratings', 'rates');
    var rates = el('div','sp-rates');
    rated.forEach(function(m){
      var r = reactionFor(night.id, m.id);
      var box = el('div','sp-rate');
      box.appendChild(spTag(m));
      box.appendChild(starsNode(r.stars));
      rates.appendChild(box);
    });
    rateSec.appendChild(rates);
    container.appendChild(rateSec);
  }

  /* what we thought */
  var thoughts = MEMBERS.filter(function(m){
    var r = reactionFor(night.id, m.id);
    return r && r.thought;
  });
  if (thoughts.length){
    var thoSec = spSection('💭 What we thought', 'thoughts');
    thoughts.forEach(function(m, i){
      var r = reactionFor(night.id, m.id);
      var note = el('div','sp-note');
      note.appendChild(spTag(m));
      note.appendChild(document.createTextNode(' “' + r.thought + '”'));
      note.style.transform = 'rotate(' + (rots[i % 4] * 0.5) + 'deg)';
      thoSec.appendChild(note);
    });
    container.appendChild(thoSec);
  }

  /* the picker's own question, and what everyone said back */
  if (night.question){
    var ansMembers = MEMBERS.filter(function(m){
      var r = reactionFor(night.id, m.id);
      return r && r.answer;
    });
    if (ansMembers.length){
      var qaSec = spSection('❓ ' + memberById(night.pickedBy).name + ' asked', 'asked');
      var asked = el('div','sp-asked', night.question);
      qaSec.appendChild(asked);
      ansMembers.forEach(function(m, i){
        var r = reactionFor(night.id, m.id);
        var note = el('div','sp-note');
        note.appendChild(spTag(m));
        note.appendChild(document.createTextNode(' ' + r.answer));
        note.style.transform = 'rotate(' + (rots[(i+1) % 4] * 0.5) + 'deg)';
        qaSec.appendChild(note);
      });
      container.appendChild(qaSec);
    }
  }

  /* favorite characters */
  var chars = MEMBERS.filter(function(m){
    var r = reactionFor(night.id, m.id);
    return r && r.character;
  });
  if (chars.length){
    var chSec = spSection('🌟 Favorite characters', 'chars');
    chars.forEach(function(m){
      var r = reactionFor(night.id, m.id);
      var line = el('div','sp-char-line');
      line.appendChild(spTag(m));
      line.appendChild(document.createTextNode(' ' + r.character));
      chSec.appendChild(line);
    });
    container.appendChild(chSec);
  }

  /* quotes — comic speech bubbles, tails alternating sides.
     Matching lines from different people share one bubble. */
  var qGroups = nightQuoteGroups(night.id);
  if (qGroups.length){
    var qSec = spSection('💬 Quotes we kept', 'quotes');
    qGroups.forEach(function(g, qi){
      var wrap = el('div','sp-comic-wrap' + (qi % 2 ? ' flip' : ''));
      var bubble = el('div','sp-comic', g.text);
      bubble.style.transform = 'rotate(' + (rots[qi % 4] * 0.6) + 'deg)';
      wrap.appendChild(bubble);
      var tags = el('div','sp-tags');
      g.members.forEach(function(m){ tags.appendChild(spTag(m)); });
      if (g.members.length > 1) tags.appendChild(el('span','sp-both', sharedQuoteNote(g.members.length)));
      wrap.appendChild(tags);
      qSec.appendChild(wrap);
    });
    container.appendChild(qSec);
  }

  /* favorite scenes — screenplay pages */
  var sceneMembers = MEMBERS.filter(function(m){
    return rxScenes(reactionFor(night.id, m.id)).length;
  });
  if (sceneMembers.length){
    var scSec = spSection('🎞 Favorite scenes', 'scenes');
    sceneMembers.forEach(function(m){
      /* one screenplay page per scene, so a second favorite doesn't get
         crammed into the first one's slugline */
      rxScenes(reactionFor(night.id, m.id)).forEach(function(sc, i){
        var pageEl = el('div','sp-scene');
        pageEl.appendChild(el('div','slug', m.name + '’s favorite scene'
          + (i ? ' · ' + (i + 1) : '')));
        pageEl.appendChild(el('div','cut','Cut to:'));
        pageEl.appendChild(el('div','action', sc));
        scSec.appendChild(pageEl);
      });
    });
    container.appendChild(scSec);
  }

  /* memories */
  var anyMems = false;
  var mSec = spSection('📌 Memories from the couch', 'memories');
  var mi = 0;
  MEMBERS.forEach(function(m){
    var r = reactionFor(night.id, m.id);
    rxMemories(r).forEach(function(mem){
      anyMems = true;
      var strip = el('div','sp-strip');
      strip.style.background = m.paper;
      strip.appendChild(spTag(m));
      strip.appendChild(document.createTextNode(' ' + mem));
      strip.style.transform = 'rotate(' + (rots[(mi+2) % 4] * 0.7) + 'deg)';
      mSec.appendChild(strip);
      mi++;
    });
  });
  if (anyMems) container.appendChild(mSec);

  /* the family poll */
  var tally = pollTally(night.id);
  if (tally.answered){
    var pSec = spSection('🗳 The family poll', 'poll');
    [
      { label:'😂 Did we laugh?', list:tally.laughed },
      { label:'😢 Did we cry?', list:tally.cried },
      { label:'🔁 Would we see it again?', list:tally.rewatch },
      { label:'👀 Seen it before?', list:tally.seenBefore }
    ].forEach(function(pq){
      var row = el('div','sp-poll-row');
      row.appendChild(el('span','pq', pq.label));
      row.appendChild(el('span','tally', pq.list.length + '/' + tally.answered));
      var dots = el('span','sp-pdots');
      MEMBERS.forEach(function(m){
        var yes = pq.list.indexOf(m) !== -1;
        var d = el('span','sp-pdot', m.name.charAt(0));
        if (yes){
          d.style.background = m.onWhite;
          d.style.borderColor = m.onWhite;
          d.style.color = '#fff';
        }
        dots.appendChild(d);
      });
      row.appendChild(dots);
      pSec.appendChild(row);
    });
    container.appendChild(pSec);
  }
}
function keepsakeOverlay(){
  var overlay = el('div','scrap-overlay');
  var closeBtn = el('button','scrap-close','✕');
  closeBtn.setAttribute('aria-label','Close');
  closeBtn.addEventListener('click', function(){ overlay.remove(); });
  overlay.appendChild(closeBtn);

}
/* how a night is credited on a keepsake page — a bonus belongs to the whole
   family, with the person who found it named alongside */
function creditLine(n){
  var picker = memberById(n.pickedBy);
  return isBonus(n)
    ? 'Family bonus · ' + picker.name + '’s find'
    : picker.name + '’s pick';
}
/* ---------- fitting the keepsake onto two sheets ----------
   Everything here is measured, not predicted. The first version estimated
   heights from character counts and was wrong in exactly the way that hurts:
   deleting a few quotes moved the estimate, moved the split, and printed
   FOUR pages with most of two of them blank. A sheet that overruns its page
   by a millimetre pushes the next sheet a whole page later, so the only
   honest answer is to lay it out at the real page size and look at it.

   The page box is US Letter less the 0.5in @page margin: 7.5 x 10 inches,
   which at CSS 96dpi is 720 x 960. The budget is deliberately a little under
   that: measuring off-screen and paginating for real differ by a percent or
   two, printers round differently again, and a sheet one percent over costs
   a whole page. Three tenths of an inch of slack is cheap insurance. */
var FIT_PAGE_H = 960;
var FIT_BUDGET = 930;
/* preference order: full size in two columns, then a third column — it buys
   about half a page again and costs nothing in legibility — and only then
   smaller type, down to where it stops being comfortable to read. */
var FIT_PLANS = (function(){
  var out = [];
  [2, 3].forEach(function(cols){
    [1, 0.95, 0.90, 0.85, 0.80, 0.75, 0.70, 0.66].forEach(function(scale){
      out.push({ cols: cols, scale: scale });
    });
  });
  /* two columns at full size first, then widen before shrinking */
  return out.sort(function(a, b){
    return (b.scale - a.scale) || (a.cols - b.cols);
  });
})();

/* Lay the given split out and report what each sheet would cost on paper. */
function fitMeasure(page, parts){
  var pad = 0.22 * 96;
  function h(elm){ return elm ? elm.getBoundingClientRect().height : 0; }
  var masthead = h(parts.kicker) + h(parts.title) + h(parts.date) + h(parts.head);
  return {
    one: pad + masthead + h(parts.one),
    two: parts.two.firstChild ? pad + h(parts.two) + h(parts.waiting) + h(parts.foot) + pad : 0
  };
}
/* Deal the first `cut` sections onto sheet one and the rest onto sheet two. */
function fitDeal(parts, cut){
  parts.secs.forEach(function(sec, i){
    (i < cut ? parts.one : parts.two).appendChild(sec);
  });
  var banner = parts.two.querySelector('.sp-sheet-head');
  if (cut >= parts.secs.length){
    if (banner) banner.remove();
  } else if (!banner){
    parts.two.insertBefore(el('div','sp-sheet-head','What we kept 🍿'), parts.two.firstChild);
  }
  parts.two.style.display = (cut >= parts.secs.length) ? 'none' : '';
}
/* Choose the split, the column count and the type size. Returns the plan it
   settled on so the caller can say what happened. */
function fitScrapbook(page){
  var parts = {
    secs: Array.prototype.slice.call(page.querySelectorAll('.sp-section')),
    one: page.querySelector('.sp-sheet.one'),
    two: page.querySelector('.sp-sheet.two'),
    kicker: page.querySelector('.sp-kicker'),
    title: page.querySelector('.sp-title'),
    date: page.querySelector('.sp-date'),
    head: page.querySelector('.sp-head'),
    waiting: page.querySelector('.sp-waiting'),
    foot: page.querySelector('.sp-foot')
  };
  if (!parts.one || !parts.two || !parts.secs.length) return null;

  page.classList.add('sp-fit', 'sp-fit-measure');
  var best = null;
  for (var p = 0; p < FIT_PLANS.length && !best; p++){
    var plan = FIT_PLANS[p];
    page.style.setProperty('--sp-cols', plan.cols);
    page.style.setProperty('--sp-scale', plan.scale);
    /* everything on one sheet is the nicest answer when it fits — a single
       well-filled page beats two thin ones */
    var candidates = [];
    for (var cut = 1; cut <= parts.secs.length; cut++) candidates.push(cut);
    var winner = null, winnerCost = Infinity;
    candidates.forEach(function(cut){
      fitDeal(parts, cut);
      var m = fitMeasure(page, parts);
      if (m.one > FIT_BUDGET || m.two > FIT_BUDGET) return;
      /* prefer the split that leaves the two sheets most even; a single sheet
         costs nothing and wins outright */
      var cost = m.two ? Math.abs(m.one - m.two) : -1;
      if (cost < winnerCost){ winnerCost = cost; winner = cut; }
    });
    if (winner !== null) best = { cols: plan.cols, scale: plan.scale, cut: winner };
  }
  if (!best){
    /* More writing than two readable pages can hold. Rather than lose any of
       it, take the smallest type and spill — but still split where the two
       sheets come out closest to even, so the overflow is a few lines onto a
       third page instead of one crammed sheet beside a half-empty one. */
    var last = FIT_PLANS[FIT_PLANS.length - 1];
    page.style.setProperty('--sp-cols', last.cols);
    page.style.setProperty('--sp-scale', last.scale);
    /* Fill sheet one right up to the page and let only sheet two run over.
       Evening the two out is the tempting move and it is the wrong one: two
       sheets at 101% spill a little onto a page each, which is four sheets
       with two of them nearly blank — the exact shape of the bug this whole
       routine exists to kill. */
    var packed = 1;
    for (var c = 1; c <= parts.secs.length; c++){
      fitDeal(parts, c);
      if (fitMeasure(page, parts).one <= FIT_BUDGET) packed = c;
    }
    best = { cols: last.cols, scale: last.scale, cut: packed, overflowed: true };
  }
  page.style.setProperty('--sp-cols', best.cols);
  page.style.setProperty('--sp-scale', best.scale);
  fitDeal(parts, best.cut);
  page.classList.remove('sp-fit-measure');
  return best;
}
/* Ctrl+P and the browser's own menu never touch our button, so the fit has to
   hang off the event as well — an unfitted scrapbook prints as one default
   column. Taking .sp-fit off again waits for afterprint: strip it any earlier
   and the layout can be gone before the printer has read it. */
window.addEventListener('beforeprint', function(){
  var page = document.querySelector('.scrap-overlay .scrap-page');
  if (!page || page.classList.contains('sp-fit')) return;
  page.classList.add('sp-fit');
  if (page.querySelector('.sp-sheet')) fitScrapbook(page);
});
window.addEventListener('afterprint', function(){
  var page = document.querySelector('.scrap-page.sp-fit');
  /* the fit layout is for paper only — left on, the overlay becomes a
     two-column letter page on a phone */
  if (page) page.classList.remove('sp-fit', 'sp-fit-measure');
});
function printButton(page, night){
  var pb = el('button','sp-print','🖨️ Save as PDF keepsake');
  pb.addEventListener('click', function(){
    /* Every keepsake wants the print typography; only the night scrapbook has
       sheets to solve. The yearbook and the collection share these .sp-*
       styles, so leaving .sp-fit off them printed their pages at screen size.
       They hand this function their cover, not the page, so climb to the
       sheet the styles are actually written against. */
    var sheet = page.closest ? (page.closest('.scrap-page') || page) : page;
    sheet.classList.add('sp-fit');
    if (night) fitScrapbook(sheet);
    window.print();
  });
  page.appendChild(pb);
  page.appendChild(el('div','sp-print-hint', night
    ? 'In the print dialog choose “Save as PDF” — two sheets, ready for the binder.'
    : 'In the print dialog choose “Save as PDF” — that file is the keepsake.'));
}

  var tnm = el('span','tname','Admit Four');
  tnm.style.background = picker.color;
  ticket.appendChild(adm); ticket.appendChild(tnm);
  side.appendChild(ticket);

  // the film's own vitals, under the ticket
  var factsBox = el('div','sp-facts');
  function paintFacts(f){
    while (factsBox.firstChild) factsBox.removeChild(factsBox.firstChild);
    if (!f) return;
    if (f.cert) factsBox.appendChild(el('span','sp-fact cert', f.cert));
    if (f.released) factsBox.appendChild(el('span','sp-fact', f.released.slice(0,4)));
    if (f.runtime) factsBox.appendChild(el('span','sp-fact', Math.floor(f.runtime/60) + 'h ' + (f.runtime%60) + 'm'));

    if (!f.imdb && f.tmdbScore) factsBox.appendChild(el('span','sp-fact star','★ ' + Number(f.tmdbScore).toFixed(1) + ' TMDB'));
  }

  side.appendChild(factsBox);

  head.appendChild(side);
  page.appendChild(head);

  /* Two sheets, each a self-contained pair of columns. That structure matters
     more than it looks: a column block that straddles a page break makes
     Chrome throw away most of a page, which is how a two-page keepsake
     printed as three. Nothing here ever crosses a boundary — sheet one ends,
     the page ends, sheet two begins.
     Running order is the night as it happened first, then what it left
     behind. The poll sits early because it's night-of data, not a keepsake.
     Anything unkeyed keeps its place at the end rather than disappearing.
     Where the cut actually falls is fitScrapbook's job, at print time, once
     there is something real to measure. */
  var built = el('div');
  buildNightKeepsake(built, night);

  var secs = [];
  while (built.firstChild) secs.push(built.removeChild(built.firstChild));
  secs.sort(function(a, b){
    var ia = ORDER.indexOf(a.getAttribute('data-k'));
    var ib = ORDER.indexOf(b.getAttribute('data-k'));
    return (ia < 0 ? ORDER.length : ia) - (ib < 0 ? ORDER.length : ib);
  });
  var sheetOne = el('div','sp-sheet one');
  var sheetTwo = el('div','sp-sheet two');
  secs.forEach(function(x){ sheetOne.appendChild(x); });
  page.appendChild(sheetOne);
  page.appendChild(sheetTwo);

  var waiting = MEMBERS.filter(function(m){ return !rxHasContent(reactionFor(night.id, m.id)); });
  if (waiting.length){
    page.appendChild(el('div','sp-waiting',
      'still waiting on ' + waiting.map(function(m){ return m.name; }).join(' & ') + ' … 🍿'));
  }
  printButton(page, night);
  var ac = el('button','sp-after','✨ After-credits pack for this movie');
  ac.addEventListener('click', function(){ overlay.remove(); openAfterCredits(night); });
  page.appendChild(ac);
  page.appendChild(el('div','sp-foot','The Ortiz Family · est. Fridays'));

  overlay.appendChild(page);
  document.body.appendChild(overlay);
}

/* ---------- THE COMPLETE COLLECTION (every night, all time) ----------
   Cover → table of contents → full stats → every movie in order. */
function collectionStats(list){
  var s = {
    nights: list.length, avgs: [], quotes: 0, memories: 0, scenes: 0,
    firstWatches: 0, laughs: 0, cries: 0, rewatch: 0,
    best: null, worst: null, mostQuoted: null, split: null,
    perMember: {}
  };
  MEMBERS.forEach(function(m){
    s.perMember[m.id] = { m:m, picks:0, given:[], received:[], fives:0, quotes:0, memories:0 };
  });
  list.forEach(function(n){
    var avg = familyAvg(n.id);
    if (avg !== null){
      s.avgs.push(avg);
      if (!s.best || avg > s.best.avg) s.best = { n:n, avg:avg };
      if (!s.worst || avg < s.worst.avg) s.worst = { n:n, avg:avg };
      if (s.perMember[n.pickedBy]) s.perMember[n.pickedBy].received.push(avg);
    }
    if (s.perMember[n.pickedBy]) s.perMember[n.pickedBy].picks++;

    var nightQuotes = 0;
    MEMBERS.forEach(function(m){
      var r = reactionFor(n.id, m.id);
      if (!r) return;
      var pm = s.perMember[m.id];
      if (r.stars){ pm.given.push(r.stars); if (r.stars === 5) pm.fives++; }
      var qn = rxQuotes(r).length, mn = rxMemories(r).length;
      pm.quotes += qn; pm.memories += mn;
      s.quotes += qn; s.memories += mn; nightQuotes += qn;
      s.scenes += rxScenes(r).length;
      if (r.poll){
        if (r.poll.laughed) s.laughs++;
        if (r.poll.cried) s.cries++;
        if (r.poll.rewatch) s.rewatch++;
        if (!r.poll.seenBefore) s.firstWatches++;
      }
    });
    if (nightQuotes && (!s.mostQuoted || nightQuotes > s.mostQuoted.count)){
      s.mostQuoted = { n:n, count:nightQuotes };
    }
    var rs = reactionsFor(n.id).filter(function(r){ return r.stars > 0; });
    if (rs.length >= 2){
      var mn2 = 6, mx = 0, mnW = null, mxW = null;
      rs.forEach(function(r){
        if (r.stars < mn2){ mn2 = r.stars; mnW = memberById(r.member).name; }
        if (r.stars > mx){ mx = r.stars; mxW = memberById(r.member).name; }
      });
      if (mx - mn2 > 0 && (!s.split || mx - mn2 > s.split.spread)){
        s.split = { n:n, spread:mx-mn2, lo:mn2, hi:mx, loWho:mnW, hiWho:mxW };
      }
    }
  });
  return s;
}

/* ---------- Claude: after-credits packs (browser-direct, canonical) ---------- */
function askClaude(prompt, opts){
  opts = opts || {};
  var key = Store.get('anthropic_key');
  if (!key) return Promise.reject(new Error('NO_KEY'));
  return fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'x-api-key': key,
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-access': 'true'
    },
    body: JSON.stringify({
      model: 'claude-sonnet-4-6',
      max_tokens: opts.maxTokens || 1400,
      system: opts.system || undefined,
      messages: [{ role:'user', content: prompt }]
    })
  }).then(function(res){
    if (res.status === 401) throw new Error('BAD_KEY');
    if (!res.ok) throw new Error('Claude API error: ' + res.status);
    return res.json();
  }).then(function(d){
    return d.content.filter(function(b){ return b.type === 'text'; })
      .map(function(b){ return b.text; }).join('\n');
  });
}

/* ---------- export / import ---------- */
/* When the family last exported a real backup file. Synced, so one phone
   doing it settles the nudge for everybody — and it's a timestamp, not a
   secret, so it's safe to share. */
function lastBackup(){
  var r = data.records['settings_backup'];
  return (r && !r.deleted && r.at) ? r : null;
}
function markBackup(){
  var me = whoAmI();
  data.records['settings_backup'] = {
    id:'settings_backup', type:'setting', key:'backup',
    at: Date.now(), by: me ? me.id : null, updatedAt: Date.now()
  };
  saveData();
}
function backupPayload(){
  return JSON.stringify(data, null, 2);
}
function backupFilename(ext){
  return 'family-movie-night-backup-' + AZ.today() + '.' + (ext || 'json');
}
/* Chrome vets a shared file twice and the two checks disagree. `canShare()`
   only looks at the MIME type, but `share()` also runs the *filename
   extension* past an allowlist — and `.json` isn't on it. That's the whole
   story behind the NotAllowedError on a Pixel: canShare({application/json})
   said yes, switching the type to text/plain didn't help, because the name
   still ended in .json. So the shared copy is a .txt, and only text/plain is
   offered. It's the same JSON inside; import reads it either way.
   Returns null when sharing files isn't possible at all — the button hides. */
var SHARE_BACKUP_EXT = 'txt';
function shareableBackupType(){
  if (!navigator.share || !navigator.canShare) return null;
  try {
    var probe = new File(['{}'], backupFilename(SHARE_BACKUP_EXT), { type:'text/plain' });
    if (navigator.canShare({ files: [probe] })) return 'text/plain';
  } catch(e){}
  return null;
}
function canShareBackup(){ return !!shareableBackupType(); }
/* `silent` is for the share fallback, which has its own message to deliver —
   otherwise this toast lands on top of it and the reason is lost. Callers
   wired straight to a click must wrap it, or the Event object arrives as
   `silent` and quietly suppresses the confirmation. */
function exportBackup(silent){
  try {
    var blob = new Blob([backupPayload()], { type:'application/json' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = backupFilename();
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function(){ URL.revokeObjectURL(a.href); }, 4000);
    markBackup();
    render();
    if (!silent) toast('Backup exported 📦');
    return true;
  } catch(e){
    if (!silent) toast('Export failed — try again');
    return false;
  }
}
/* Straight into Drive: hand the file to the OS and let the share sheet pick
   the app and the folder. The File is built before the call so the browser
   still counts this as the user's tap. */
function shareBackup(){
  var type = shareableBackupType();
  if (!type){ exportBackup(); return; }
  var file;
  try {
    file = new File([backupPayload()], backupFilename(SHARE_BACKUP_EXT), { type: type });
  } catch(e){ exportBackup(); return; }
  var opened = Date.now();
  navigator.share({ files:[file], title:'Family Movie Night backup' })
    .then(function(){
      markBackup();
      render();
      toast('Backup sent 📦');
    })
    .catch(function(err){
      var name = (err && err.name) || 'Error';
      /* A sheet somebody actually saw and dismissed comes back after a beat.
         An instant AbortError means it never opened. NotAllowedError is never
         a cancel — it's Android refusing — and swallowing it made this button
         look broken, so nothing silent survives here any more. */
      var instant = (Date.now() - opened) < 700;
      if (name === 'AbortError' && !instant) return;
      /* save first, then speak — exportBackup's own toast would otherwise
         land on top of this one and take the reason with it */
      exportBackup(true);
      toast('Share sheet didn’t open — saved to Downloads instead');
    });
}
function importBackup(file){
  var reader = new FileReader();
  reader.onload = function(){
    try {
      var incoming = JSON.parse(reader.result);
      if (!incoming || typeof incoming.records !== 'object') throw new Error('bad shape');
      var added = 0, updated = 0;
      for (var id in incoming.records){
        var rec = incoming.records[id];
        if (!rec || !rec.id) continue;
        var local = data.records[id];
        if (!local){ data.records[id] = rec; added++; }
        else if ((rec.updatedAt || 0) > (local.updatedAt || 0)){ data.records[id] = rec; updated++; }
      }
      saveData();
      render();
      toast('Imported: ' + added + ' new, ' + updated + ' updated ✓');
    } catch(e){
      toast('That file doesn’t look like a Movie Night backup');
    }
  };
  reader.readAsText(file);
}
