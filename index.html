<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Family Movie Night — Ortiz Family</title>
<meta name="theme-color" content="#211820">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Movie Night">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<meta name="description" content="Family Movie Night — the Ortiz family's Friday-night memory book: picks, reactions, quotes, memories, stats, trivia, and keepsakes.">
<style>
@import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@500..800&family=Nunito:ital,wght@0,400..900;1,400..700&family=Caveat:wght@500;700&family=Comic+Neue:ital,wght@0,700;1,700&family=Courier+Prime:ital,wght@0,400;0,700;1,400&display=swap');

:root{
  --room:#181017;
  --room-2:#2B202B;
  --card:#43334A;
  --card-2:#523F59;
  --line:#775C7E;
  --cream:#FFEFD9;
  --dim:#B39DA8;
  --amber:#FFB454;
  --coral:#F2705F;
  --sage:#A8C686;
  --sky2:#8FB8DE;
  --star:#FFC94A;
  --paper:#F5E9D3;
  --room-glow:#372638;
  --tabbar-bg:rgba(28,20,27,.96);
  --tape:rgba(255,239,217,.14);
  --tape-line:rgba(255,239,217,.10);
  /* never flips with theme — for text on permanently dark surfaces
     (keepsake overlay buttons sit on paper pages and stay dark) */
  --on-dark:#FFEFD9;
  /* hint/placeholder text and "empty" glyphs — tuned to stay legible
     against --card / --card-2 in each theme */
  --muted:#C1B1C7;
  --star-off:#8F7F96;
  --btn-bg:linear-gradient(135deg,#FFB454,#FF9350);
  --btn-ink:#3A2410;
}
:root[data-theme="light"]{
  --room:#FAF3E8;
  --room-2:#F3E9D8;
  --card:#FFFFFF;
  --card-2:#F3ECE0;
  --line:#E2D5C0;
  --cream:#2E2430;
  --dim:#7C6B58;
  --amber:#A8620F;
  --coral:#C24632;
  --sage:#4E7A44;
  --sky2:#33628F;
  --star:#B87A15;
  --room-glow:#FFF3DC;
  --tabbar-bg:rgba(255,253,248,.96);
  --tape:rgba(0,0,0,.05);
  --tape-line:rgba(0,0,0,.04);
  --muted:#766550;
  --star-off:#B5A48C;
  --btn-bg:linear-gradient(135deg,#9A5410,#A85A15);
  --btn-ink:#FFF6E8;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--room);
  background-image:radial-gradient(ellipse 85% 45% at 50% -8%, var(--room-glow) 0%, transparent 62%);
  color:var(--cream);
  font-family:'Nunito',system-ui,sans-serif;
  min-height:100vh;
  padding-top:env(safe-area-inset-top);
  padding-bottom:calc(104px + env(safe-area-inset-bottom));
  transition:background-color .2s, color .2s;
}
.wrap{max-width:720px;margin:0 auto;padding:0 20px}
button{cursor:pointer;font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}

/* string lights across the top */
.lights{
  height:26px;width:100%;overflow:hidden;
  background-image:
    linear-gradient(to bottom, transparent 6px, #5A4A5C 6px, #5A4A5C 7.5px, transparent 7.5px),
    radial-gradient(circle 5px at 14px 16px, #FFB454 0 5px, #FFB45400 6.5px),
    radial-gradient(circle 5px at 50px 13px, #F2705F 0 5px, #F2705F00 6.5px),
    radial-gradient(circle 5px at 86px 17px, #A8C686 0 5px, #A8C68600 6.5px),
    radial-gradient(circle 5px at 122px 12px, #8FB8DE 0 5px, #8FB8DE00 6.5px),
    radial-gradient(circle 8px at 14px 16px, #FFB45433 0 8px, transparent 9px),
    radial-gradient(circle 8px at 50px 13px, #F2705F33 0 8px, transparent 9px),
    radial-gradient(circle 8px at 86px 17px, #A8C68633 0 8px, transparent 9px),
    radial-gradient(circle 8px at 122px 12px, #8FB8DE33 0 8px, transparent 9px);
  background-size:144px 26px;
  background-repeat:repeat-x;
}

/* header */
header{padding-top:14px;text-align:center}
header h1{
  font-family:'Baloo 2',sans-serif;font-weight:800;
  font-size:clamp(26px,7vw,42px);color:var(--cream);
  text-shadow:0 0 24px rgba(255,180,84,.35);letter-spacing:.5px;
}
header h1 .pop{color:var(--amber)}
header .now{font-size:11.5px;letter-spacing:3px;color:var(--dim);text-transform:uppercase;margin-top:4px;font-weight:800}
header .doodles{font-size:13px;opacity:.55;margin-top:8px;letter-spacing:14px;-webkit-user-select:none;user-select:none}

/* projector screen — UP NEXT */
.screenbox{margin-top:24px;text-align:center}
.screen{
  position:relative;overflow:hidden;
  background:linear-gradient(180deg,#FFFDF7 0%,#F3EADA 78%,#E9DEC8 100%);
  border:5px solid #17101A;border-radius:10px;
  box-shadow:0 0 0 2px var(--line), 0 16px 36px rgba(0,0,0,.45),
    inset 0 -14px 30px rgba(58,46,40,.08), inset 0 6px 24px rgba(255,255,255,.6);
  padding:22px 16px 24px;color:#4A3A32;
}
/* in light mode the room is already cream, so the screen needs its own
   "projector is on" cue: brighter white + a warm halo spilling onto the wall */
:root[data-theme="light"] .screen{
  background:linear-gradient(180deg,#FFFFFF 0%,#FFFCF4 70%,#FBF4E4 100%);
  box-shadow:0 0 0 2px #C9B79B, 0 0 34px 6px rgba(255,203,120,.45),
    0 16px 30px rgba(90,70,45,.28),
    inset 0 -14px 30px rgba(58,46,40,.05), inset 0 6px 24px rgba(255,255,255,.9);
}
.screen-inner{position:relative;z-index:1}
.screen .label{font-size:11px;letter-spacing:4px;color:var(--coral);text-transform:uppercase;font-weight:900}
.screen .pickname{
  font-family:'Baloo 2',sans-serif;font-weight:800;
  font-size:clamp(24px,6.5vw,34px);margin-top:6px;line-height:1.15;
}
.screen .showdate{font-size:13px;color:#8A7563;margin-top:6px;font-weight:800}
.screen .rotation{display:flex;justify-content:center;align-items:center;gap:5px;margin-top:16px;flex-wrap:wrap}
.rot-chip{
  display:flex;align-items:center;gap:6px;background:#FFF9EE;border:2px solid #E2D4BC;
  border-radius:99px;padding:6px 13px 6px 8px;font-size:13px;font-weight:800;color:#8A7563;
  min-height:38px;
}
.rot-chip .dot{
  width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:900;color:#2A1B14;
}
.rot-chip.current{color:#fff;border-color:transparent}
.rot-chip.current .dot{background:rgba(255,255,255,.35) !important;color:#fff}
.rot-arrow{color:#CBB99C;font-size:13px;font-weight:900}
.screen-stand{
  width:64px;height:13px;margin:0 auto;background:#17101A;border-radius:0 0 8px 8px;
  box-shadow:0 4px 10px rgba(0,0,0,.4);
}
.burn{
  position:absolute;width:120px;height:120px;border-radius:50%;pointer-events:none;z-index:2;
  background:radial-gradient(circle, rgba(255,150,50,.75) 0%, rgba(196,84,26,.45) 38%, rgba(120,40,10,.18) 62%, transparent 78%);
  filter:blur(5px);opacity:0;transform:scale(.2);
}
.burn.b1{top:-20px;right:6%}
.burn.b2{bottom:-10px;left:10%;width:90px;height:90px}
.dust{
  position:absolute;inset:0;pointer-events:none;z-index:1;opacity:.35;
  background-image:
    radial-gradient(circle 1px at 22% 30%, rgba(74,58,50,.5) 0 1px, transparent 2px),
    radial-gradient(circle 1px at 71% 62%, rgba(74,58,50,.4) 0 1px, transparent 2px),
    radial-gradient(circle 1.5px at 48% 82%, rgba(74,58,50,.35) 0 1.5px, transparent 2.5px);
}
/* projector animation state is JS-controlled (Settings > Appearance),
   defaulting to the OS's prefers-reduced-motion at boot — see applyMotion() */
html.motion-on .screen-inner{animation:flicker 6.5s infinite, gateweave 1.7s steps(3) infinite}
html.motion-on .screen .pickname{animation:projjig .55s steps(2) infinite}
html.motion-on .burn.b1{animation:burnpop 11s 2.2s infinite}
html.motion-on .burn.b2{animation:burnpop 14s 7.6s infinite}
html.motion-on .dust{animation:dustdrift 5s steps(3) infinite}
@keyframes flicker{
  0%,72%,100%{opacity:1}
  73%{opacity:.72} 74%{opacity:1} 75.5%{opacity:.84} 76%{opacity:1}
  88%{opacity:.78} 89%{opacity:1} 90.5%{opacity:.88} 91%{opacity:1}
  96%{opacity:.9} 97%{opacity:1}
}
/* projector gate weave — the whole frame drifts, the title shakes harder */
@keyframes projjig{
  0%{transform:translate(0,0)}
  20%{transform:translate(1.2px,-.9px)}
  40%{transform:translate(-1px,.7px)}
  60%{transform:translate(.9px,1.1px)}
  80%{transform:translate(-1.3px,-.5px)}
  100%{transform:translate(0,0)}
}
@keyframes gateweave{
  0%{transform:translate(0,0)}
  33%{transform:translate(-.6px,.5px)}
  66%{transform:translate(.5px,-.4px)}
  100%{transform:translate(0,0)}
}
@keyframes burnpop{
  0%,100%{opacity:0;transform:scale(.2)}
  2%{opacity:.85;transform:scale(.7)}
  5%{opacity:.55;transform:scale(1.25)}
  8%{opacity:0;transform:scale(1.6)}
}
@keyframes dustdrift{
  0%{background-position:0 0, 0 0, 0 0}
  50%{background-position:14px 9px, -11px 6px, 7px -12px}
  100%{background-position:-9px 16px, 8px -10px, -13px 5px}
}

/* friday lineup (calendar) */
.lineup{
  margin-top:26px;background:var(--card);border:2px solid var(--line);border-radius:22px;
  padding:16px 16px 8px;box-shadow:0 10px 30px rgba(0,0,0,.3);
}
.lineup .lu-head{
  font-size:11px;letter-spacing:3.5px;color:var(--amber);text-transform:uppercase;font-weight:900;
  margin:6px 0 4px;
}
.lineup .lu-head.second{margin-top:16px}
.lu-row{
  display:flex;align-items:center;gap:10px;min-height:46px;
  border-bottom:2px dashed #453648;padding:6px 2px;
}
.lu-row.last{border-bottom:none}
.lu-date{width:72px;flex-shrink:0}
.lu-date .d1{font-weight:900;font-size:13px}
.lu-date .d2{font-size:10px;color:var(--dim);font-weight:800;letter-spacing:.5px;text-transform:uppercase}
.lu-pick{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:900}
.lu-pick .dot{
  width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:10px;font-weight:900;color:#2A1B14;flex-shrink:0;
}
.lu-title{
  flex:1;min-width:0;font-size:13px;font-weight:700;color:var(--cream);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.lu-title.skip{color:var(--muted);font-style:italic;font-weight:600}
.lu-fill{flex:1}
.pdots{display:flex;gap:4px;flex-shrink:0}
.pdot{
  width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:9px;font-weight:900;color:#2A1B14;border:2px solid var(--line);background:transparent;
}
.pdot.off{color:var(--muted)}

/* quote wall — comic speech bubble */
.quotewall{margin-top:30px;cursor:pointer;-webkit-user-select:none;user-select:none;display:flex;flex-direction:column;align-items:center}
.cq{
  position:relative;background:#FFFDF6;color:#231A14;border:3px solid #17101A;
  border-radius:22px;max-width:480px;width:100%;padding:16px 18px;
  font-family:'Comic Neue',cursive;font-weight:700;font-size:17.5px;line-height:1.35;
  box-shadow:0 8px 22px rgba(0,0,0,.4);transform:rotate(-1deg);
}
.cq::before{
  content:'';position:absolute;bottom:-17px;left:40px;width:0;height:0;
  border-style:solid;border-width:17px 15px 0 0;
  border-color:#17101A transparent transparent transparent;
}
.cq::after{
  content:'';position:absolute;bottom:-10px;left:44px;width:0;height:0;
  border-style:solid;border-width:12px 10px 0 0;
  border-color:#FFFDF6 transparent transparent transparent;
}
.cq-wrap{max-width:480px;width:100%;display:flex;flex-direction:column}
.quotewall .attr{
  font-size:11px;letter-spacing:2px;color:var(--dim);text-transform:uppercase;
  margin:22px 0 0 34px;font-weight:900;
}
.quotewall .hint{font-size:9px;letter-spacing:2px;color:#5E4C60;text-transform:uppercase;margin:6px 0 0 34px;font-weight:800}

/* log button */
.log-btn{
  display:block;width:100%;margin-top:26px;border:none;border-radius:99px;
  background:var(--btn-bg);
  padding:17px;font-family:'Baloo 2',sans-serif;font-weight:800;font-size:18px;
  color:var(--btn-ink);min-height:56px;box-shadow:0 8px 24px rgba(255,180,84,.3);
  transition:transform .1s;
}
.log-btn:active{transform:scale(.98)}

/* filmstrip divider */
.film-divider{
  height:22px;margin:32px auto 0;max-width:300px;border-radius:5px;background-color:#17101A;
  background-image:
    repeating-linear-gradient(90deg, transparent 0 5px, rgba(255,239,217,.55) 5px 11px, transparent 11px 16px),
    repeating-linear-gradient(90deg, transparent 0 5px, rgba(255,239,217,.55) 5px 11px, transparent 11px 16px);
  background-size:16px 4px,16px 4px;
  background-position:2px 4px, 2px 14px;
  background-repeat:repeat-x,repeat-x;
  box-shadow:0 4px 12px rgba(0,0,0,.3);
  transform:rotate(-.8deg);
}

.section-label{
  font-family:'Baloo 2',sans-serif;font-weight:800;font-size:16px;letter-spacing:1px;
  color:var(--cream);margin:14px 0 2px;text-align:center;
}
.section-sub{font-size:11px;color:var(--dim);text-align:center;margin-bottom:12px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase}

/* memory-book night cards */
.night{
  margin-top:22px;position:relative;background:var(--card);
  border:2px solid var(--line);border-radius:20px;padding:18px 14px 12px;
  box-shadow:0 8px 24px rgba(0,0,0,.25);
}
.night::before,.night::after{
  content:'';position:absolute;width:66px;height:20px;border-radius:2px;
  background:var(--tape);border:1px solid var(--tape-line);
  pointer-events:none;
}
.night::before{top:-9px;left:16px;transform:rotate(-5deg)}
.night::after{bottom:-9px;right:16px;transform:rotate(4deg)}
.night .head{display:flex;gap:14px}
.night .poster{
  width:64px;height:92px;border-radius:3px;flex-shrink:0;
  border:4px solid #FFF6E6;border-bottom-width:14px;
  box-shadow:0 5px 14px rgba(0,0,0,.4);
  transform:rotate(-2.2deg);overflow:hidden;display:flex;align-items:flex-end;padding:4px;
  font-size:8.5px;font-weight:900;text-transform:uppercase;letter-spacing:.4px;line-height:1.15;
  background:var(--card-2);color:#fff;
}
.night .poster img{width:100%;height:100%;object-fit:cover}
.night .head-txt{flex:1;min-width:0;padding-right:26px}
.night h3{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:19px;line-height:1.15;color:var(--cream)}
.night .meta{font-size:12px;color:var(--dim);margin-top:3px;font-weight:800;letter-spacing:.5px}
.night .avgbadge{font-size:12px;font-weight:900;color:var(--star);margin-left:8px}
.ticket{
  display:inline-flex;align-items:stretch;margin-top:9px;transform:rotate(-1.4deg);
  border-radius:6px;overflow:hidden;font-size:10px;font-weight:900;letter-spacing:1px;
  text-transform:uppercase;color:#3A2410;box-shadow:0 3px 8px rgba(0,0,0,.3);
}
.ticket .admit{padding:5px 8px;display:flex;align-items:center;border-right:2px dashed rgba(58,36,16,.4)}
.ticket .tname{padding:5px 10px;display:flex;align-items:center}
.sampletag{
  font-size:9px;letter-spacing:2px;color:var(--muted);text-transform:uppercase;font-weight:900;
  border:2px dashed var(--line);border-radius:8px;padding:2px 7px;margin-left:8px;vertical-align:2px;
}
.night .del{
  background:none;border:none;color:var(--muted);font-size:16px;padding:8px 10px;
  position:absolute;top:4px;right:4px;min-width:36px;min-height:36px;z-index:2;
}
.night .del:active{color:var(--coral)}
.rx-rows{margin-top:12px;display:flex;flex-direction:column;gap:7px}
.rx-row{
  display:flex;align-items:center;gap:9px;width:100%;text-align:left;
  background:var(--card-2);border:2px solid transparent;border-radius:14px;
  padding:9px 12px;min-height:46px;
}
.rx-row:active,.rx-row:focus-visible{border-color:var(--line)}
.rx-row .who{font-size:13px;font-weight:900;width:64px;flex-shrink:0}
/* half-star primitive: outline glyph with a width-clipped filled glyph on top */
.st{position:relative;display:inline-block;letter-spacing:0;margin-right:1.5px}
.st > .fill{
  position:absolute;left:0;top:0;overflow:hidden;white-space:nowrap;
  width:0;pointer-events:none;
}
.rx-row .stars{font-size:14px;color:var(--star-off);flex-shrink:0;letter-spacing:0}
.rx-row .stars .fill{color:var(--star)}
.rx-row .snippet{
  flex:1;font-size:12.5px;color:var(--dim);font-style:italic;font-weight:600;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;
}
.rx-row .snippet.empty{color:var(--muted)}
.rx-row .chev{color:var(--muted);font-size:15px;font-weight:900}
.card-actions{display:flex;gap:8px;margin-top:10px}
.scrapbtn{
  display:flex;align-items:center;justify-content:center;gap:6px;flex:1;min-width:0;
  min-height:46px;border-radius:14px;border:2px dashed var(--line);
  background:none;color:var(--amber);font-weight:800;font-size:12.5px;letter-spacing:.3px;
  padding:6px 8px;
}
.scrapbtn:active{border-color:var(--amber)}
.scrapbtn .done{color:var(--sage)}
.scrapbtn.ai{color:var(--sky2)}
.scrapbtn.ai:active{border-color:var(--sky2)}

/* after-credits (Claude) overlay */
.ai-overlay{
  position:fixed;inset:0;z-index:1100;overflow-y:auto;-webkit-overflow-scrolling:touch;
  background:var(--room);
  background-image:radial-gradient(ellipse 85% 45% at 50% -8%, var(--room-glow) 0%, transparent 62%);
  color:var(--cream);
  padding:calc(16px + env(safe-area-inset-top)) 0 calc(40px + env(safe-area-inset-bottom));
}
.ai-page{max-width:560px;margin:0 auto;padding:44px 20px 0}
.ai-kicker{text-align:center;font-size:10px;letter-spacing:4px;text-transform:uppercase;font-weight:900;color:var(--sky2)}
.ai-title{
  font-family:'Baloo 2',sans-serif;font-weight:800;font-size:clamp(22px,6vw,30px);
  text-align:center;line-height:1.15;margin-top:6px;
}
.ai-sub{text-align:center;font-size:12px;color:var(--dim);font-weight:800;margin-top:4px;letter-spacing:1px}
.ai-sec-title{
  font-size:11px;letter-spacing:3.5px;color:var(--amber);text-transform:uppercase;font-weight:900;
  margin:26px 0 10px;
}
.ai-fact{
  background:var(--card);border:2px solid var(--line);border-radius:16px;
  padding:13px 15px;margin-top:9px;font-size:14px;font-weight:600;line-height:1.55;
}
.ai-fact b{color:var(--sky2);font-weight:900}
.ai-talk{
  background:var(--card-2);border-left:5px solid var(--sage);border-radius:12px;
  padding:12px 15px;margin-top:9px;font-size:14.5px;font-weight:700;line-height:1.5;font-style:italic;
}
.ai-center{text-align:center;margin-top:28px;color:var(--dim);font-weight:700;font-size:14px;line-height:1.7}
.ai-center .big{font-size:38px}
.ai-gen{
  display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
  margin-top:18px;min-height:54px;border-radius:99px;border:none;
  background:linear-gradient(135deg,#8FB8DE,#6FA0D8);color:#0F1E30;
  font-family:'Baloo 2',sans-serif;font-weight:800;font-size:16px;
}
.ai-gen:disabled{opacity:.5}
.ai-regen{
  display:block;margin:24px auto 0;background:none;border:2px dashed var(--line);
  color:var(--dim);border-radius:12px;padding:10px 18px;font-size:11px;letter-spacing:2px;
  text-transform:uppercase;min-height:42px;font-weight:800;
}
.ai-disclaimer{
  text-align:center;font-size:10px;color:var(--muted);font-weight:800;letter-spacing:1px;
  margin-top:14px;text-transform:uppercase;
}
.ai-loading{text-align:center;margin-top:40px}
.ai-loading .reel{font-size:44px;display:inline-block;animation:reelspin 1.6s linear infinite}
.ai-loading .msg{margin-top:12px;color:var(--dim);font-weight:800;font-size:14px;letter-spacing:1px}
@keyframes reelspin{to{transform:rotate(360deg)}}

.empty-state{
  margin-top:20px;text-align:center;color:var(--dim);font-size:15px;line-height:1.7;font-weight:700;
  background:var(--card);border:2px dashed var(--line);border-radius:20px;padding:32px 20px;
}
.empty-state .big{font-size:34px}

/* ============ KEEPSAKE OVERLAYS (scrapbook + yearbook) ============ */
.scrap-overlay{
  position:fixed;inset:0;z-index:1100;overflow-y:auto;-webkit-overflow-scrolling:touch;
  background:var(--paper);
  background-image:
    radial-gradient(circle 1px at 18% 12%, rgba(74,53,32,.12) 0 1px, transparent 2px),
    radial-gradient(circle 1px at 64% 38%, rgba(74,53,32,.10) 0 1px, transparent 2px),
    radial-gradient(circle 1.5px at 41% 72%, rgba(74,53,32,.08) 0 1.5px, transparent 2.5px),
    linear-gradient(180deg,#F8EEDC,#F0E2C8);
  color:#4A3520;
  padding:calc(16px + env(safe-area-inset-top)) 0 calc(40px + env(safe-area-inset-bottom));
}
.scrap-page{max-width:560px;margin:0 auto;padding:44px 22px 0}
.scrap-close{
  position:fixed;top:calc(12px + env(safe-area-inset-top));right:14px;z-index:1110;
  width:44px;height:44px;border-radius:50%;border:none;background:#3A2A20;color:var(--on-dark);
  font-size:20px;font-weight:900;box-shadow:0 4px 14px rgba(0,0,0,.35);
  border:2px solid rgba(255,239,217,.35);
}
.sp-print{
  display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
  margin:28px 0 6px;min-height:52px;border-radius:99px;border:none;
  background:#3A2A20;color:var(--on-dark);font-family:'Baloo 2',sans-serif;
  font-weight:800;font-size:16px;box-shadow:0 6px 18px rgba(74,53,32,.35);
}
.sp-print-hint{text-align:center;font-size:11px;color:#A3814F;font-weight:800;margin-bottom:6px}
.sp-kicker{
  text-align:center;font-size:10px;letter-spacing:4px;text-transform:uppercase;font-weight:900;
  color:#A3814F;margin-top:8px;
}
.sp-title{
  font-family:'Baloo 2',sans-serif;font-weight:800;font-size:clamp(24px,6.5vw,34px);
  text-align:center;line-height:1.1;margin-top:6px;color:#3A2A20;
}
.sp-date{text-align:center;font-family:'Caveat',cursive;font-size:20px;color:#8A6A44;margin-top:4px}
.sp-head{display:flex;justify-content:center;align-items:flex-start;gap:18px;margin-top:18px;flex-wrap:wrap}
.sp-polaroid{
  background:#FFFDF6;padding:8px 8px 30px;box-shadow:0 10px 24px rgba(74,53,32,.35);
  transform:rotate(-2.5deg);position:relative;width:132px;
}
.sp-polaroid::before{
  content:'';position:absolute;top:-11px;left:50%;transform:translateX(-50%) rotate(-2deg);
  width:70px;height:20px;background:rgba(255,235,180,.65);border:1px solid rgba(74,53,32,.1);
}
.sp-polaroid .ph{
  width:100%;aspect-ratio:2/3;overflow:hidden;display:flex;align-items:flex-end;padding:5px;
  font-size:9px;font-weight:900;color:#fff;text-transform:uppercase;line-height:1.2;
}
.sp-polaroid .ph img{width:100%;height:100%;object-fit:cover}
.sp-polaroid .cap{font-family:'Caveat',cursive;font-size:17px;text-align:center;margin-top:7px;color:#5E4326}
.sp-headside{display:flex;flex-direction:column;gap:12px;align-items:center;padding-top:14px}
.sp-avg{
  font-size:22px;color:#D8C7A8;letter-spacing:0;text-shadow:0 1px 0 rgba(74,53,32,.2);
  transform:rotate(1.5deg);font-weight:900;
}
.sp-avg .fill{color:#E2A93B}
.sp-avg small{display:block;font-family:'Caveat',cursive;font-size:16px;color:#8A6A44;letter-spacing:0;text-align:center}

/* by-question sections */
.sp-section{margin-top:28px;page-break-inside:avoid}
.sp-sec-title{
  font-family:'Baloo 2',sans-serif;font-weight:800;font-size:13px;letter-spacing:2.5px;
  text-transform:uppercase;color:#A3814F;display:flex;align-items:center;gap:10px;
}
.sp-sec-title::after{content:'';flex:1;height:2px;background:linear-gradient(90deg,#D9C6A4,transparent);border-radius:2px}
.sp-tag{
  display:inline-block;font-weight:900;font-size:11px;color:#fff;border-radius:6px;
  padding:2px 9px;margin-right:8px;vertical-align:1px;letter-spacing:.5px;
}
.sp-why{
  margin-top:12px;background:#FFFDF6;border-radius:3px;padding:14px 16px;
  box-shadow:0 5px 14px rgba(74,53,32,.22);transform:rotate(-.5deg);
}
.sp-why .why-text{font-family:'Caveat',cursive;font-weight:700;font-size:22px;line-height:1.3;margin-top:6px}
.sp-rates{display:flex;flex-wrap:wrap;gap:9px;margin-top:12px}
.sp-rate{
  background:#FFFDF6;border-radius:8px;padding:8px 11px;box-shadow:0 4px 10px rgba(74,53,32,.18);
  font-weight:900;font-size:12px;display:flex;align-items:center;
}
.sp-rate .stars{color:#D8C7A8;letter-spacing:0;font-size:13px}
.sp-rate .stars .fill{color:#E2A93B}
.sp-note{
  margin-top:12px;background:#FFFDF6;border-radius:3px;padding:12px 15px;
  box-shadow:0 5px 14px rgba(74,53,32,.22);font-size:14.5px;font-weight:600;line-height:1.55;
  color:#4A3520;font-style:italic;
}
.sp-char-line{margin-top:10px;font-family:'Caveat',cursive;font-size:21px;color:#4A3520;line-height:1.3}
/* comic speech-bubble quotes on the scrapbook page */
.sp-comic-wrap{margin-top:16px}
.sp-comic{
  position:relative;background:#FFFDF6;color:#231A14;border:2.5px solid #3A2A20;
  border-radius:20px;padding:13px 16px;
  font-family:'Comic Neue',cursive;font-weight:700;font-size:16.5px;line-height:1.35;
  box-shadow:0 5px 14px rgba(74,53,32,.25);
}
.sp-comic::before{
  content:'';position:absolute;bottom:-15px;left:34px;width:0;height:0;
  border-style:solid;border-width:15px 13px 0 0;
  border-color:#3A2A20 transparent transparent transparent;
}
.sp-comic::after{
  content:'';position:absolute;bottom:-9px;left:37.5px;width:0;height:0;
  border-style:solid;border-width:11px 9px 0 0;
  border-color:#FFFDF6 transparent transparent transparent;
}
.sp-comic-wrap.flip .sp-comic::before{left:auto;right:34px;border-width:15px 0 0 13px;border-color:#3A2A20 transparent transparent transparent}
.sp-comic-wrap.flip .sp-comic::after{left:auto;right:37.5px;border-width:11px 0 0 9px;border-color:#FFFDF6 transparent transparent transparent}
.sp-comic-wrap .sp-tags{margin:18px 0 0 30px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.sp-comic-wrap.flip .sp-tags{margin-left:30px;margin-right:30px;justify-content:flex-end}
.sp-both{font-family:'Caveat',cursive;font-size:16px;color:#8A6A44}

/* favorite scene — screenplay page */
.sp-scene{
  margin-top:12px;background:#FFFEF9;border-radius:2px;padding:15px 17px 13px 26px;
  box-shadow:0 5px 14px rgba(74,53,32,.22);
  font-family:'Courier Prime',monospace;color:#232323;font-size:13px;line-height:1.6;
  position:relative;
}
.sp-scene::before{
  content:'';position:absolute;left:8px;top:14px;bottom:14px;width:6px;
  background-image:
    radial-gradient(circle 3px at 3px 8px, #E4D9C2 0 3px, transparent 3.5px),
    radial-gradient(circle 3px at 3px 50%, #E4D9C2 0 3px, transparent 3.5px),
    radial-gradient(circle 3px at 3px calc(100% - 8px), #E4D9C2 0 3px, transparent 3.5px);
  background-repeat:no-repeat;
}
.sp-scene .slug{font-weight:700;letter-spacing:.5px;text-transform:uppercase;font-size:12.5px;margin-top:10px}
.sp-scene .action{margin-top:8px;white-space:pre-wrap}
.sp-scene .cut{text-align:right;font-weight:700;font-size:12px;text-transform:uppercase}
.sp-strip{
  margin-top:12px;border-radius:3px;padding:11px 14px;position:relative;
  box-shadow:0 5px 14px rgba(74,53,32,.18);font-size:13.5px;font-weight:700;line-height:1.5;
  color:#4A3520;
}
.sp-strip::before{
  content:'';position:absolute;top:-8px;left:14px;width:52px;height:15px;
  background:rgba(255,255,255,.5);border:1px solid rgba(74,53,32,.08);border-radius:2px;
  transform:rotate(-3deg);
}
.sp-poll-row{display:flex;align-items:center;gap:10px;margin-top:12px;font-weight:800;font-size:14px}
.sp-poll-row .pq{flex:1}
.sp-poll-row .tally{font-size:12px;color:#8A6A44;font-weight:900;margin-right:2px}
.sp-pdots{display:flex;gap:4px}
.sp-pdot{
  width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:9px;font-weight:900;color:#fff;border:2px solid #D9C6A4;background:transparent;color:#B49670;
}
.sp-waiting{margin-top:30px;text-align:center;font-family:'Caveat',cursive;font-size:20px;color:#8A6A44}
.sp-foot{
  margin-top:30px;text-align:center;font-size:9px;letter-spacing:3px;text-transform:uppercase;
  color:#B49670;font-weight:900;padding-bottom:10px;
}

/* yearbook extras */
.yb-cover{text-align:center;padding:26px 0 8px;page-break-after:always}
.yb-eyebrow{font-size:11px;letter-spacing:5px;text-transform:uppercase;font-weight:900;color:#A3814F}
.yb-year{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:76px;line-height:1;color:#3A2A20;margin-top:10px}
.yb-sub{font-family:'Caveat',cursive;font-size:26px;color:#8A6A44;margin-top:6px}
.yb-stats{display:flex;justify-content:center;gap:14px;margin-top:24px;flex-wrap:wrap}
.yb-stat{background:#FFFDF6;border-radius:10px;padding:12px 18px;box-shadow:0 5px 14px rgba(74,53,32,.2)}
.yb-stat .n{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:24px;color:#3A2A20}
.yb-stat .l{font-size:9px;letter-spacing:2px;text-transform:uppercase;font-weight:900;color:#A3814F;margin-top:2px}
.yb-best{margin-top:22px;font-weight:800;font-size:14px;color:#4A3520}
.yb-best b{color:#3A2A20}
.yb-night{margin-top:40px;border-top:3px dashed #D9C6A4;padding-top:24px;page-break-inside:avoid}
.yb-no{
  display:inline-block;font-family:'Baloo 2',sans-serif;font-weight:800;font-size:11px;
  letter-spacing:2px;text-transform:uppercase;color:#fff;background:#3A2A20;
  border-radius:99px;padding:3px 12px;margin-bottom:6px;
}

/* ===== anthology: cover, contents, complete stats ===== */
.ks-page{page-break-after:always}
.ks-cover{text-align:center;padding:20px 0 8px}
.ks-crest{font-size:52px;line-height:1;margin-bottom:6px}
.ks-cover .yb-year{font-size:56px;letter-spacing:-1px}
/* solid, not a gradient — print pipelines rasterize gradients inconsistently */
.ks-rule{height:2px;background:#C9A227;margin:16px auto;max-width:210px;border-radius:2px;opacity:.85}
.ks-cast{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:18px}
.ks-cast .who{
  display:flex;align-items:center;gap:7px;background:#FFFDF6;border:1px solid #E4D9C2;
  border-radius:99px;padding:6px 14px 6px 7px;font-weight:800;font-size:13px;color:#4A3520;
}
.ks-cast .dot{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;font-size:11px;font-weight:900;color:#fff}

.ks-h2{
  font-family:'Baloo 2',sans-serif;font-weight:800;font-size:22px;color:#3A2A20;
  text-align:center;margin-top:6px;
}
.ks-sub{text-align:center;font-family:'Caveat',cursive;font-size:19px;color:#8A6A44;margin-top:2px}

.toc{margin-top:22px}
.toc-row{
  display:flex;align-items:baseline;gap:8px;padding:9px 2px;
  border-bottom:1px dotted #CBB99C;page-break-inside:avoid;
}
.toc-no{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:13px;color:#A3814F;width:34px;flex-shrink:0}
.toc-title{font-weight:800;font-size:14px;color:#3A2A20}
.toc-dots{flex:1;border-bottom:1px dotted #CBB99C;transform:translateY(-3px)}
.toc-meta{font-size:12px;color:#8A6A44;font-weight:700;white-space:nowrap}
.toc-score{font-weight:900;color:#B8860B;margin-left:6px}

.ks-stat-band{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:18px}
.ks-tile{
  background:#FFFDF6;border:1px solid #E4D9C2;border-radius:10px;padding:11px 16px;
  text-align:center;box-shadow:0 4px 10px rgba(74,53,32,.14);min-width:104px;
}
.ks-tile .n{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:22px;color:#3A2A20}
.ks-tile .l{font-size:9px;letter-spacing:1.5px;text-transform:uppercase;font-weight:900;color:#A3814F;margin-top:2px}

.ks-table{width:100%;border-collapse:collapse;margin-top:14px;font-size:12.5px}
.ks-table th{
  text-align:left;font-size:9px;letter-spacing:1.5px;text-transform:uppercase;
  color:#A3814F;font-weight:900;padding:6px 6px;border-bottom:2px solid #D9C6A4;
}
.ks-table th.num,.ks-table td.num{text-align:right}
.ks-table td{padding:8px 6px;border-bottom:1px solid #E4D9C2;color:#4A3520;font-weight:700}
.ks-table td.who{font-weight:900}
.ks-awards{margin-top:16px}
.ks-award{
  display:flex;gap:10px;align-items:flex-start;background:#FFFDF6;border-left:5px solid #C9A227;
  border-radius:8px;padding:10px 13px;margin-top:9px;box-shadow:0 3px 9px rgba(74,53,32,.12);
  page-break-inside:avoid;
}
.ks-award .medal{font-size:19px;line-height:1.2}
.ks-award .body{flex:1;min-width:0}
.ks-award .t{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;font-weight:900;color:#A3814F}
.ks-award .v{font-weight:900;font-size:14px;color:#3A2A20;margin-top:2px}
.ks-award .d{font-size:12px;color:#8A6A44;font-weight:700;margin-top:2px;line-height:1.45}

/* ============ STATS ============ */
.stat-tiles{display:flex;gap:12px;margin-top:22px}
.stat-tile{
  flex:1;background:var(--card);border:2px solid var(--line);border-radius:18px;
  padding:16px 12px;text-align:center;
}
.stat-tile .num{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:30px;color:var(--amber)}
.stat-tile .lbl{font-size:10px;letter-spacing:2px;color:var(--dim);text-transform:uppercase;font-weight:900;margin-top:2px}
.stat-member{
  margin-top:12px;background:var(--card);border:2px solid var(--line);border-left-width:7px;
  border-radius:16px;padding:13px 14px;
}
.stat-member .sm-head{display:flex;align-items:center;gap:9px}
.stat-member .sm-dot{
  width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:900;color:#2A1B14;
}
.stat-member .sm-name{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:17px}
.stat-member .sm-badge{
  margin-left:auto;font-size:10px;font-weight:900;letter-spacing:1px;text-transform:uppercase;
  color:var(--amber);border:2px dashed var(--line);border-radius:99px;padding:3px 9px;
}
.sm-grid{display:flex;flex-wrap:wrap;gap:6px 0;margin-top:10px}
.sm-cell{width:50%;font-size:12px;color:var(--dim);font-weight:700}
.sm-cell b{color:var(--cream);font-weight:900}
.sm-picks{margin-top:9px;font-size:12px;color:var(--dim);font-weight:700;line-height:1.6}
.sm-picks b{color:var(--cream)}
.split-card{
  margin-top:16px;background:var(--card);border:2px solid var(--line);border-radius:18px;
  padding:15px 16px;
}
.split-card .sc-title{font-size:11px;letter-spacing:3px;color:var(--amber);text-transform:uppercase;font-weight:900}
.split-card .sc-movie{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:17px;margin-top:6px}
.split-card .sc-detail{font-size:13px;color:var(--dim);font-weight:700;margin-top:4px;line-height:1.5}

/* ============ TRIVIA ============ */
.tq-card{
  margin-top:22px;background:var(--card);border:2px solid var(--line);border-radius:22px;
  padding:20px 18px;box-shadow:0 10px 30px rgba(0,0,0,.3);
}
.tq-progress{display:flex;justify-content:space-between;font-size:11px;letter-spacing:2px;color:var(--dim);text-transform:uppercase;font-weight:900}
.tq-progress .score{color:var(--amber)}
.tq-q{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:19px;line-height:1.35;margin-top:12px}
.tq-opts{display:flex;flex-direction:column;gap:9px;margin-top:16px}
.tq-opt{
  width:100%;min-height:50px;text-align:left;padding:12px 15px;border-radius:14px;
  border:2px solid var(--line);background:var(--card-2);font-weight:800;font-size:14.5px;color:var(--cream);
  transition:transform .1s;
}
.tq-opt:active{transform:scale(.985)}
.tq-opt.correct{border-color:var(--sage);background:rgba(168,198,134,.15);color:var(--sage)}
.tq-opt.wrong{border-color:var(--coral);background:rgba(242,112,95,.12);color:var(--coral)}
.tq-opt:disabled{cursor:default;opacity:.92}
.tq-note{margin-top:13px;font-size:13px;color:var(--dim);font-weight:700;line-height:1.55;font-style:italic}
.tq-next{
  display:block;width:100%;margin-top:16px;border:none;border-radius:99px;
  background:var(--btn-bg);padding:14px;
  font-family:'Baloo 2',sans-serif;font-weight:800;font-size:16px;color:var(--btn-ink);min-height:50px;
}
.tq-done{
  margin-top:22px;text-align:center;background:var(--card);border:2px solid var(--line);
  border-radius:22px;padding:30px 20px;
}
.tq-done .big{font-size:40px}
.tq-done .score-line{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:24px;margin-top:8px;color:var(--amber)}
.tq-done p{color:var(--dim);font-weight:700;margin-top:8px;font-size:14px}
.tq-intro{margin-top:8px;text-align:center;font-size:13px;color:var(--dim);font-weight:700;line-height:1.6}

/* ============ SETTINGS ============ */
.set-card{
  margin-top:16px;background:var(--card);border:2px solid var(--line);border-radius:18px;
  padding:16px;
}
.set-title{
  font-size:11px;letter-spacing:3px;color:var(--amber);text-transform:uppercase;font-weight:900;
}
.set-note{font-size:12.5px;color:var(--dim);font-weight:600;line-height:1.55;margin-top:8px}
.set-btn{
  display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
  min-height:50px;border-radius:14px;border:2px solid var(--line);
  background:var(--card-2);color:var(--cream);font-weight:800;font-size:14px;margin-top:12px;
}
.set-btn:active{border-color:var(--amber)}
.set-btn.warn{color:var(--coral)}
.set-row{display:flex;gap:10px;margin-top:12px}
.set-row .f-input{margin-top:0}
.gist-id-row{
  margin-top:12px;background:var(--card-2);border:2px solid var(--line);border-radius:14px;
  padding:12px 14px;
}
.gist-id-row .lbl{font-size:10px;letter-spacing:2px;color:var(--dim);text-transform:uppercase;font-weight:900}
.gist-id-text{
  display:block;margin-top:6px;font-family:'Courier Prime',monospace;font-size:14px;
  color:var(--cream);word-break:break-all;-webkit-user-select:all;user-select:all;
}
.set-save{
  flex-shrink:0;min-width:88px;min-height:50px;border:none;border-radius:14px;
  background:var(--btn-bg);color:var(--btn-ink);
  font-family:'Baloo 2',sans-serif;font-weight:800;font-size:15px;
}

/* ============ TAB BAR ============ */
.tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:900;display:flex;gap:4px;
  background:var(--tabbar-bg);border-top:2px solid var(--line);
  padding:7px 10px calc(7px + env(safe-area-inset-bottom));
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
}
.tabbar button{
  flex:1;min-height:54px;border:none;background:none;color:var(--dim);
  font-weight:900;font-size:10px;letter-spacing:1px;text-transform:uppercase;border-radius:14px;
}
.tabbar button .ico{display:block;font-size:20px;margin-bottom:3px}
.tabbar button.active{color:var(--amber);background:rgba(255,180,84,.1)}

/* modals */
.modal-overlay{
  position:fixed;inset:0;background:rgba(18,10,16,.78);display:flex;align-items:flex-end;
  justify-content:center;z-index:1000;padding:16px;
  padding-bottom:calc(16px + env(safe-area-inset-bottom));
}
@media(min-width:600px){.modal-overlay{align-items:center}}
.modal-box{
  background:var(--card);border:2px solid var(--line);border-radius:24px;padding:22px;
  width:100%;max-width:430px;max-height:82vh;overflow-y:auto;-webkit-overflow-scrolling:touch;
}
.modal-box h3{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:22px}

/* ============ PRINT (keepsake PDFs — US Letter book pages) ============ */
/* Keepsake PDF: US Letter book page, framed by a filmstrip on both edges.
   The sprocket gutters also pull the text in to a comfortable reading
   measure — full-width Letter text reads as stretched. */
@page{ size: letter portrait; margin: 0.5in; }
@media print{
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  html,body{background:#F8EEDC;padding:0;margin:0}
  .lights,.tabbar,.toast,#app{display:none !important}
  .scrap-overlay{position:static;inset:auto;overflow:visible;padding:0;background:#F8EEDC}
  .scrap-close,.sp-print,.sp-print-hint,.no-print{display:none !important}
  .scrap-page{
    max-width:none;font-size:12.5px;
    padding:0.22in 0.82in;
    background-color:transparent;
    /* sprocket holes must come FIRST — earlier layers paint on top of later
       ones, so the solid strips are listed last and sit underneath */
    background-image:
      linear-gradient(to bottom, transparent 0 0.10in, #F6ECD8 0.10in 0.24in, transparent 0.24in 0.34in),
      linear-gradient(to bottom, transparent 0 0.10in, #F6ECD8 0.10in 0.24in, transparent 0.24in 0.34in),
      linear-gradient(#2A1E14,#2A1E14),
      linear-gradient(#2A1E14,#2A1E14);
    background-size:
      0.20in 0.34in, 0.20in 0.34in,
      0.46in 100%, 0.46in 100%;
    background-position:
      0.13in top, right 0.13in top,
      left top, right top;
    background-repeat:
      repeat-y, repeat-y,
      no-repeat, no-repeat;
  }
  .yb-cover{page-break-after:always}
  .ks-cover{padding-top:1.1in}
  .ks-page{page-break-after:always}
  .yb-night,.sp-section{page-break-inside:avoid}
  .sp-title{font-size:24px}
  .sp-comic{font-size:14px}
  .sp-scene{font-size:11.5px;line-height:1.5}
  .sp-note{font-size:13px}
  .sp-sticky,.sp-why .why-text{font-size:17px}
  .yb-year{font-size:64px}
}

<script>
'use strict';
/* =====================================================================
   FAMILY MOVIE NIGHT — Ortiz Family · v1.3
   v1.2: quotes render as comic speech bubbles (Comic Neue, alternating
   tails); "favorite scene" renders as a screenplay page (Courier
   Prime, CUT TO: + slugline) in scrapbooks and yearbooks.
   v1.3: Settings > Appearance — Light/Dark/Auto theme and a projector-
   animations on/off/auto toggle. Keepsake pages (scrapbook, yearbook,
   comic bubbles, screenplay excerpts) intentionally stay "paper"-
   colored in both themes; only the app chrome re-themes.
   AI: optional Anthropic key (Settings) powers per-movie After-Credits
   packs — fun facts, trivia, discussion questions — stored as synced
   records so one phone generates and every phone gets them. The app is
   fully usable with no key set.
   Tabs: Nights / Stats / Trivia / Settings.
   Reactions: stars, thought, favorite character, quotes[], memories[],
   family poll (laughed / cried / watch again / seen it before), and
   "why I picked it" for the night's selector.
   Keepsakes: per-night scrapbook (grouped by question) and a Year in
   Review — both print to US Letter PDFs. Settings has export/import
   JSON backups.
   Sync: shared family Gist, safe merge (per-record newest-wins) with
   tombstoned deletes — one memory book across every phone. Offline
   first: localStorage always works; sync retries when back online.
   ===================================================================== */

/* ---------- Arizona time helpers (canonical) ---------- */
var AZ = {
  tz: 'America/Phoenix',
  today: function(){
    return new Intl.DateTimeFormat('en-CA', { timeZone: this.tz }).format(new Date());
  },
  pretty: function(dateStr){
    var p = dateStr.split('-').map(Number);
    var d = new Date(p[0], p[1]-1, p[2]);
    return d.toLocaleDateString('en-US', { weekday:'short', month:'short', day:'numeric' });
  },
  prettyLong: function(dateStr){
    var p = dateStr.split('-').map(Number);
    var d = new Date(p[0], p[1]-1, p[2]);
    return d.toLocaleDateString('en-US', { weekday:'long', month:'long', day:'numeric' });
  },
  monthDay: function(dateStr){
    var p = dateStr.split('-').map(Number);
    var d = new Date(p[0], p[1]-1, p[2]);
    return d.toLocaleDateString('en-US', { month:'short', day:'numeric' });
  },
  daysBetween: function(a, b){
    return Math.round((new Date(b + 'T12:00:00') - new Date(a + 'T12:00:00')) / 86400000);
  },
  addDays: function(dateStr, n){
    var p = dateStr.split('-').map(Number);
    var d = new Date(p[0], p[1]-1, p[2]);
    d.setDate(d.getDate() + n);
    var mm = String(d.getMonth()+1).padStart(2,'0');
    var dd = String(d.getDate()).padStart(2,'0');
    return d.getFullYear() + '-' + mm + '-' + dd;
  },
  nextFriday: function(){
    var t = this.today().split('-').map(Number);
    var d = new Date(t[0], t[1]-1, t[2]);
    var add = (5 - d.getDay() + 7) % 7;
    d.setDate(d.getDate() + add);
    var mm = String(d.getMonth()+1).padStart(2,'0');
    var dd = String(d.getDate()).padStart(2,'0');
    return d.getFullYear() + '-' + mm + '-' + dd;
  }
};

/* ---------- localStorage wrapper (canonical) ---------- */
var Store = {
  ns: 'fmn_',
  get: function(key, fallback){
    if (fallback === undefined) fallback = null;
    try {
      var raw = localStorage.getItem(this.ns + key);
      return raw === null ? fallback : JSON.parse(raw);
    } catch(e){ return fallback; }
  },
  set: function(key, value){
    try { localStorage.setItem(this.ns + key, JSON.stringify(value)); return true; }
    catch(e){ return false; }
  },
  remove: function(key){ localStorage.removeItem(this.ns + key); }
};

/* ---------- appearance: theme + motion (Settings > Appearance) ----------
   Both default to 'auto' (follow the phone), and can be pinned to an
   explicit value. Applied via attribute/class so plain CSS handles the
   rest — no inline styles, no per-element JS. */
function resolveTheme(){
  var pref = Store.get('theme', 'auto');
  if (pref === 'light' || pref === 'dark') return pref;
  return (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark';
}
function applyTheme(){
  var resolved = resolveTheme();
  document.documentElement.setAttribute('data-theme', resolved);
  var mt = document.querySelector('meta[name="theme-color"]');
  if (mt) mt.content = resolved === 'light' ? '#FAF3E8' : '#211820';
}
function resolveMotion(){
  var pref = Store.get('motion', 'auto');
  if (pref === 'on') return true;
  if (pref === 'off') return false;
  return !(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
}
function applyMotion(){
  document.documentElement.classList.toggle('motion-on', resolveMotion());
}
if (window.matchMedia){
  window.matchMedia('(prefers-color-scheme: light)').addEventListener('change', function(){
    if (Store.get('theme', 'auto') === 'auto') applyTheme();
  });
  window.matchMedia('(prefers-reduced-motion: reduce)').addEventListener('change', function(){
    if (Store.get('motion', 'auto') === 'auto') applyMotion();
  });
}

/* ---------- the cast ---------- */
var MEMBERS = [
  { id:'chris',  name:'Chris',  color:'#7FB4E8', onWhite:'#2F6DA8', paper:'#D6E7F7' },
  { id:'kat',    name:'Kat',    color:'#F2705F', onWhite:'#C94F3D', paper:'#FAD9CE' },
  { id:'sedona', name:'Sedona', color:'#A8C686', onWhite:'#6E9155', paper:'#E2EDCF' },
  { id:'river',  name:'River',  color:'#C4A5E8', onWhite:'#7350A8', paper:'#E9DEF8' }
];
/* member colors are tuned for dark cards; on light cards use the deeper
   on-paper tone so names stay readable */
function memberInk(m){
  return resolveTheme() === 'light' ? m.onWhite : m.color;
}
function memberById(id){
  for (var i=0;i<MEMBERS.length;i++) if (MEMBERS[i].id === id) return MEMBERS[i];
  return MEMBERS[0];
}

/* ---------- TMDB ---------- */
var TMDB_IMG = 'https://image.tmdb.org/t/p/w342';
function detectCred(raw){
  var t = (raw || '').trim();
  if (!t) return null;
  if (t.indexOf('eyJ') === 0) return { type:'v4', value:t };
  return { type:'v3', value:t };
}
function loadTmdbCred(){
  var own = Store.get('tmdb_key');
  if (own) return detectCred(own);
  try {
    var raw = localStorage.getItem('sr_tmdb_key');
    if (raw){
      var v = JSON.parse(raw);
      if (v && v.type && v.value) return v;
    }
  } catch(e){}
  return null;
}
function tmdbSearch(query){
  var cred = loadTmdbCred();
  if (!cred) return Promise.reject(new Error('NO_KEY'));
  var url = 'https://api.themoviedb.org/3/search/movie?include_adult=false&query=' + encodeURIComponent(query);
  var headers = {};
  if (cred.type === 'v4') headers['Authorization'] = 'Bearer ' + cred.value;
  else url += '&api_key=' + encodeURIComponent(cred.value);
  return fetch(url, { headers: headers }).then(function(res){
    if (!res.ok) throw new Error('TMDB ' + res.status);
    return res.json();
  });
}

/* ---------- data ---------- */
var data = Store.get('data', { records:{} });
if (!data.records) data.records = {};

function saveData(){
  data.updatedAt = Date.now();
  if (!Store.set('data', data)) toast('Storage full — could not save');
  scheduleSync();
}

/* ---------- family Gist sync (safe merge + tombstones — canonical) ----------
   Rules that prevent the data-loss bugs other family apps hit:
   - every record has id + updatedAt; per-record newest-wins on merge
   - deletes are tombstones ({deleted:true}), purged after 60 days
   - on save: fetch remote FIRST, merge, then write — never blind-overwrite */
var Sync = {
  filename: 'family-movie-night-data.json',
  gistId: function(){ return Store.get('gist_id') || ''; },
  token: function(){ return Store.get('gist_token') || ''; },
  configured: function(){ return !!(this.gistId() && this.token()); },
  headers: function(){
    return {
      'Authorization': 'Bearer ' + this.token(),
      'Accept': 'application/vnd.github+json'
    };
  },
  pullRemote: function(){
    var self = this;
    return fetch('https://api.github.com/gists/' + self.gistId(), { headers: self.headers() })
      .then(function(res){
        if (!res.ok) throw new Error('Gist fetch failed: ' + res.status);
        return res.json();
      })
      .then(function(gist){
        var file = gist.files[self.filename];
        if (!file) return { records:{} };
        if (file.truncated){
          return fetch(file.raw_url).then(function(r){ return r.text(); })
            .then(function(t){ return JSON.parse(t || '{"records":{}}'); });
        }
        return JSON.parse(file.content || '{"records":{}}');
      });
  },
  merge: function(local, remote){
    var out = { records: {} };
    var id;
    for (id in (remote.records || {})) out.records[id] = remote.records[id];
    for (id in (local.records || {})){
      var rec = local.records[id];
      var r = out.records[id];
      if (!r || (rec.updatedAt || 0) > (r.updatedAt || 0)) out.records[id] = rec;
    }
    var cutoff = Date.now() - 60 * 86400000;
    for (id in out.records){
      var t = out.records[id];
      if (t && t.deleted && (t.updatedAt || 0) < cutoff) delete out.records[id];
    }
    return out;
  },
  save: function(localData){
    var self = this;
    var mergedHolder = localData;
    return self.pullRemote()
      .catch(function(){ return null; }) // offline or first save — proceed with local
      .then(function(remote){
        var merged = remote ? self.merge(localData, remote) : localData;
        mergedHolder = merged;
        // demo nights stay local — never seed the family gist with sample data
        var upload = { records:{} };
        for (var id in merged.records){
          if (!merged.records[id].sample) upload.records[id] = merged.records[id];
        }
        return fetch('https://api.github.com/gists/' + self.gistId(), {
          method: 'PATCH',
          headers: Object.assign({ 'Content-Type':'application/json' }, self.headers()),
          body: JSON.stringify({ files: (function(){
            var f = {};
            f[self.filename] = { content: JSON.stringify(upload, null, 2) };
            return f;
          })() })
        });
      })
      .then(function(res){
        if (!res.ok) throw new Error('Gist save failed: ' + res.status);
        Store.set('data', mergedHolder);
        Store.set('last_sync', Date.now());
        return mergedHolder;
      });
  },
  load: function(){
    var self = this;
    var local = Store.get('data', { records:{} });
    return self.pullRemote().then(function(remote){
      var merged = self.merge(local, remote);
      Store.set('data', merged);
      Store.set('last_sync', Date.now());
      return merged;
    });
  },
  createGist: function(){
    var self = this;
    return fetch('https://api.github.com/gists', {
      method: 'POST',
      headers: Object.assign({ 'Content-Type':'application/json' }, self.headers()),
      body: JSON.stringify({
        description: 'family-movie-night-data',
        public: false,
        files: (function(){
          var f = {};
          f[self.filename] = { content: '{"records":{}}' };
          return f;
        })()
      })
    }).then(function(res){
      if (!res.ok) throw new Error('Gist create failed: ' + res.status);
      return res.json();
    }).then(function(gist){
      Store.set('gist_id', gist.id);
      return gist.id;
    });
  }
};
var syncTimer = null;
var syncBusy = false;
function overlaysOpen(){
  return !!document.querySelector('.modal-overlay') || !!document.querySelector('.scrap-overlay');
}
function adoptMerged(merged){
  var changed = JSON.stringify(merged) !== JSON.stringify(data);
  data = merged;
  if (changed && !overlaysOpen()) render();
  return changed;
}
function scheduleSync(){
  if (!Sync.configured()) return;
  clearTimeout(syncTimer);
  syncTimer = setTimeout(runSync, 1500);
}
function runSync(){
  if (!Sync.configured() || syncBusy) return;
  syncBusy = true;
  Sync.save(data).then(function(merged){
    syncBusy = false;
    adoptMerged(merged);
  }).catch(function(){
    syncBusy = false;
    toast('Saved on this phone — family sync will retry');
  });
}
function pullSync(quiet){
  if (!Sync.configured() || syncBusy) return;
  syncBusy = true;
  Sync.load().then(function(merged){
    syncBusy = false;
    var changed = adoptMerged(merged);
    if (!quiet) toast(changed ? 'Synced — new family entries in! 🍿' : 'Synced — all caught up ✓');
  }).catch(function(){
    syncBusy = false;
    if (!quiet) toast('Couldn’t reach the family gist — check token & connection');
  });
}
document.addEventListener('visibilitychange', function(){
  if (document.visibilityState === 'visible' && !overlaysOpen()) pullSync(true);
});
function liveRecords(type){
  var out = [];
  for (var id in data.records){
    var r = data.records[id];
    if (r && !r.deleted && r.type === type) out.push(r);
  }
  return out;
}
function nights(){
  return liveRecords('night').sort(function(a,b){
    return a.date === b.date ? (b.updatedAt||0)-(a.updatedAt||0) : (a.date < b.date ? 1 : -1);
  });
}
function reactionFor(nightId, memberId){
  var r = data.records['rx_' + nightId + '_' + memberId];
  return (r && !r.deleted) ? r : null;
}
function rxQuotes(r){
  if (!r) return [];
  if (r.quotes && r.quotes.length) return r.quotes;
  return r.quote ? [r.quote] : [];
}
function rxMemories(r){
  if (!r) return [];
  if (r.memories && r.memories.length) return r.memories;
  return r.memory ? [r.memory] : [];
}
function rxHasContent(r){
  return !!(r && (r.stars > 0 || (r.thought||'').length || (r.character||'').length ||
    (r.scene||'').length || (r.why||'').length || rxQuotes(r).length || rxMemories(r).length || r.poll));
}
function reactionsFor(nightId){
  var out = [];
  for (var i=0;i<MEMBERS.length;i++){
    var r = reactionFor(nightId, MEMBERS[i].id);
    if (r) out.push(r);
  }
  return out;
}
function familyAvg(nightId){
  var rs = reactionsFor(nightId).filter(function(r){ return r.stars > 0; });
  if (!rs.length) return null;
  var sum = 0;
  for (var i=0;i<rs.length;i++) sum += rs[i].stars;
  return sum / rs.length;
}
function nextPicker(){
  var list = nights();
  if (!list.length) return MEMBERS[0];
  var lastId = list[0].pickedBy;
  for (var i=0;i<MEMBERS.length;i++){
    if (MEMBERS[i].id === lastId) return MEMBERS[(i+1) % MEMBERS.length];
  }
  return MEMBERS[0];
}
/* ---------- quote matching ----------
   When two people save the same line (or one saves a longer version of
   it) we show it once, credited to everyone who picked it. */
function normQuote(s){
  return String(s || '')
    .toLowerCase()
    .replace(/[‘’“”"']/g, '')
    .replace(/[^a-z0-9\s]/g, ' ')
    .replace(/\s+/g, ' ')
    .trim();
}
function quoteSimilar(a, b){
  var na = normQuote(a), nb = normQuote(b);
  if (!na || !nb) return false;
  if (na === nb) return true;
  // one is a longer telling of the other ("Weaknesses: cake" inside
  // "Strengths: none. Weaknesses: cake") — guarded so tiny lines like
  // "hey" don't swallow everything they appear in
  if (na.length >= 8 && nb.length >= 8 && (na.indexOf(nb) !== -1 || nb.indexOf(na) !== -1)) return true;
  // near-identical wording (Dice coefficient over word tokens)
  var ta = na.split(' '), tb = nb.split(' ');
  if (ta.length < 3 || tb.length < 3) return false;
  var pool = {};
  tb.forEach(function(t){ pool[t] = (pool[t] || 0) + 1; });
  var overlap = 0;
  ta.forEach(function(t){ if (pool[t]) { overlap++; pool[t]--; } });
  return (2 * overlap) / (ta.length + tb.length) >= 0.8;
}
/* entries: [{text, member}] -> [{text, members:[...]}] */
function groupQuotes(entries){
  var groups = [];
  entries.forEach(function(e){
    if (!e.text) return;
    for (var i = 0; i < groups.length; i++){
      if (quoteSimilar(groups[i].text, e.text)){
        if (groups[i].members.indexOf(e.member) === -1) groups[i].members.push(e.member);
        // keep the fullest wording as the one we print
        if (String(e.text).length > String(groups[i].text).length) groups[i].text = e.text;
        return;
      }
    }
    groups.push({ text: e.text, members: [e.member] });
  });
  return groups;
}
function nightQuoteGroups(nightId){
  var entries = [];
  MEMBERS.forEach(function(m){
    rxQuotes(reactionFor(nightId, m.id)).forEach(function(q){
      entries.push({ text: q, member: m });
    });
  });
  return groupQuotes(entries);
}
function memberNames(list){
  var names = list.map(function(m){ return m.name; });
  if (names.length <= 1) return names.join('');
  if (names.length === 2) return names[0] + ' & ' + names[1];
  return names.slice(0, -1).join(', ') + ' & ' + names[names.length - 1];
}
function allQuotes(){
  var out = [];
  var ns = nights();
  for (var i=0;i<ns.length;i++){
    // group per movie so the same line in two films stays separate
    nightQuoteGroups(ns[i].id).forEach(function(g){
      out.push({ quote: g.text, members: g.members, movie: ns[i].title });
    });
  }
  return out;
}
function nightNearDate(dateStr){
  var list = nights();
  for (var i=0;i<list.length;i++){
    if (Math.abs(AZ.daysBetween(dateStr, list[i].date)) <= 2) return list[i];
  }
  return null;
}
function pollTally(nightId){
  var t = { laughed:[], cried:[], rewatch:[], seenBefore:[], answered:0 };
  MEMBERS.forEach(function(m){
    var r = reactionFor(nightId, m.id);
    if (r && r.poll){
      t.answered++;
      if (r.poll.laughed) t.laughed.push(m);
      if (r.poll.cried) t.cried.push(m);
      if (r.poll.rewatch) t.rewatch.push(m);
      if (r.poll.seenBefore) t.seenBefore.push(m);
    }
  });
  return t;
}

/* ---------- tiny DOM helpers ---------- */
function el(tag, cls, text){
  var n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined && text !== null) n.textContent = text;
  return n;
}
function toast(msg){
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(function(){ t.classList.remove('show'); }, 2600);
}
/* ---------- stars (supports halves) ----------
   Ratings are stored as numbers in 0.5 steps. Whole-number ratings saved
   by earlier versions stay valid. Each star is an outline glyph with a
   filled glyph layered on top, clipped to 0 / 50 / 100% width. */
function clampStars(n){
  n = Math.round((Number(n) || 0) * 2) / 2;
  return Math.max(0, Math.min(5, n));
}
function starFillPct(rating, position){
  if (rating >= position) return 100;
  if (rating >= position - 0.5) return 50;
  return 0;
}
/* "3½" — for toasts and hints */
function starText(n){
  n = clampStars(n);
  var whole = Math.floor(n);
  return (n - whole >= 0.5) ? (whole + '½') : String(whole);
}
function starUnit(pct){
  var st = el('span','st');
  st.appendChild(document.createTextNode('☆'));
  var fill = el('span','fill','★');
  fill.style.width = pct + '%';
  st.appendChild(fill);
  return st;
}
function starsNode(n, cls){
  n = clampStars(n);
  var span = el('span', cls || 'stars');
  for (var i=1;i<=5;i++) span.appendChild(starUnit(starFillPct(n, i)));
  return span;
}
function confettiBurst(count){
  var colors = ['#FFB454','#F2705F','#A8C686','#8FB8DE','#FFC94A','#FFEFD9'];
  var wrap = el('div','confetti');
  var n = count || 44;
  for (var i=0;i<n;i++){
    var p = document.createElement('i');
    p.style.left = (Math.random()*100) + 'vw';
    p.style.background = colors[i % colors.length];
    p.style.animationDuration = (1.6 + Math.random()*1.4) + 's';
    p.style.animationDelay = (Math.random()*0.4) + 's';
    p.style.transform = 'rotate(' + Math.floor(Math.random()*360) + 'deg)';
    wrap.appendChild(p);
  }
  document.body.appendChild(wrap);
  setTimeout(function(){ wrap.remove(); }, 3600);
}

/* ---------- generic modal shell ---------- */
function openModal(build){
  var overlay = el('div','modal-overlay');
  var box = el('div','modal-box');
  overlay.appendChild(box);
  overlay.addEventListener('click', function(e){ if (e.target === overlay) overlay.remove(); });
  build(box, function close(){ overlay.remove(); });
  document.body.appendChild(overlay);
  return overlay;
}

        id:id, type:'reaction', nightId:night.id, member:member.id,
        stars:stars, why: (isPicker && why) ? why.value.trim() : (existing ? existing.why || '' : ''),
        thought:thought.value.trim(), character:character.value.trim(), scene:scene.value.trim(),
        quotes:quotes, memories:memories, poll:poll,
        updatedAt: Date.now()
      };
      saveData();
      close();
      render();
      if (stars === 5) confettiBurst();
      toast(stars ? member.name + ' gave it ' + starText(stars) + ' stars' : 'Saved ' + member.name + '’s reaction');
    });
    row.appendChild(cancel); row.appendChild(save);
    box.appendChild(row);
  });
}

/* ---------- delete a night (tombstone) ---------- */
function deleteNight(night){
  confirmModal({
    title:'Remove this night?',
    message:'"' + night.title + '" (' + AZ.pretty(night.date) + ') and everyone’s reactions will be removed.',
    confirmText:'Delete night',
    onConfirm: function(){
      var now = Date.now();
      data.records[night.id] = { id:night.id, type:'night', deleted:true, updatedAt:now };
      MEMBERS.forEach(function(m){
        var rid = 'rx_' + night.id + '_' + m.id;
        if (data.records[rid]) data.records[rid] = { id:rid, type:'reaction', deleted:true, updatedAt:now };
      });
      saveData();
      render();
      toast('Night removed');
    }
  });
}

/* renders the by-question groups for one night into container */
function buildNightKeepsake(container, night){
  var rots = [-1.4, 1.1, -0.7, 1.6];
  var picker = memberById(night.pickedBy);
  var pickerRx = reactionFor(night.id, picker.id);

  /* why the picker chose it */
  if (pickerRx && pickerRx.why){
    var whySec = spSection('🎬 Why ' + picker.name + ' picked it');
    var why = el('div','sp-why');
    why.appendChild(spTag(picker));
    why.appendChild(el('div','why-text','“' + pickerRx.why + '”'));
    whySec.appendChild(why);
    container.appendChild(whySec);
  }

  /* ratings */
  var rated = MEMBERS.filter(function(m){
    var r = reactionFor(night.id, m.id);
    return r && r.stars > 0;
  });
  if (rated.length){
    var rateSec = spSection('⭐ Our ratings');
    var rates = el('div','sp-rates');
    rated.forEach(function(m){
      var r = reactionFor(night.id, m.id);
      var box = el('div','sp-rate');
      box.appendChild(spTag(m));
      box.appendChild(starsNode(r.stars));
      rates.appendChild(box);
    });
    rateSec.appendChild(rates);
    container.appendChild(rateSec);
  }

  /* what we thought */
  var thoughts = MEMBERS.filter(function(m){
    var r = reactionFor(night.id, m.id);
    return r && r.thought;
  });
  if (thoughts.length){
    var thoSec = spSection('💭 What we thought');
    thoughts.forEach(function(m, i){
      var r = reactionFor(night.id, m.id);
      var note = el('div','sp-note');
      note.appendChild(spTag(m));
      note.appendChild(document.createTextNode(' “' + r.thought + '”'));
      note.style.transform = 'rotate(' + (rots[i % 4] * 0.5) + 'deg)';
      thoSec.appendChild(note);
    });
    container.appendChild(thoSec);
  }

  /* favorite characters */
  var chars = MEMBERS.filter(function(m){
    var r = reactionFor(night.id, m.id);
    return r && r.character;
  });
  if (chars.length){
    var chSec = spSection('🌟 Favorite characters');
    chars.forEach(function(m){
      var r = reactionFor(night.id, m.id);
      var line = el('div','sp-char-line');
      line.appendChild(spTag(m));
      line.appendChild(document.createTextNode(' ' + r.character));
      chSec.appendChild(line);
    });
    container.appendChild(chSec);
  }

  /* quotes — comic speech bubbles, tails alternating sides.
     Matching lines from different people share one bubble. */
  var qGroups = nightQuoteGroups(night.id);
  if (qGroups.length){
    var qSec = spSection('💬 Quotes we kept');
    qGroups.forEach(function(g, qi){
      var wrap = el('div','sp-comic-wrap' + (qi % 2 ? ' flip' : ''));
      var bubble = el('div','sp-comic', g.text);
      bubble.style.transform = 'rotate(' + (rots[qi % 4] * 0.6) + 'deg)';
      wrap.appendChild(bubble);
      var tags = el('div','sp-tags');
      g.members.forEach(function(m){ tags.appendChild(spTag(m)); });
      if (g.members.length > 1) tags.appendChild(el('span','sp-both','— both said it!'));
      wrap.appendChild(tags);
      qSec.appendChild(wrap);
    });
    container.appendChild(qSec);
  }

  /* favorite scenes — screenplay pages */
  var sceneMembers = MEMBERS.filter(function(m){
    var r = reactionFor(night.id, m.id);
    return r && r.scene;
  });
  if (sceneMembers.length){
    var scSec = spSection('🎞 Favorite scenes');
    sceneMembers.forEach(function(m){
      var r = reactionFor(night.id, m.id);
      var pageEl = el('div','sp-scene');
      pageEl.appendChild(el('div','cut','Cut to:'));
      pageEl.appendChild(el('div','slug', m.name + '’s favorite scene'));
      pageEl.appendChild(el('div','action', r.scene));
      scSec.appendChild(pageEl);
    });
    container.appendChild(scSec);
  }

  /* memories */
  var anyMems = false;
  var mSec = spSection('📌 Memories from the couch');
  var mi = 0;
  MEMBERS.forEach(function(m){
    var r = reactionFor(night.id, m.id);
    rxMemories(r).forEach(function(mem){
      anyMems = true;
      var strip = el('div','sp-strip');
      strip.style.background = m.paper;
      strip.appendChild(spTag(m));
      strip.appendChild(document.createTextNode(' ' + mem));
      strip.style.transform = 'rotate(' + (rots[(mi+2) % 4] * 0.7) + 'deg)';
      mSec.appendChild(strip);
      mi++;
    });
  });
  if (anyMems) container.appendChild(mSec);

  /* the family poll */
  var tally = pollTally(night.id);
  if (tally.answered){
    var pSec = spSection('🗳 The family poll');
    [
      { label:'😂 Did we laugh?', list:tally.laughed },
      { label:'😢 Did we cry?', list:tally.cried },
      { label:'🔁 Would we see it again?', list:tally.rewatch },
      { label:'👀 Seen it before?', list:tally.seenBefore }
    ].forEach(function(pq){
      var row = el('div','sp-poll-row');
      row.appendChild(el('span','pq', pq.label));
      row.appendChild(el('span','tally', pq.list.length + '/' + tally.answered));
      var dots = el('span','sp-pdots');
      MEMBERS.forEach(function(m){
        var yes = pq.list.indexOf(m) !== -1;
        var d = el('span','sp-pdot', m.name.charAt(0));
        if (yes){
          d.style.background = m.onWhite;
          d.style.borderColor = m.onWhite;
          d.style.color = '#fff';
        }
        dots.appendChild(d);
      });
      row.appendChild(dots);
      pSec.appendChild(row);
    });
    container.appendChild(pSec);
  }
}

/* ---------- THE COMPLETE COLLECTION (every night, all time) ----------
   Cover → table of contents → full stats → every movie in order. */
function collectionStats(list){
  var s = {
    nights: list.length, avgs: [], quotes: 0, memories: 0, scenes: 0,
    firstWatches: 0, laughs: 0, cries: 0, rewatch: 0,
    best: null, worst: null, mostQuoted: null, split: null,
    perMember: {}
  };
  MEMBERS.forEach(function(m){
    s.perMember[m.id] = { m:m, picks:0, given:[], received:[], fives:0, quotes:0, memories:0 };
  });
  list.forEach(function(n){
    var avg = familyAvg(n.id);
    if (avg !== null){
      s.avgs.push(avg);
      if (!s.best || avg > s.best.avg) s.best = { n:n, avg:avg };
      if (!s.worst || avg < s.worst.avg) s.worst = { n:n, avg:avg };
      if (s.perMember[n.pickedBy]) s.perMember[n.pickedBy].received.push(avg);
    }
    if (s.perMember[n.pickedBy]) s.perMember[n.pickedBy].picks++;

    var nightQuotes = 0;
    MEMBERS.forEach(function(m){
      var r = reactionFor(n.id, m.id);
      if (!r) return;
      var pm = s.perMember[m.id];
      if (r.stars){ pm.given.push(r.stars); if (r.stars === 5) pm.fives++; }
      var qn = rxQuotes(r).length, mn = rxMemories(r).length;
      pm.quotes += qn; pm.memories += mn;
      s.quotes += qn; s.memories += mn; nightQuotes += qn;
      if (r.scene) s.scenes++;
      if (r.poll){
        if (r.poll.laughed) s.laughs++;
        if (r.poll.cried) s.cries++;
        if (r.poll.rewatch) s.rewatch++;
        if (!r.poll.seenBefore) s.firstWatches++;
      }
    });
    if (nightQuotes && (!s.mostQuoted || nightQuotes > s.mostQuoted.count)){
      s.mostQuoted = { n:n, count:nightQuotes };
    }
    var rs = reactionsFor(n.id).filter(function(r){ return r.stars > 0; });
    if (rs.length >= 2){
      var mn2 = 6, mx = 0, mnW = null, mxW = null;
      rs.forEach(function(r){
        if (r.stars < mn2){ mn2 = r.stars; mnW = memberById(r.member).name; }
        if (r.stars > mx){ mx = r.stars; mxW = memberById(r.member).name; }
      });
      if (mx - mn2 > 0 && (!s.split || mx - mn2 > s.split.spread)){
        s.split = { n:n, spread:mx-mn2, lo:mn2, hi:mx, loWho:mnW, hiWho:mxW };
      }
    }
  });
  return s;
}

/* ---------- Claude: after-credits packs (browser-direct, canonical) ---------- */
function askClaude(prompt, opts){
  opts = opts || {};
  var key = Store.get('anthropic_key');
  if (!key) return Promise.reject(new Error('NO_KEY'));
  return fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'x-api-key': key,
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-access': 'true'
    },
    body: JSON.stringify({
      model: 'claude-sonnet-4-6',
      max_tokens: opts.maxTokens || 1400,
      system: opts.system || undefined,
      messages: [{ role:'user', content: prompt }]
    })
  }).then(function(res){
    if (res.status === 401) throw new Error('BAD_KEY');
    if (!res.ok) throw new Error('Claude API error: ' + res.status);
    return res.json();
  }).then(function(d){
    return d.content.filter(function(b){ return b.type === 'text'; })
      .map(function(b){ return b.text; }).join('\n');
  });
}
function aiPackFor(nightId){
  var r = data.records['ai_' + nightId];
  return (r && !r.deleted && r.facts) ? r : null;
}
function generatePack(night){
  var system = 'You create after-movie discussion packs for a family movie night. '
    + 'The family: Chris and Kat (parents), Sedona and River (kids). '
    + 'Everything must be family-friendly, warm, and fun. Avoid spoiling major twists in the facts; '
    + 'the family has JUST watched the movie, so trivia and discussion questions may reference the plot freely.';
  var prompt = 'Movie: "' + night.title + '"' + (night.year ? ' (' + night.year + ')' : '') + '.\n'
    + 'Respond with ONLY valid JSON, no markdown fences, exactly this shape:\n'
    + '{"facts":["5 short, surprising behind-the-scenes fun facts about this movie"],'
    + '"trivia":[{"q":"question about this movie","opts":["4 options"],"a":0,"note":"one-line fun explanation"} x3],'
    + '"talk":["3 discussion questions for the family to talk about together after watching"]}';
  return askClaude(prompt, { system: system, maxTokens: 1600 }).then(function(text){
    var t = text.trim();
    t = t.replace(/^```(?:json)?\s*/i, '').replace(/\s*```$/, '');
    var obj = JSON.parse(t);
    if (!obj || !obj.facts || !obj.facts.length || !obj.trivia || !obj.talk) throw new Error('BAD_SHAPE');
    var rec = {
      id: 'ai_' + night.id, type: 'ai', nightId: night.id, title: night.title,
      facts: obj.facts.slice(0, 6),
      trivia: obj.trivia.slice(0, 4),
      talk: obj.talk.slice(0, 4),
      updatedAt: Date.now()
    };
    if (night.sample) rec.sample = true; // demo packs stay off the family gist
    data.records[rec.id] = rec;
    saveData();
    return rec;
  });
}

/* ---------- export / import ---------- */
function exportBackup(){
  try {
    var blob = new Blob([JSON.stringify(data, null, 2)], { type:'application/json' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'family-movie-night-backup-' + AZ.today() + '.json';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function(){ URL.revokeObjectURL(a.href); }, 4000);
    toast('Backup exported 📦');
  } catch(e){
    toast('Export failed — try again');
  }
}
function importBackup(file){
  var reader = new FileReader();
  reader.onload = function(){
    try {
      var incoming = JSON.parse(reader.result);
      if (!incoming || typeof incoming.records !== 'object') throw new Error('bad shape');
      var added = 0, updated = 0;
      for (var id in incoming.records){
        var rec = incoming.records[id];
        if (!rec || !rec.id) continue;
        var local = data.records[id];
        if (!local){ data.records[id] = rec; added++; }
        else if ((rec.updatedAt || 0) > (local.updatedAt || 0)){ data.records[id] = rec; updated++; }
      }
      saveData();
      render();
      toast('Imported: ' + added + ' new, ' + updated + ' updated ✓');
    } catch(e){
      toast('That file doesn’t look like a Movie Night backup');
    }
  };
  reader.readAsText(file);
}

function shuffledOrder(n){
  var arr = [];
  for (var i=0;i<n;i++) arr.push(i);
  for (var j=arr.length-1;j>0;j--){
    var k = Math.floor(Math.random()*(j+1));
    var tmp = arr[j]; arr[j] = arr[k]; arr[k] = tmp;
  }
  return arr;
}
